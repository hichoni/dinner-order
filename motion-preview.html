<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다맛다 모션</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="brand-motion.css"><style>*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:14px Pretendard,sans-serif}#app{width:100%;min-height:100dvh;display:grid;place-items:center}.brand-loading{padding:25px 0}.send-curtain{background:var(--bg);backdrop-filter:none}.send-panel{padding:0}.send-finish{font-family:inherit}.brand-loading .brand-motion{width:250px}.preview-title{position:absolute;top:24px;left:0;right:0;font-size:12px;color:var(--sub);text-align:center}.send-curtain{z-index:1}</style></head><body><div id="app"></div><script src="assets/brand-icons.js"></script><script src="brand-motion.js"></script><script src="motion.js"></script><script>
const params=new URLSearchParams(location.search),kind=params.get('state')||'loading';
const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
applyPalette(params.get('palette')||'sky');
let demoTimer,deadline=0,remaining=2800;
function replay(){
 clearTimeout(demoTimer);dismissSendCurtain(false);document.documentElement.classList.remove('motion-paused');
 if(kind==='loading'){document.getElementById('app').innerHTML=brandLoadingView();return;}
 sendingCurtain();
 if(kind==='complete'){sendCurtain.dataset.started=String(performance.now()-3000);finishSendCurtain();}
 else {remaining=2800;deadline=performance.now()+remaining;demoTimer=setTimeout(finishSendCurtain,remaining);}
 const button=sendCurtain.querySelector('.send-finish');button.textContent='다시 보기 ↻';button.addEventListener('click',replay);
}
replay();
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;if(e.data?.type==='replay')replay();if(e.data?.type==='pause'){document.documentElement.classList.toggle('motion-paused',e.data.paused);if(kind==='sending'&&sendCurtain&&!sendCurtain.classList.contains('done')){if(e.data.paused){remaining=Math.max(0,deadline-performance.now());clearTimeout(demoTimer);}else{deadline=performance.now()+remaining;demoTimer=setTimeout(finishSendCurtain,remaining);}}}if(e.data?.type==='palette')applyPalette(e.data.palette);});
</script></body></html>
