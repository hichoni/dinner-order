/* 저녁에 뭐 먹을래? — 배달앱처럼 한 손으로 쓰는 모바일 화면.
   민트 한 가지 색 + 슬롯·포인트에만 노랑, 제목은 둥근 주아체. 가게 사진 대신 음식 그림을 접시처럼 겹친 썸네일. 아래 탭 4개. */
:root{
  --mint:#10b3a6;--mint-d:#0a857c;--mint-l:#dcf4f1;--mint-ll:#eefaf8;
  --ink:#16232a;--sub:#5f7078;--mute:#94a3a9;--line:#e5ebed;--bg:#f3f6f7;--card:#fff;
  --red:#e5484d;--red-l:#fdecec;--yellow:#ffcf3f;--yellow-l:#fff4cf;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --nav-h:64px;--top-h:58px;--r:20px;
  --sh:0 1px 2px rgba(16,35,42,.05),0 6px 18px rgba(16,35,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
#app.view-admin,#app.view-who,#app.view-pin{padding-bottom:40px}
#app.view-map{padding-bottom:0}
#app.enter>*:not(.nav):not(.cartbar){animation:enter .22s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
h1,h2,.display{font-family:var(--display);font-weight:400;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1.3rem;margin:24px 0 10px}
h2 small{font-family:var(--body);font-size:.85rem;color:var(--mute);font-weight:800;margin-left:2px}
.muted{color:var(--sub);font-size:.88rem;line-height:1.5}
.eyebrow{font-size:.78rem;font-weight:800;color:var(--mint-d);letter-spacing:.02em}
.wrap{padding:14px 16px}

/* 위 막대 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;min-height:var(--top-h);background:rgba(243,246,247,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);padding:6px 60px 6px 14px;display:flex;align-items:center;gap:8px}
.top h1{font-size:1.35rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{background:var(--card);border:0;font-size:1.5rem;line-height:1;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;padding:0 0 3px;color:var(--ink);box-shadow:var(--sh)}
.chip-who{background:var(--card);border:0;color:var(--ink);border-radius:999px;padding:7px 12px 7px 9px;font-weight:800;font-size:.85rem;white-space:nowrap;box-shadow:var(--sh)}
.home-top .where{flex:1;min-width:0;border:0;background:none;text-align:left;padding:2px 0;display:flex;flex-direction:column}
.home-top .where small{font-size:.72rem;font-weight:800;color:var(--mute)}
.home-top .where b{font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-top .where b span{color:var(--mint-d);font-size:.8rem}

/* 아래 탭 */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:25;width:min(520px,100%);background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px))}
.nav-i{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--mute);border-radius:14px}
.nav-i i{font-style:normal;font-size:1.3rem;filter:grayscale(1);opacity:.6;transition:transform .15s}
.nav-i span{font-size:.72rem;font-weight:800}
.nav-i.on{color:var(--ink)}
.nav-i.on i{filter:none;opacity:1;transform:translateY(-1px) scale(1.08)}
.nav-badge{position:absolute;top:1px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:999px;min-width:19px;height:19px;font-size:.7rem;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.nav-dot{position:absolute;top:6px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}
.nav-dot.done{background:var(--mint)}
.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{30%{transform:scale(1.45)}}

/* 공통 */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.notice{background:var(--yellow-l);border-radius:14px;padding:11px 13px;font-size:.9rem;margin:10px 0;line-height:1.5}
.notice.red{background:var(--red-l)}
.notice.mint{background:var(--mint-l)}
.input{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 13px;background:var(--card)}
.input:focus{outline:none;border-color:var(--mint)}
.btn{border:0;border-radius:16px;padding:14px 16px;font-weight:800;background:var(--mint);color:#fff;white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--mint-d);box-shadow:inset 0 0 0 2px var(--mint)}
.btn.gray{background:#e8eef0;color:var(--ink)}
.btn.red{background:var(--red)}
.btn.block{width:100%;padding:16px;font-size:1.05rem}
.btn:disabled{opacity:.45}
.small-btn{display:inline-flex;align-items:center;gap:4px;border:0;background:#eaf0f1;border-radius:11px;padding:8px 11px;font-size:.82rem;font-weight:800;text-decoration:none;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:.74rem;font-weight:800;border-radius:7px;padding:2px 7px;background:#eef2f3;color:var(--sub)}
.chip.mint{background:var(--mint-l);color:var(--mint-d)}
.chip.warn{background:var(--yellow-l);color:#866000}
.tag{display:inline-block;font-size:.7rem;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:4px;background:var(--mint-l);color:var(--mint-d)}
.tag.hot{background:#ffe7e3;color:#c43a22}.tag.kid{background:var(--yellow-l);color:#866000}
.footer-link{display:block;margin:28px auto 0;background:none;border:0;color:var(--mute);font-size:.85rem;text-decoration:underline}
.btn:focus-visible,.small-btn:focus-visible,.nav-i:focus-visible,.store:focus-visible,.ddal:focus-visible,.seg button:focus-visible,.cat:focus-visible,.pop-card:focus-visible,.menu-main:focus-visible,.sorts button:focus-visible,.who-btn:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* 가게 그림(썸네일): 대표 음식 + 메뉴 음식 두 개 */
.thumb{position:relative;flex:0 0 auto;width:92px;height:92px;border-radius:18px;overflow:hidden;background:radial-gradient(120% 100% at 25% 15%,rgba(255,255,255,.75),rgba(255,255,255,0) 55%),var(--c,#eef2f3)}
.thumb::before{content:"";position:absolute;left:50%;top:54%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 6px 14px rgba(0,0,0,.06)}
.thumb .t-main{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:2.7rem;filter:drop-shadow(0 4px 4px rgba(0,0,0,.15))}
.thumb .t-side{position:absolute;font-size:1.2rem;filter:drop-shadow(0 2px 2px rgba(0,0,0,.12))}
.thumb .t0{right:8%;top:8%;transform:rotate(14deg)}
.thumb .t1{left:8%;bottom:8%;transform:rotate(-12deg)}
.thumb.sm{width:52px;height:52px;border-radius:14px}.thumb.sm .t-main{font-size:1.7rem}.thumb.sm .t-side{display:none}
.thumb.md{width:76px;height:76px}.thumb.md .t-main{font-size:2.3rem}.thumb.md .t-side{font-size:1rem}
.thumb.lg{width:100%;height:200px;border-radius:0}.thumb.lg .t-main{font-size:5.2rem}.thumb.lg .t-side{font-size:2.4rem}.thumb.lg::before{width:150px}
.thumb.lg .t0{right:22%;top:14%}.thumb.lg .t1{left:22%;bottom:14%}

/* 누가 주문? */
.who-hero{background:var(--mint);color:#fff;padding:28px 20px 26px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
.who-hero::after{content:"🍗🍕🍜🍙🥟🍔";position:absolute;right:-10px;bottom:-14px;font-size:2.6rem;opacity:.18;letter-spacing:4px;transform:rotate(-8deg)}
.who-badge{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:800}
.who-hero h1{margin:12px 0 6px;font-size:2.3rem;line-height:1.1}
.who-hero p{margin:0 0 14px;opacity:.95;font-weight:600}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.who-btn{background:var(--card);border:0;border-radius:18px;padding:12px 6px 11px;font-weight:800;font-size:.92rem;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--sh);transition:transform .1s}
.who-btn i{font-style:normal;font-size:1.9rem}
.who-btn:active{transform:scale(.96)}

/* 마감 시계 */
.countdown{display:inline-flex;gap:4px;align-items:center;background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:.85rem;font-weight:700;box-shadow:var(--sh);font-variant-numeric:tabular-nums}
.countdown b{color:var(--mint-d)}
.countdown.soon{background:var(--yellow-l)}.countdown.soon b{color:#b05a00}
.countdown.late{background:var(--red-l);color:#b4232a}

/* 홈: 첫 화면은 딸깍 하나로 꽉 차게 */
.home-top .chip-who{padding:6px 9px;font-size:1.35rem;line-height:1}
.slot-card{margin:4px 14px 0;background:linear-gradient(165deg,#14c2b4 0%,#0b968b 100%);border-radius:28px;padding:16px 14px 16px;color:#fff;box-shadow:0 12px 28px rgba(10,133,124,.3);position:relative;overflow:hidden}
.slot-card::before{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.slot-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;position:relative}
.slot-head h2{margin:0;font-size:1.32rem;line-height:1.1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.slot-head .countdown{font-size:.72rem;padding:5px 9px;white-space:nowrap;flex:0 0 auto}
.seg{display:flex;background:rgba(255,255,255,.18);border-radius:16px;padding:4px;gap:4px;position:relative}
.seg button{flex:1;border:0;background:none;color:#fff;border-radius:12px;padding:8px 4px;font-weight:800;font-size:.92rem;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.seg button small{font-weight:600;opacity:.85;font-size:.7rem}
.seg button.on{background:#fff;color:var(--mint-d);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.seg.light{background:var(--card);box-shadow:0 2px 12px rgba(16,35,42,.16)}
.seg.light button{color:var(--sub)}
.seg.light button.on{background:var(--mint);color:#fff}
.reel{position:relative;margin-top:12px;min-height:118px;border-radius:22px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 16px;overflow:hidden;box-shadow:inset 0 10px 12px -10px rgba(0,0,0,.3),inset 0 -10px 12px -10px rgba(0,0,0,.3)}
.reel.has{justify-content:flex-start}
.reel .r-emo{font-size:3.4rem;line-height:1}
.reel .r-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.reel .r-name{font-family:var(--display);font-size:1.6rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reel .r-sub{font-size:.8rem;font-weight:700;color:var(--sub)}
.reel.has .r-sub:first-child{color:var(--mint-d);font-weight:800}
.reel.spin .r-emo,.reel.spin .r-text{animation:roll .12s linear}
@keyframes roll{from{transform:translateY(-70%);opacity:.15}to{transform:none;opacity:1}}
.reel.hit{animation:hit .55s ease-out}
@keyframes hit{0%{box-shadow:0 0 0 0 rgba(255,207,63,.95)}100%{box-shadow:0 0 0 16px rgba(255,207,63,0)}}
.pick-acts{margin-top:10px;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
.pick-menu{font-size:.85rem;font-weight:700;opacity:.95;margin:0 2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.light{background:rgba(255,255,255,.2);color:#fff;padding:11px 14px}
.btn.grow{flex:1;background:#fff;color:var(--mint-d)}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:none;opacity:1}}
.ddal{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;margin-top:14px;border:0;border-radius:22px;background:var(--yellow);color:#4a3500;padding:16px 12px 14px;box-shadow:0 7px 0 #d9a600,0 12px 20px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
.ddal span{font-family:var(--display);font-size:2.6rem;line-height:1}
.ddal small{font-size:.8rem;font-weight:800;opacity:.75}
.ddal:active{transform:translateY(6px);box-shadow:0 1px 0 #d9a600,0 4px 8px rgba(0,0,0,.15)}
.ddal:disabled{opacity:.6}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.browse-note{display:flex;gap:8px;align-items:flex-start;background:var(--yellow-l);border-radius:14px;padding:10px 12px;margin:4px 0 0;font-size:.84rem;line-height:1.45}
.sent-note{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;border:0;background:var(--mint-l);color:var(--mint-d);border-radius:16px;padding:13px 15px;margin:10px 0 0;font-weight:800;text-align:left}
.cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:14px -16px 0;padding:2px 16px 4px}
.cat{flex:0 0 auto;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:.76rem;color:var(--sub);padding:0;min-width:58px}
.cat i{font-style:normal;width:50px;height:50px;border-radius:17px;background:var(--card);display:grid;place-items:center;font-size:1.55rem;box-shadow:var(--sh);transition:transform .12s}
.cat.on{color:var(--ink)}
.cat.on i{background:var(--mint-l);box-shadow:inset 0 0 0 2px var(--mint)}
.cat:active i{transform:scale(.94)}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}
.sec-head h2{margin:0}
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 16px 8px;margin:0 -16px;scrollbar-width:none}
.pop-card{flex:0 0 124px;scroll-snap-align:start;border:0;background:var(--card);border-radius:18px;padding:8px 8px 11px;text-align:left;box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px}
.pop-emo{height:76px;border-radius:13px;display:grid;place-items:center;font-size:2.4rem;margin-bottom:6px;background:radial-gradient(100% 90% at 25% 15%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),var(--c)}
.pop-card b{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-card span{font-size:.74rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-card em{font-style:normal;font-weight:900;font-size:.86rem;font-variant-numeric:tabular-nums}
.sorts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px}
.sorts button{flex:0 0 auto;border:0;background:var(--card);border-radius:999px;padding:8px 13px;font-weight:800;font-size:.84rem;color:var(--sub);box-shadow:var(--sh)}
.sorts button.on{background:var(--ink);color:#fff}

/* 가게 줄 */
.stores{display:flex;flex-direction:column;gap:10px}
.store{display:flex;gap:13px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:var(--r);padding:11px;box-shadow:var(--sh);position:relative;transition:transform .1s}
.store:active{transform:scale(.985)}
.store .body{min-width:0;flex:1}
.store b{font-size:1.04rem}
.store .menu-line{font-size:.84rem;color:var(--sub);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store .from{font-size:.84rem;font-weight:900;margin-top:2px;font-variant-numeric:tabular-nums}
.badge{position:absolute;top:10px;right:10px;background:var(--mint);color:#fff;border-radius:999px;font-size:.74rem;font-weight:800;padding:2px 8px}

.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:center}
.line:last-child{border-bottom:0}
.line b{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* 가게 화면 */
.view-store .top{position:absolute;left:0;right:0;max-width:520px;margin:0 auto;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.view-store .top h1{opacity:0}
.view-store .top .chip-who{display:none}
.shop-hero{position:relative}
.shop-card{position:relative;margin:-34px 16px 0;background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--sh);text-align:center}
.shop-card h2{margin:0 0 2px;font-size:1.6rem}
.shop-card .chips,.shop-card .acts{justify-content:center}
.menus{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.menu{position:relative;border-bottom:1px solid var(--line)}
.menu:last-child{border-bottom:0}
.menu.in{background:var(--mint-ll)}
.menu-main{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:14px 14px 14px 16px}
.menu .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.menu .name{font-weight:800;font-size:1rem}
.menu .desc{font-size:.8rem;color:var(--sub)}
.menu .tags:empty{display:none}
.menu .price{font-weight:900;font-variant-numeric:tabular-nums}
.menu .price.unknown{color:#866000;font-weight:700;font-size:.88rem}
.m-emo{flex:0 0 78px;height:78px;border-radius:16px;display:grid;place-items:center;font-size:2.4rem;background:radial-gradient(100% 90% at 25% 15%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),var(--c)}
.m-ctl{position:absolute;right:10px;bottom:8px}
.qty{display:flex;align-items:center;border-radius:999px;overflow:hidden;background:var(--card);box-shadow:0 2px 8px rgba(16,35,42,.16)}
.qty button{border:0;background:none;width:32px;height:32px;font-size:1.15rem;font-weight:900;color:var(--mint-d)}
.qty b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.qty.big button{width:44px;height:44px;font-size:1.4rem}.qty.big b{min-width:32px;font-size:1.15rem}
.add{width:34px;height:34px;border:0;border-radius:50%;background:var(--mint);color:#fff;font-size:1.4rem;font-weight:900;line-height:1;display:grid;place-items:center;box-shadow:0 3px 8px rgba(10,133,124,.35)}
.shop-info{margin-top:14px}
.shop-info p{margin:6px 0}

/* 메뉴 시트 */
.sheet-bg{position:fixed;inset:0;z-index:65;background:rgba(16,30,35,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:min(520px,100%);background:var(--card);border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .24s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40%)}}
.sheet-x{position:absolute;right:14px;top:14px;width:36px;height:36px;border:0;border-radius:50%;background:#eaf0f1;font-weight:900}
.sheet-emo{height:150px;border-radius:20px;display:grid;place-items:center;font-size:4.6rem;margin-bottom:14px;background:radial-gradient(100% 90% at 25% 15%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),var(--c)}
.sheet h2{margin:2px 0 6px;font-size:1.6rem}
.sheet .muted{margin:0 0 6px}
.sheet-price{font-size:1.3rem;font-weight:900;margin:8px 0 14px;font-variant-numeric:tabular-nums}
.sheet-qty{display:flex;justify-content:space-between;align-items:center;padding:12px 0 16px;border-top:1px solid var(--line);font-weight:800}

/* 장바구니 */
.who-line{font-size:1rem}
.cart-store .cs-head{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.cart-store .cs-head>div{flex:1;min-width:0}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.quick button{border:0;border-radius:999px;padding:7px 11px;font-size:.82rem;font-weight:800;background:#eef2f3;color:var(--sub)}
.quick button.on{background:var(--mint);color:#fff}
.summary .line{border-bottom:0;padding:4px 0}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px));width:min(488px,calc(100% - 28px));z-index:24;background:var(--ink);color:#fff;border:0;border-radius:18px;padding:15px 18px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.02rem;box-shadow:0 10px 24px rgba(16,35,42,.3)}
.cartbar .n{background:var(--mint);color:#fff;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:.86rem}
.cartbar .sp{flex:1;text-align:left}
.total{display:flex;justify-content:space-between;font-weight:900;font-size:1.2rem;padding-top:10px;margin-top:6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:70px 24px}
.empty .big{font-size:4.2rem}
.empty h2{margin:10px 0 6px}

/* 주문서 */
.steps{list-style:none;display:flex;gap:6px;padding:0;margin:4px 0 16px}
.steps li{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.75rem;font-weight:800;color:var(--mute);text-align:center}
.steps i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e3eaec;color:var(--sub)}
.steps li.on{color:var(--mint-d)}.steps li.on i{background:var(--mint);color:#fff}
.ticket{position:relative;background:var(--card);border-radius:18px;padding:18px 18px 16px;box-shadow:var(--sh);-webkit-mask:radial-gradient(circle 10px at 0 calc(100% - 92px),transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% calc(100% - 92px),transparent 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 10px at 0 calc(100% - 92px),transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% calc(100% - 92px),transparent 98%,#000) right/51% 100% no-repeat}
.t-head{display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:12px;border-bottom:2px dashed var(--line);margin-bottom:8px}
.t-head span{font-size:.8rem;font-weight:800;color:var(--mint-d)}
.t-head b{font-family:var(--display);font-weight:400;font-size:1.5rem}
.t-head small{color:var(--mute);font-weight:700}
.t-store{font-weight:900;margin:10px 0 2px;font-size:.92rem}
.t-line{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:.92rem;font-variant-numeric:tabular-nums}
.t-req{margin-top:10px;background:var(--mint-ll);border-radius:10px;padding:8px 10px;font-size:.88rem}
.t-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:2px solid var(--ink);font-weight:900;font-variant-numeric:tabular-nums}
.t-total b{font-size:1.3rem}
.t-code{margin-top:22px;padding-top:12px;border-top:2px dashed var(--line);height:56px;overflow:hidden}
.t-code small{display:block;color:var(--mute);font-weight:700;font-size:.72rem;margin-bottom:3px}
.t-code code{display:block;font-size:.66rem;color:var(--sub);word-break:break-all;line-height:1.3}
.raw{margin-top:14px}
.raw summary{cursor:pointer;color:var(--sub);font-weight:800;font-size:.88rem;padding:6px 0}
.receipt{background:var(--card);border-radius:var(--r);padding:16px;white-space:pre-wrap;font-size:.88rem;line-height:1.55;word-break:break-all;box-shadow:var(--sh)}
.code-box{width:100%;min-height:150px;font-size:.85rem}

/* 지도 */
.mapwrap{position:relative;display:flex;flex-direction:column;height:calc(100vh - var(--top-h) - var(--nav-h) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:420px}
.map{position:relative;flex:1;min-height:240px;background:#e8eef0}
.map-top{position:absolute;top:10px;left:12px;right:12px;z-index:500}
.map-btn{position:absolute;left:12px;z-index:500;width:44px;height:44px;border-radius:14px;border:0;background:var(--card);box-shadow:0 2px 10px rgba(20,40,45,.18);font-size:1.25rem}
.mapwrap .leaflet-top{top:62px}
.mapwrap .leaflet-bottom{bottom:14px}
.map-sheet{flex:0 0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:14px 14px 12px;box-shadow:0 -4px 18px rgba(20,40,45,.12);position:relative;z-index:501;margin-top:-14px}
.map-sheet .row{align-items:flex-start}
.map-sheet .name{font-family:var(--display);font-size:1.3rem;line-height:1.15}
.map-fallback{flex:1;overflow:auto;padding:66px 12px 24px}
.mpin{display:grid;place-items:center}
.mpin span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid var(--mint);font-size:1.15rem;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.mpin.rough span{border-style:dashed}
.mpin.sel span{width:46px;height:46px;background:var(--yellow);border-color:var(--mint-d);font-size:1.5rem}
.mpin.off{opacity:.35}
.mpin em{position:absolute;top:50px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-weight:800;font-size:.8rem;background:var(--ink);color:#fff;border-radius:8px;padding:3px 8px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.mpin.cluster span{background:var(--mint);color:#fff;border-color:#fff;font-weight:900;font-size:1rem;box-shadow:0 0 0 5px rgba(16,179,166,.25),0 3px 8px rgba(0,0,0,.25)}
.mpin.cluster b::before{content:"🍽 ";font-size:.8rem}
.mpin.camp span{width:44px;height:44px;background:var(--mint);border-color:#fff;font-size:1.35rem}
.leaflet-container{font-family:var(--body)}
.locator{position:fixed;inset:0;z-index:60;background:rgba(20,30,35,.55);display:grid;place-items:center;padding:12px}
.locator .box{background:var(--card);border-radius:20px;width:min(520px,100%);max-height:100%;overflow:auto;padding:14px}
.locator .lmap{position:relative;height:min(52vh,420px);border-radius:14px;overflow:hidden;margin:10px 0;background:#e8eef0}
.locator .lmap .cross{position:absolute;left:50%;top:50%;z-index:500;transform:translate(-50%,-100%);font-size:2.2rem;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}

/* 약도(지도를 못 불러올 때) */
.sketch{background:var(--card);border-radius:var(--r);padding:10px}
.sketch svg{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;font-family:var(--body)}
.sketch .ring{fill:none;stroke:#cfe9e6;stroke-width:1.5;stroke-dasharray:4 4}
.sketch .ring.cur{fill:rgba(18,181,170,.07);stroke:var(--mint);stroke-dasharray:none}
.sketch .ring-label{fill:var(--sub);font-size:11px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3px}
.sketch .north{fill:var(--sub);font-size:11px;font-weight:800;text-anchor:end}
.sketch .area-label{fill:var(--ink);font-size:12px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:4px}
.sketch .camp circle{fill:var(--mint)}
.sketch .camp text{text-anchor:middle;font-size:15px}
.sketch .camp .camp-label{fill:var(--mint-d);font-size:12px;font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:4px}
.sketch .pin{cursor:pointer}
.sketch .pin circle{fill:#fff;stroke:var(--mint);stroke-width:2}
.sketch .pin text{text-anchor:middle;font-size:13px}
.sketch .pin.sel circle{fill:var(--yellow);stroke:var(--mint-d);stroke-width:3}
.sketch .pin.off{opacity:.28;cursor:default}

/* 담당자 */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0;scrollbar-width:none;position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px));background:var(--bg);z-index:4}
.tab{flex:0 0 auto;border:0;background:var(--card);border-radius:999px;padding:8px 14px;font-weight:800;color:var(--sub)}
.tab.on{background:var(--ink);color:#fff}
.bar{height:12px;background:#e3eaec;border-radius:999px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--mint)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border-radius:999px;padding:5px 10px;font-size:.85rem;font-weight:700;background:#e9eef0}
.pill.ok{background:var(--mint-l);color:var(--mint-d)}
.pill.no{background:var(--red-l);color:#b4232a}
.big-num{font-family:var(--display);font-size:2.2rem;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem;margin:8px 0}
.pick{margin-bottom:10px;border:2px solid transparent}
.pick.on{border-color:var(--mint)}
.pick-head{cursor:pointer}
.pick-head input{width:22px;height:22px;accent-color:var(--mint)}
.pic-s{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.6rem;flex:0 0 44px}
.field{display:block;font-size:.85rem;font-weight:700;color:var(--sub);margin-top:8px}
.field .input{margin-top:4px;padding:9px 10px}
.edit-row{display:grid;grid-template-columns:44px 1fr 86px 34px;gap:6px;margin-top:6px}
.edit-row .input{padding:8px;min-width:0}
.edit-box{background:var(--bg);border-radius:12px;padding:10px;margin-top:10px}
.info{font-size:.82rem;color:var(--sub);margin-top:4px;line-height:1.45}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%) translateY(-20px);opacity:0;transition:.25s;background:rgba(22,35,42,.95);color:#fff;padding:12px 18px;border-radius:999px;font-weight:800;font-size:.92rem;z-index:90;box-shadow:0 8px 20px rgba(0,0,0,.2);pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

// 모양: [DN1.<base64url JSON>.<검사값>]
function b64e(s) { let b = ''; for (const c of new TextEncoder().encode(s)) b += String.fromCharCode(c); return btoa(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64d(s) { const b = atob(s.replace(/-/g, '+').replace(/_/g, '/')); return new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0))); }
function check(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
function encodeOrder(o) { const body = b64e(JSON.stringify(o)); return `[DN1.${body}.${check(body)}]`; }
function decodeAll(text) {
  const found = [], broken = [];
  for (const m of String(text).matchAll(/DN1\.([A-Za-z0-9_-]+)\.([0-9a-z]+)/g)) {
    try {
      if (check(m[1]) !== m[2]) throw 0;
      const o = JSON.parse(b64d(m[1]));
      if (!o || typeof o.w !== 'string' || !Array.isArray(o.i)) throw 0;
      found.push({w: o.w.slice(0, 40), t: Number(o.t) || 0, r: String(o.r || '').slice(0, 200),
        i: o.i.filter(x => Array.isArray(x) && typeof x[0] === 'string').map(([id, n]) => [id.slice(0, 20), Math.max(0, Math.min(30, Number(n) || 0))]).filter(x => x[1] > 0)});
    } catch { broken.push(m[0].slice(0, 24)); }
  }
  return {found, broken};
}
const shortName = s => s.name.replace(/^\(예시\)\s*/, '');
function orderText(o) {
  const lines = o.i.map(([id, n]) => { const it = ITEMS.get(id); return it ? `· [${shortName(it.store)}] ${it.name} ${n}개` : `· (알 수 없는 메뉴 ${id}) ${n}개`; });
  const sum = o.i.reduce((a, [id, n]) => a + (ITEMS.get(id)?.price || 0) * n, 0);
  const unknown = o.i.some(([id]) => !ITEMS.get(id)?.price);
  return [`🛵 ${CFG.title} 주문서`, `👪 ${o.w}`, ...lines, ...(o.r ? [`💬 ${o.r}`] : []), `💰 ${won(sum)}${unknown ? ' (가격 모르는 메뉴 빼고)' : ''}`, '', '주문 코드 (지우지 말아 주세요)', encodeOrder(o)].join('\n');
}

// 복사: 갤러리 안의 격리된 화면에서는 클립보드가 막힐 수 있어서 두 번 시도하고, 그래도 안 되면 직접 복사하게 보여 줘요.
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.append(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); ta.remove();
    if (ok) return true;
  } catch {}
  return false;
}
async function copyOrShow(text, okMsg, boxId) {
  if (await copyText(text)) { toast(okMsg); return; }
  const box = document.getElementById(boxId);
  if (box) { box.hidden = false; const ta = box.querySelector('textarea'); ta.value = text; ta.focus(); ta.select(); }

// 슬롯 릴이 돌다가 천천히 멈추고, 색종이가 터져요(움직임 줄이기 설정이면 바로 보여 줘요).
function ddal() {
  const {ordering, list} = homeStores();
  if (!list.length || S.rolling) return;
  const pool = list.length > 1 ? list.filter(s => s.id !== S.pick) : list;
  const target = pool[Math.floor(Math.random() * pool.length)];
  buzz(15);
  if (S.view === 'map') { selectPin(target.id, true); return; }
  const reel = document.getElementById('reel'), box = document.getElementById('pickBox');
  const done = () => {
    S.rolling = false; S.pick = target.id;
    if (reel) { reel.innerHTML = reelFace(target); reel.classList.remove('spin'); reel.classList.add('has', 'hit'); }
    if (box) box.innerHTML = pickActions(target, ordering);
    confetti(reel); buzz([20, 40, 20]);
  };
  if (reduceMotion()) { done(); return; }
  S.rolling = true;
  if (box) box.innerHTML = '';
  reel?.classList.remove('hit', 'has'); reel?.classList.add('spin');
  let i = Math.floor(Math.random() * list.length), delay = 45;
  const spin = () => {
    const s = list[i++ % list.length];
    if (reel) reel.innerHTML = `<span class="r-emo">${esc(s.emoji)}</span><span class="r-text"><span class="r-name">${esc(s.name)}</span></span>`;
    delay *= 1.12;
    if (delay < 300) setTimeout(spin, delay); else setTimeout(done, 160);
  };
  spin();
}
function buzz(p) { try { navigator.vibrate?.(p); } catch {} }
// 색종이: 캔버스 하나를 잠깐 띄웠다가 지워요.
function confetti(from) {
  if (reduceMotion() || !from) return;
  const r = from.getBoundingClientRect(), cv = document.createElement('canvas');
  cv.className = 'confetti'; cv.width = innerWidth; cv.height = innerHeight; document.body.append(cv);
  const ctx = cv.getContext('2d'), colors = ['#12b5aa', '#ffd24a', '#ff7a59', '#7c9cff', '#ff5fa2'];
  const bits = Array.from({length: 70}, () => ({x: r.left + r.width / 2, y: r.top + r.height / 2, vx: (Math.random() - .5) * 9, vy: -Math.random() * 9 - 3, s: 4 + Math.random() * 5, c: colors[Math.floor(Math.random() * colors.length)], a: Math.random() * 6}));
  let t = 0;
  const step = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const b of bits) { b.x += b.vx; b.y += b.vy; b.vy += .32; b.a += .2; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore(); }
    if (++t < 70) requestAnimationFrame(step); else cv.remove();
  };
  step();
}

let MAP = null, PINS = new Map(), leafletLoading = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  if (!leafletLoading) {
    leafletLoading = new Promise((ok, fail) => {
      const tag = document.createElement('script');
      tag.src = LEAFLET; tag.onload = () => (window.L ? ok() : fail());

// 위치가 있는 것만. 같은 건물에 몰린 가게는 살짝 벌려서 모두 보이게 해요.
function pinPositions(stores) {
  const groups = new Map();
  for (const s of stores) if (s.lat && s.lng) { const k = s.lat.toFixed(3) + ',' + s.lng.toFixed(3); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(s); }
  const pos = new Map();
  for (const list of groups.values()) list.forEach((s, i) => {
    if (list.length === 1) { pos.set(s.id, [s.lat, s.lng]); return; }
    const t = (i / list.length) * Math.PI * 2, d = 0.0011 + list.length * 0.00012;
    pos.set(s.id, [s.lat + Math.sin(t) * d, s.lng + Math.cos(t) * d * 1.25]);
  });
  return pos;
}

let PINLAYER = null, PINDATA = [];
function unmountMap() { if (MAP) { try { MAP.stop(); MAP.remove(); } catch {} MAP = null; PINS = new Map(); PINLAYER = null; PINDATA = []; } }

  if (!el.isConnected || S.view !== 'map') return;

  const L = window.L, {all, list} = homeStores(), focus = S.mapFocus;

// 가까이 붙은 핀은 숫자 묶음(🍽 3)으로 보여 주고, 누르면 그 자리로 확대해요.
function drawPins() {
  if (!MAP || !PINLAYER) return;
  const L = window.L;
  PINLAYER.clearLayers(); PINS = new Map();
  const groups = [];
  for (const d of PINDATA) {
    if (!d.on) {
      PINLAYER.addLayer(L.marker(d.at, {icon: pinIcon(d.s, ' off'), interactive: false, keyboard: false}));
      continue;
    }
    const pt = MAP.latLngToContainerPoint(d.at);
    const g = d.s.id === S.pick ? null : groups.find(x => !x.sel && x.pt.distanceTo(pt) < 40);
    if (g) g.items.push(d); else groups.push({pt, items: [d], sel: d.s.id === S.pick});
  }
  for (const g of groups) {
    if (g.items.length === 1) {
      const {s, at} = g.items[0], on = s.id === S.pick;
      const m = L.marker(at, {icon: pinIcon(s, on ? ' sel' : ''), title: s.name, zIndexOffset: on ? 1000 : 0});
      m.on('click', () => selectPin(s.id, false));
      PINLAYER.addLayer(m); PINS.set(s.id, m);
    } else {
      const m = L.marker(g.items[0].at, {icon: L.divIcon({className: 'mpin cluster', html: `<span><b>${g.items.length}</b></span>`, iconSize: [46, 46], iconAnchor: [23, 23]}), title: g.items.map(d => d.s.name).join(', '), zIndexOffset: 200});
      m.on('click', () => MAP.fitBounds(g.items.map(d => d.at), {padding: [70, 70], maxZoom: 17}));

function addTiles(i) {

// 약도: 수련원을 가운데에 두고, 차로 걸리는 시간(분)만큼 떨어뜨려 동네 방향에 가게를 찍어요.
function sketchMap(all, shown) {
  const RINGS = CFG.radius.some(r => r.max) ? CFG.radius.filter(r => r.max) : [{max: 10}, {max: 20}];
  const R = 150, maxMin = Math.max(...RINGS.map(r => r.max), ...all.map(s => s.minutes || 0), 1);
  const scale = m => (m / maxMin) * R;
  const areas = [...new Set(all.map(s => s.area || '기타'))];
  const dirOf = a => (a in CFG.areaDirs ? CFG.areaDirs[a] : (areas.indexOf(a) * 360) / areas.length);
  const cur = CFG.radius[radiusIndex()]?.max || 0;
  const f = n => n.toFixed(1);
  const box = {x0: -40, y0: -40, x1: 40, y1: 50};
  const grow = (x, y, pad) => { box.x0 = Math.min(box.x0, x - pad); box.x1 = Math.max(box.x1, x + pad); box.y0 = Math.min(box.y0, y - pad); box.y1 = Math.max(box.y1, y + pad); };
  const byArea = new Map();
  for (const s of all) { const a = s.area || '기타'; if (!byArea.has(a)) byArea.set(a, []); byArea.get(a).push(s); }
  let labels = '', pins = '';
  for (const [a, list] of byArea) {
    const rad = (dirOf(a) - 90) * Math.PI / 180, ux = Math.cos(rad), uy = Math.sin(rad);
    const avg = list.reduce((x, s) => x + (s.minutes || maxMin), 0) / list.length;
    const n = list.length, spread = n > 1 ? Math.max(17, (n * 28) / (2 * Math.PI)) : 0;
    const ax = ux * scale(avg), ay = uy * scale(avg);
    const anchor = ux < -0.35 ? 'end' : ux > 0.35 ? 'start' : 'middle', w = a.length * 13;
    const lx = ax + ux * (spread + 18), ly = ay + uy * (spread + 18) + 4;
    labels += `<text x="${f(lx)}" y="${f(ly)}" class="area-label" text-anchor="${anchor}">${esc(a)}</text>`;
    grow(anchor === 'end' ? lx - w : anchor === 'start' ? lx + w : lx, ly, anchor === 'middle' ? w / 2 + 6 : 12);
    list.forEach((s, i) => {
      const t = rad + (i / n) * Math.PI * 2, x = ax + Math.cos(t) * spread, y = ay + Math.sin(t) * spread;
      const on = shown.includes(s), sel = s.id === S.pick;
      grow(x, y, 16);
      pins += `<g class="pin${on ? '' : ' off'}${sel ? ' sel' : ''}" data-act="map-pin" data-id="${esc(s.id)}" tabindex="${on ? 0 : -1}" role="button" aria-label="${esc(s.name)}"><circle cx="${f(x)}" cy="${f(y)}" r="${sel ? 15 : 12}"/><text x="${f(x)}" y="${f(y + 5)}">${esc(s.emoji)}</text></g>`;
    });
  }
  let lastX = Infinity;
  const ringLabel = [...RINGS].sort((p, q) => q.max - p.max).filter(r => { const keep = lastX - scale(r.max) >= 26; if (keep) lastX = scale(r.max); return keep; });
  const rings = RINGS.map(r => `<circle cx="0" cy="0" r="${f(scale(r.max))}" class="ring${r.max === cur ? ' cur' : ''}"/>${ringLabel.includes(r) ? `<text x="${f(scale(r.max))}" y="4" class="ring-label">${r.max}분</text>` : ''}`).join('');
  grow(scale(Math.max(...RINGS.map(r => r.max), 0)), 0, 22);
  const vb = `${f(box.x0)} ${f(box.y0)} ${f(box.x1 - box.x0)} ${f(box.y1 - box.y0)}`;

// 담당자: 지도를 움직여 가운데 핀(📍)을 가게 자리에 맞추거나, 구글 지도 등에서 복사한 "위도, 경도"를 붙여넣어요.
let LOCMAP = null;
async function openLocator(kind, id) {
  const s = kind === 'store' ? storeById(id) : null;
  const cur = s ? (s.lat ? [s.lat, s.lng] : null) : (CFG.campPos.lat ? [CFG.campPos.lat, CFG.campPos.lng] : null);
  const start = cur || (CFG.campPos.lat ? [CFG.campPos.lat, CFG.campPos.lng] : [36.5684, 128.7294]);
  const name = s ? s.name : '수련원';
  const div = document.createElement('div');
  div.className = 'locator'; div.id = 'locator';
  div.innerHTML = `<div class="box" role="dialog" aria-label="${esc(name)} 위치 정하기"><b>📍 ${esc(name)} 위치 정하기</b>
    <p class="muted" style="margin:6px 0 0">지도를 움직여 가운데 📍 를 ${esc(name)} 자리에 맞춰 주세요.${s && s.address ? `<br>주소: ${esc(s.address)}` : ''}</p>
    <div class="lmap"><div id="lmap" style="position:absolute;inset:0"></div><div class="cross">📍</div></div>
    <label class="field">또는 위도, 경도 붙여넣기 (구글 지도에서 장소를 오른쪽 클릭하면 나와요)<input class="input" id="latlng" placeholder="예: 36.56842, 128.72941" value="${cur ? `${cur[0]}, ${cur[1]}` : ''}"></label>
    <div class="row" style="margin-top:12px"><button class="btn gray" style="flex:1" data-act="loc-cancel">취소</button><button class="btn" style="flex:2" data-act="loc-ok" data-kind="${kind}" data-id="${esc(id || '')}">이 위치로 정하기</button></div></div>`;
  document.body.append(div);
  try {
    await loadLeaflet();
    if (!div.isConnected) return;
    const L = window.L;
    LOCMAP = L.map('lmap', {zoomControl: true}).setView(start, cur ? 16 : 12);
    let ok = 0, bad = 0, i = 0;
    const tiles = () => {
      const layer = L.tileLayer(TILES[i].url, TILES[i].opt).addTo(LOCMAP);
      layer.on('tileload', () => { ok++; });
      layer.on('tileerror', () => { if (++bad === 4 && !ok) setTimeout(() => { if (!LOCMAP) return; LOCMAP.removeLayer(layer); bad = 0; if (++i < TILES.length) tiles(); else { LOCMAP.remove(); LOCMAP = null; locatorNoMap(); } }, 0); });
    };
    tiles();
    LOCMAP.on('moveend', () => { const c = LOCMAP.getCenter(); const box = document.getElementById('latlng'); if (box && document.activeElement !== box) box.value = `${round5(c.lat)}, ${round5(c.lng)}`; });
  } catch { locatorNoMap(); }
}
function locatorNoMap() {
  const m = document.querySelector('#locator .lmap');
  if (m) m.outerHTML = '<div class="notice">이 화면에서는 지도를 불러오지 못했어요. 아래 칸에 위도, 경도를 붙여넣어 주세요.</div>';
}
function closeLocator() { if (LOCMAP) { try { LOCMAP.remove(); } catch {} LOCMAP = null; } document.getElementById('locator')?.remove(); }
function parseLatLng(text) {
  const m = String(text).match(/(-?\d{1,3}(?:\.\d+)?)\s*[, ]\s*(-?\d{1,3}(?:\.\d+)?)/);
  if (!m) return null;
  const lat = Number(m[1]), lng = Number(m[2]);
  return lat > 30 && lat < 45 && lng > 120 && lng < 135 ? [round5(lat), round5(lng)] : null; // 한국 근처만
}

function everyone() {
  const list = [...CFG.families, ...CFG.staff];
  for (const w of Object.keys(S.orders)) if (!list.includes(w)) list.push(w);

function storeTotals() {
  const map = new Map(CFG.stores.map(s => [s.id, {store: s, items: new Map(), who: [], sum: 0}]));
  const unknown = [];
  for (const o of Object.values(S.orders)) {
    const mine = new Map();
    for (const [id, n] of o.i) {
      const it = ITEMS.get(id);
      if (!it) { unknown.push(`${o.w}: ${id} ${n}개`); continue; }
      const g = map.get(it.store.id);
      g.items.set(id, (g.items.get(id) || 0) + n); g.sum += it.price * n;
      if (!mine.has(g)) mine.set(g, []);
      mine.get(g).push(`${it.name} ${n}`);
    }
    for (const [g, ls] of mine) g.who.push({w: o.w, ls, r: o.r});
  }
  return {groups: [...map.values()].filter(g => g.items.size), unknown};
}
function ownerMessage(g) {

  lines.push('', '감사합니다!');
  return lines.join('\n');
}

}
function adminMore() {
  return `<div class="stack"><div class="card"><b>💾 다른 기기로 옮기기</b><p class="muted">받은 주문을 모두 주문 코드로 복사해요. 다른 기기의 📥 받기에 붙여넣으면 그대로 옮겨져요.</p>
  <button class="btn ghost block" data-act="backup">📋 받은 주문 모두 복사</button><div id="backupBox" hidden style="margin-top:8px"><textarea class="input code-box" readonly aria-label="받은 주문"></textarea></div></div>
  <div class="card"><b>🧾 이 기기에서 대신 주문 받기</b><p class="muted">전화나 말로 받은 주문은 '주문하는 사람'을 그 가족으로 바꿔 메뉴를 고른 뒤, 주문서 화면의 「담당자 목록에 바로 넣기」를 누르면 돼요.</p>
  <button class="btn ghost block" data-act="proxy">👪 주문 화면으로 가기</button></div>
  <div class="card"><b>🗑 처음부터 다시</b><p class="muted">받은 주문을 모두 지워요. 되돌릴 수 없어요.</p>
  <button class="btn red block" data-act="reset">받은 주문 모두 지우기</button></div></div>`;
}
function addOrders(list) {
  let added = 0, updated = 0, same = 0;
  for (const o of list) {
    const old = S.orders[o.w];
    if (!old) { S.orders[o.w] = o; added++; }
    else if (o.t > old.t) { S.orders[o.w] = o; updated++; }
    else same++;
  }
  persist();
  return {added, updated, same};
}

// ---------- 앱 파일 다시 만들기 (고른 가게·고친 메뉴를 넣어서) ----------
const FONT = 'https://fonts.googleapis.com/css2?family=Jua&display=swap';
const GUIDE = [
  '',
  '  ✏️ 저녁에 뭐 먹을래? — 설정은 아래 dn-config 에 있어요.',
  '  - 쉬운 방법: 앱의 🔐 담당자 화면 → 🍽 가게 고르기에서 고치고 📋 앱 코드 복사 → 갤러리 ✏️ 고치기에 붙여넣기',
  '  - picked: 오늘 주문 받을 가게 id. 비어 있으면 가족들에게 "주변 맛집 둘러보기"로 보여요.',
  '  - lat/lng: 지도 핀 위치. posOk 가 false 면 동네 기준 대략 위치예요(담당자 화면 📍 위치로 고치기).',
  '  - 메뉴 id 는 주문 코드에 들어가요. 주문을 받기 시작한 뒤에는 바꾸거나 지우지 마세요.',
  '  - 이 코드는 갤러리에서 누구나 볼 수 있어요. 개인 전화번호는 적지 마세요.',
  '',
].join('\n');
function rebuild(cfg) {
  const json = JSON.stringify(cfg, null, 1).replace(/</g, '\\u003c');
  const tag = n => '<' + n; // 이 코드 안에 태그 글자를 그대로 쓰면 HTML 이 중간에 끊겨서 나눠 적어요.
  return ['<!doctype html>', '<html lang="ko">', '<head>', '<meta charset="utf-8">',
    '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">',
    `${tag('title')}>${esc(cfg.title)}${tag('/title')}>`,
    `<link rel="stylesheet" href="${FONT}">`,
    `${tag('style')} id="dn-style">${document.getElementById('dn-style').textContent}${tag('/style')}>`,
    '</head>', '<body>', '<div id="app"></div>', '<div id="toast" role="status" aria-live="polite"></div>',
    `${tag('!--')}${GUIDE}-->`,
    `${tag('script')} id="dn-config" type="application/json">`, json, `${tag('/script')}>`,
    `${tag('script')} id="dn-main">${document.getElementById('dn-main').textContent}${tag('/script')}>`,
    '</body>', '</html>', ''].join('\n');
}
function exportFile() {
  try {
    const url = URL.createObjectURL(new Blob([rebuild(CFG)], {type: 'text/html'}));
    const a = document.createElement('a');
    a.href = url; a.download = '저녁에-뭐-먹을래.html';
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('⬇ 파일 받기를 시작했어요. 안 받아지면 📋 앱 코드 복사를 써 주세요');
  } catch { toast('파일 받기가 안 돼요. 📋 앱 코드 복사를 써 주세요'); }
}

// ---------- 버튼 ----------
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'by-family': S.byFamily = el.checked; break;
    case 'who': go('who'); break;
    case 'pick': setWho(el.dataset.who); break;
    case 'pick-staff': {
      const name = document.getElementById('staffName').value.trim().replace(/\s+/g, ' ');
      if (!name) { toast('이름을 적어 주세요'); return; }
      setWho(/강사/.test(name) ? name : `${name} ${STAFF}`); break;
    }
    case 'home': case 'nav': go(act === 'home' ? 'home' : el.dataset.v); break;
    case 'cat': S.cat = el.dataset.cat; rerender(); break;
    case 'store': go('store', {store: id, mfilter: 'all'}); break;
    case 'plus': case 'minus': {
      setQty(id, (S.cart[id] || 0) + (act === 'plus' ? 1 : -1)); rerender();
      if (act === 'plus') { bumpCart(); if (S.cart[id] === 1) toast(`🛒 ${ITEMS.get(id).name} 담았어요`); }
      break;
    }
    case 'item': openItem(id); break;
    case 'item-close': closeSheet(); break;
    case 'sheet-add': {
      const q = Number(document.querySelector('#sheet .sheet-qty b')?.textContent) || 1;
      const had = S.cart[id] || 0;
      setQty(id, q); closeSheet();
      if (!isOpen(ITEMS.get(id).store)) break;
      rerender();
      bumpCart(); toast(had ? `🛒 ${ITEMS.get(id).name} ${q}개로 바꿨어요` : `🛒 ${ITEMS.get(id).name} ${q}개 담았어요`);
      break;
    }
    case 'sort': S.sort = el.dataset.sort; save('dn-sort', S.sort); rerender(); break;
    case 'mfilter': S.mfilter = el.dataset.f; rerender(); break;
    case 'quick-req': {
      const t = el.dataset.t, parts = S.req.split(/\s*,\s*/).filter(Boolean);
      const next = parts.includes(t) ? parts.filter(p => p !== t) : [...parts, t];
      S.req = next.join(', ').slice(0, 100); persist(); rerender(); break;
    }
    case 'ddal': ddal(); break;
    case 'show-on-map': go('map', {pick: id, mapFocus: true}); break;
    case 'map-pin': if (!el.classList.contains('off')) selectPin(id, false); break;
    case 'sheet-close': selectPin(null, false); break;
    case 'map-camp': if (MAP && CFG.campPos.lat) MAP.flyTo([CFG.campPos.lat, CFG.campPos.lng], 12, {duration: 0.6}); break;
    case 'radius': S.radius = Number(el.dataset.i); save('dn-radius', S.radius); rerender(); break;
    case 'make': {
      S.req = (document.getElementById('req')?.value || '').trim().slice(0, 100);
      const o = {v: 1, w: S.who, t: Date.now(), i: cartLines(S.cart).map(l => [l.item.id, l.n]), r: S.req};
      S.last = {text: orderText(o), order: o}; persist(); go('done'); break;
    }
    case 'copy-order': {
      if (await copyText(S.last.text)) { S.last.copied = Date.now(); persist(); rerender(); toast(`📋 복사됐어요! ${CFG.manager} 카톡에 붙여넣어 주세요`); }
      else copyOrShow(S.last.text, '', 'copyBox');
      break;
    }
    case 'self-add': { const r = addOrders([S.last.order]); toast(r.same ? '이미 들어 있어요' : `✅ ${S.last.order.w} 주문을 넣었어요`); break; }
    case 'admin': if (S.adminSession) go('admin', {admin: true}); else go('pin'); break;
    case 'pin-ok': {
      if (document.getElementById('pin').value.trim() === CFG.adminPin) { S.adminSession = true; go('admin', {admin: true, tab: openStores().length ? 'get' : 'pick'}); }
      else toast('PIN 이 달라요');
      break;
    }
    case 'admin-exit': go(S.who ? 'home' : 'who', {admin: false}); break;
    case 'proxy': go('who', {admin: false}); break;
    case 'tab': S.tab = el.dataset.tab; S.editing = null; render(); scrollTo(0, 0); break;
    case 'read': {
      const {found, broken} = decodeAll(document.getElementById('paste').value);
      if (!found.length) { document.getElementById('readResult').innerHTML = `<div class="notice red">주문 코드를 찾지 못했어요${broken.length ? ` (깨진 코드 ${broken.length}개 — 글자가 잘렸는지 확인해 주세요)` : ''}.</div>`; return; }
      const r = addOrders(found);
      render();
      document.getElementById('readResult').innerHTML = `<div class="notice mint">✅ 새 주문 <b>${r.added}</b> · 고친 주문 <b>${r.updated}</b> · 이미 있던 것 ${r.same}${broken.length ? `<br>⚠️ 깨진 코드 ${broken.length}개는 다시 받아 주세요` : ''}<br><button class="small-btn" data-act="tab" data-tab="store">🏪 가게별로 보기</button> <button class="small-btn" data-act="tab" data-tab="status">✅ 현황 보기</button></div>`;
      break;
    }
    case 'copy-owner': { const g = storeTotals().groups[Number(el.dataset.i)]; copyOrShow(ownerMessage(g), '사장님께 보낼 메시지를 복사했어요 📋', 'ownerBox' + el.dataset.i); break; }
    case 'copy-remind': copyOrShow(document.getElementById('remindText').value, '알림 글을 복사했어요 📣', 'remindBox'); break;
    case 'del': if (confirmTwice(el, '한 번 더 누르면 지워요')) { delete S.orders[el.dataset.who]; persist(); render(); } break;
    case 'reset': if (confirmTwice(el, '정말요? 한 번 더 누르면 모두 지워요')) { S.orders = {}; persist(); render(); toast('모두 지웠어요'); } break;
    case 'backup': {
      const text = Object.values(S.orders).map(o => `${o.w} ${encodeOrder(o)}`).join('\n');
      if (!text) { toast('받은 주문이 없어요'); return; }
      copyOrShow(text, `주문 ${Object.keys(S.orders).length}개를 복사했어요`, 'backupBox'); break;
    }
    case 'print': try { print(); } catch { toast('이 화면에서는 인쇄가 안 돼요'); } break;
    case 'copy-addr': { const s = storeById(id); copyOrShow(s.address, '📍 주소를 복사했어요. 지도 앱에 붙여넣어 보세요', ''); break; }
    case 'copy-phone': { const s = storeById(id); copyOrShow(s.phone, '📞 전화번호를 복사했어요', ''); break; }
    // 가게 고르기·고치기
    case 'pick-store': {
      CFG = clone(CFG);
      CFG.picked = el.checked ? [...new Set([...CFG.picked, id])] : CFG.picked.filter(x => x !== id);
      CFG.picked = CFG.stores.map(s => s.id).filter(x => CFG.picked.includes(x)); // 가게 순서대로
      saveDraft(); render(); break;
    }
    case 'edit-store': S.editing = S.editing === id ? null : id; render(); break;
    case 'locate': openLocator(el.dataset.kind, id); break;
    case 'loc-cancel': closeLocator(); break;
    case 'loc-ok': {
      const typed = parseLatLng(document.getElementById('latlng')?.value || '');
      const c = LOCMAP ? LOCMAP.getCenter() : null;
      const p = typed || (c ? [round5(c.lat), round5(c.lng)] : null);
      if (!p) { toast('위도, 경도를 "36.56842, 128.72941" 처럼 적어 주세요'); return; }
      CFG = clone(CFG);
      if (el.dataset.kind === 'camp') CFG.campPos = {lat: p[0], lng: p[1], ok: true};
      else { const s = storeById(el.dataset.id); if (s) { s.lat = p[0]; s.lng = p[1]; s.posOk = true; } }
      saveDraft(); closeLocator(); const y = scrollY; render(); scrollTo(0, y); toast('📍 위치를 정했어요'); break;
    }
    case 'menu-add': {
      CFG = clone(CFG);
      const s = storeById(id);
      s.menu.push({id: uid(s.id + '-'), name: '새 메뉴', emoji: '', price: 0, desc: '', tags: []});
      saveDraft(); render(); break;
    }
    case 'menu-del': {
      if (!confirmTwice(el, '지울까요?')) break;
      CFG = clone(CFG);
      for (const s of CFG.stores) s.menu = s.menu.filter(m => m.id !== id);
      saveDraft(); render(); break;
    }
    case 'store-new': {
      CFG = clone(CFG);
      const s = tidy({stores: [{id: uid('s'), name: '새 가게', menu: [{id: 'x', name: '새 메뉴'}]}]}).stores[0];
      s.menu[0].id = uid(s.id + '-');
      CFG.stores.push(s); S.editing = s.id; saveDraft(); render();
      document.querySelector(`[data-store="${s.id}"][data-field="name"]`)?.focus(); break;
    }
    case 'store-del': {
      if (!confirmTwice(el, '한 번 더 누르면 가게를 지워요')) break;
      CFG = clone(CFG);
      CFG.stores = CFG.stores.filter(s => s.id !== id); CFG.picked = CFG.picked.filter(x => x !== id);
      S.editing = null; saveDraft(); render(); break;
    }
    case 'draft-undo': if (confirmTwice(el, '한 번 더 누르면 되돌려요')) { CFG = BASE; S.editing = null; saveDraft(); render(); toast('올라간 메뉴판으로 되돌렸어요'); } break;
    case 'export-file': exportFile(); break;
    case 'export-copy': copyOrShow(rebuild(CFG), '📋 앱 코드를 복사했어요. 갤러리 ✏️ 고치기에 붙여넣어 주세요', 'exportBox'); break;
  }
});
// 입력칸: 요청 사항, 담당자 설정(시간·장소·가게·메뉴)
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'req') { S.req = t.value.slice(0, 100); persist(); return; }
  if (!S.adminSession) return;
  const value = ['price', 'minutes'].includes(t.dataset.field) ? Math.max(0, Math.round(Number(t.value) || 0)) : t.value.trim();
  if (t.dataset.cfg) { CFG = clone(CFG); CFG[t.dataset.cfg] = value; }
  else if (t.dataset.store) { CFG = clone(CFG); const s = storeById(t.dataset.store); if (s) s[t.dataset.field] = value; }
  else if (t.dataset.menu) { CFG = clone(CFG); for (const s of CFG.stores) for (const m of s.menu) if (m.id === t.dataset.menu) m[t.dataset.field] = value; }
  else return;
  saveDraft();
});
// 다 적고 나면(칸을 벗어나면) 안내 문구·미리보기를 새로 그려요.
document.addEventListener('change', e => { if (S.view === 'admin' && S.tab === 'pick' && (e.target.dataset.cfg || e.target.dataset.store || e.target.dataset.menu)) { const y = scrollY; render(); scrollTo(0, y); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('locator')) { closeLocator(); return; }
  if (e.key === 'Escape' && document.getElementById('sheet')) { closeSheet(); return; }
  if (e.key !== 'Enter') return;
  if (e.target.dataset?.act === 'map-pin') { e.target.dispatchEvent(new MouseEvent('click', {bubbles: true})); return; }
  if (e.target.id === 'pin') document.querySelector('[data-act="pin-ok"]')?.click();
  if (e.target.id === 'staffName') document.querySelector('[data-act="pick-staff"]')?.click();
  if (e.target.id === 'latlng') document.querySelector('[data-act="loc-ok"]')?.click();
});
// 다른 사람으로 바꾸면 장바구니를 비워요(담당자가 한 기기로 여러 가족 주문을 대신 받을 때 섞이지 않게).
function setWho(who) {
  if (who !== S.who) { S.cart = {}; S.req = ''; S.last = null; }
  S.who = who; persist(); go('home');
}
function confirmTwice(el, msg) {
  if (el.dataset.armed) return true;
  el.dataset.armed = '1'; const old = el.textContent; el.textContent = msg;
  setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = old; } }, 3000);
  return false;
}
S.view = S.who ? 'home' : 'who';
render();
setInterval(() => { for (const p of document.querySelectorAll('[data-time]')) p.outerHTML = countdown(p.dataset.time === 'short'); }, 30000);
</script>
