function forgetHostAccess(id) {
  const rooms=myRooms();save('mm-rooms',rooms.map(r=>r.id===id?{...r,host:false,key:'',role:'',accountUid:undefined}:r));
  hostAccount.synced.delete(id);
  if(S.roomId!==id)return;
  S.host=false;stopCartWatcher();S.hostKey='';S.hostRole='';S.managementNotice='관리 권한이 해제됐어요. 방 설정을 저장할 수 없으며, 다시 관리하려면 현재 방장에게 새 관리 링크를 받아 주세요.';resetRoomManagers(id);rerender();
}
function applyRoomManagers(result,id) {
  if(S.roomId!==id||!S.host)return;
  if(num(result.version)<Math.max(roomManagers.observedVersion,roomManagers.version)){roomManagers.refreshAgain=true;return;}
  const changed=!!S.hostKey&&result.key&&S.hostKey!==result.key;
  const draftName=roomManagers.draftName,nameDirty=roomManagers.nameDirty;
  Object.assign(roomManagers,result,{roomId:id,ready:true,error:'',draftName:nameDirty?draftName:(result.members.find(m=>m.self)?.name||''),nameDirty});
  if(result.role!=='owner')roomManagers.transferTarget='';
  S.hostRole=result.role;
  if(result.key){S.hostKey=result.key;rememberRoom(id,{key:result.key,host:true,role:result.role,...(changed?{backupSaved:false}:{})});}
}
async function refreshRoomManagers(render=true) {
  if(!S.host||!S.roomId)return;
  if(roomManagers.loading||roomManagers.busy){roomManagers.refreshAgain=true;return;}
  const id=S.roomId,uid=UID,request=++managerRequest;
  roomManagers.roomId=id;roomManagers.loading=true;roomManagers.error='';
  try{const result=await managerApi('/managers',{roomId:id});if(request===managerRequest&&uid===UID)applyRoomManagers(result,id);}
  catch(error){if(request===managerRequest){if(error.message==='not-host')forgetHostAccess(id);else roomManagers.error=managementError(error);}}
  finally{
    if(request===managerRequest){roomManagers.loading=false;if(roomManagers.refreshAgain&&S.host){roomManagers.refreshAgain=false;refreshRoomManagers(render);}}
    if(render&&S.roomId===id&&S.route==='room')keepView();
  }
}
async function changeRoomManagers(path,body,message) {
  if(!S.host||roomManagers.busy)return;

  const id=S.roomId,uid=UID;roomManagers.busy=true;roomManagers.error='';keepView();
  try{const result=await managerApi(path,{roomId:id,...body});if(S.roomId===id&&uid===UID){if(path==='/manager-name')roomManagers.nameDirty=false;applyRoomManagers(result,id);toast(message);}}
  catch(error){if(S.roomId===id){if(error.message==='not-host')forgetHostAccess(id);else{roomManagers.error=managementError(error);if(['management-changed','owner-required','manager-not-found'].includes(error.message)){roomManagers.transferTarget='';roomManagers.refreshAgain=true;toast(managementError(error));}}}}
  finally{if(S.roomId===id){roomManagers.busy=false;if(roomManagers.refreshAgain&&S.host){roomManagers.refreshAgain=false;refreshRoomManagers();}keepView();}}
}

}

async function startKakao(intent='home',roomId='',migrationRooms) {
  if(hostAccount.busy)return;
  if(installPreview()||EMU){hostAccount.error='미리보기에서는 카카오에 연결하지 않아요. 운영 사이트에서 이용해 주세요.';rerender();return;}
  if(S.edit?.dirty||S.sending){toast('바꾼 내용을 먼저 저장해 주세요');return;}
  hostAccount.busy=true;hostAccount.error='';rerender();
  try {
    await boot();
    if(S.roomId)persistRoom();persistDraft();
    if(!hostAccount.uid&&!migrationRooms&&(legacySite()||intent==='arrival')){
      // Signing in replaces an anonymous identity. Preserve every known managed room first.
      const ids=[...new Set([...myRooms().map(r=>r.id),roomId].filter(id=>/^[a-z0-9]{1,64}$/i.test(id||'')))],owned=[];
      for(let offset=0;offset<ids.length;offset+=5)await Promise.all(ids.slice(offset,offset+5).map(async id=>{
        try{const info=await managerApi('/managers',{roomId:id});if(info.members.find(m=>m.self)?.kind==='device')owned.push(id);}
        catch(error){if(!['not-host','room-not-found'].includes(error.message))throw error;}
      }));
      if(owned.length)migrationRooms=owned;
    }
    const verifier=[...crypto.getRandomValues(new Uint8Array(32))].map(x=>x.toString(16).padStart(2,'0')).join('');
    const proof=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)))].map(x=>x.toString(16).padStart(2,'0')).join('');
    const pending={verifier,intent,roomId,returnHash:intent==='migration'?legacyMove.hash:intent==='arrival'?location.hash:roomId?`#r=${roomId}&t=set`:'',at:Date.now()};
    // Require session storage before leaving. A browser change must never silently link another session.
    sessionStorage.setItem('dinner-kakao',JSON.stringify(pending));
    const result=await hostApi('/start',{proof,roomId:roomId||undefined,...(migrationRooms?{migrationRooms}:{})});
    pending.state=result.state;sessionStorage.setItem('dinner-kakao',JSON.stringify(pending));
    location.assign(result.url);
  } catch(error){hostAccount.error=authError(error);hostAccount.busy=false;rerender();}
}

async function initHostAccount({deferView=false}={}) {
  if(installPreview()||EMU)return;
  hostAccount.error='';
  const query=new URLSearchParams(location.search),isCallback=query.has('state')&&(query.has('code')||query.has('error'));
  let pending=null;
  if(isCallback){
    try{pending=JSON.parse(sessionStorage.getItem('dinner-kakao'));}catch{}
    // Remove authorization data before rendering or issuing any requests.
    history.replaceState(null,'',location.pathname+(pending?.returnHash||''));
  }
  try{
    if(isCallback){
      if(query.has('error'))throw Error('login-cancelled');
      if(!pending||pending.state!==query.get('state')||Date.now()-pending.at>600000)throw Error('expired-login');
      const result=await hostApi('/complete',{code:query.get('code'),state:pending.state,verifier:pending.verifier},false);
      if(result.migrationId)sessionStorage.setItem('dinner-migration',result.migrationId);
      await boot();stopListening();
      const credential=await FB.signInWithCustomToken(AUTH,result.customToken);
      UID=credential.user.uid;hostAccount.uid=UID;
      await syncAccountRooms();
      if(!deferView)await finishLegacyReceipt();
      if(result.linkError)hostAccount.error='로그인은 완료했지만 이 방의 연결을 완료하지 못했어요. 관리 링크로 다시 열어 연결해 주세요.';
      sessionStorage.removeItem('dinner-kakao');
      if(deferView){legacyMove.hash=pending.returnHash||legacyMove.hash;return;}
      if(pending.intent==='arrival'){route();return;}
      if(pending.intent==='new'){guestCreateAllowed=false;location.hash='new';await beginCreate();return;}
      if(pending.roomId){await openRoom(pending.roomId,undefined,'set');return;}
      go({route:'home'});return;
    }
    await boot();if(hostAccount.uid){await syncAccountRooms();if(!deferView)await finishLegacyReceipt();}
  }catch(error){hostAccount.error=error.message==='login-cancelled'?'카카오 로그인을 취소했어요. 다시 시작하거나 로그인 없이 이용할 수 있어요.':authError(error);}
  finally{hostAccount.ready=true;hostAccount.busy=false;}
  if(deferView)return;
  if(S.route==='home'||isCallback)rerender();
  else if(S.route==='room')keepView();
}

let FB = null, DB = null, UID = '', AUTH = null;
let booting = null;
function boot() {
  return booting ??= (async () => {
    const fb = await import('./firebase.js');
    const app = fb.initializeApp(EMU ? {...FB_CONFIG, projectId: 'demo-camp-arcade'} : FB_CONFIG);
    const auth = fb.getAuth(app);
    let db=DB;
    // Signing out replaces the identity, not the already initialized Firestore client.
    if(!db){
      try { db = fb.initializeFirestore(app, {localCache: fb.persistentLocalCache({tabManager: fb.persistentMultipleTabManager()})}); }
      catch { db = fb.initializeFirestore(app, {}); }
      if (EMU) { fb.connectAuthEmulator(auth, 'http://127.0.0.1:9099', {disableWarnings: true}); fb.connectFirestoreEmulator(db, '127.0.0.1', 8080); }
    }
    let user = await new Promise(res => { const stop = fb.onAuthStateChanged(auth, u => { stop(); res(u); }); });
    if (!user) user = (await fb.signInAnonymously(auth)).user;
    FB = fb; DB = db; UID = user.uid; AUTH=auth;
    const token=installPreview()?{claims:{}}:await user.getIdTokenResult();
    hostAccount.uid=token.claims.dinnerKakao===true?user.uid:'';
  })().catch(e => { booting = null; throw e; });
}
function friendly(e) {
  const c = String(e && (e.code || e.message) || e);
  if (/permission/.test(c)) return '권한이 없어요. (다맛다가 마감됐거나, 다른 기기에서 같은 이름으로 보낸 선택이에요)';
  if (/unavailable|network|offline/i.test(c)) return '인터넷 연결을 확인해 주세요.';
  if (/operation-not-allowed|admin-restricted/.test(c)) return 'Firebase 익명 로그인이 꺼져 있어요.';
  return '잠깐 문제가 생겼어요. 다시 해 주세요.';
}

        if(job.data)await FB.setDoc(ref,{...job.data,updatedAt:FB.serverTimestamp()});else await FB.deleteDoc(ref);
        cartStateSync.synced.set(job.key,job.signature);

async function installApp() {
  if (appInstalled()) { toast('이미 앱으로 열려 있어요. 홈 화면의 다맛다 아이콘을 이용해 주세요.'); return; }
  if (installBusy) return;
  if (!deferredInstallPrompt || installPreview() || installLegacy()) { openInstallGuide(); return; }
  const prompt = deferredInstallPrompt;
  deferredInstallPrompt=null;installBusy=true;refreshInstallUI();
  try {
    await prompt.prompt();
    const choice = await prompt.userChoice;
    if (!installedThisVisit) toast(choice.outcome==='accepted'?'설치 요청을 보냈어요. 브라우저의 안내를 확인해 주세요.':'원할 때 앱 설치하기를 다시 눌러 주세요.');
  } catch { openInstallGuide(); }
  finally { installBusy=false;refreshInstallUI(); }
}

// 첫 화면의 방 상태(제목·마감·응답 수)를 한 번 읽어 와요.
async function loadSums(rooms) {
  S.sumsLoading = true;
  try {
    await boot();
    await Promise.all(rooms.map(async r => {
      try {
        const snap = await FB.getDoc(FB.doc(DB, 'dinnerRooms', r.id));
        if (!snap.exists()) { S.sums[r.id] = {gone: true}; return; }
        const d = tidyRoom(snap.data()), sum = {title: d.title, closed: d.closed, deadline: d.deadline, treat: d.treat, answers: null};
        if (r.host) { try { sum.answers = (await FB.getDocs(FB.collection(DB, 'dinnerRooms', r.id, 'answers'))).size; } catch {} }
        S.sums[r.id] = sum;
      } catch { S.sums[r.id] = {title: r.title, closed: false, answers: null, err: true}; }
    }));
  } catch {}
  S.sumsLoading = false;
  if (S.route === 'home' && !document.querySelector('.install-sheet')) rerender();
}

let catalogMap=null;
function catalogSelectionCount() {
  const target=S.catFor==='create'?S.draft:S.edit;
  return S.catPicked.size+(target?.stores || []).filter(s=>!CATALOG.stores.some(c=>c.id===s.id)).length;
}
async function addPlaceToDraft(place, menuStore, lines, target, scope) {
  const stillHere=()=>S.route==='catalog' && S.catFor===scope && target===(scope==='create'?S.draft:S.edit);
  if(!stillHere()) throw new Error('가게 선택 화면에서 다시 담아 주세요.');
  const id=menuStore?.id || place.id;
  if(target.stores.some(s=>s.id===id)) return;
  if(catalogSelectionCount()>=20) throw new Error('한 모임에는 가게를 20곳까지 담을 수 있어요.');
  const store=menuStore ? fromCatalog(await loadCatalogStore(menuStore)) : tidyStore({...place,emoji:'🍽️',color:'#eaf6f4',menu:parseMenu(lines,id)});
  if(!stillHere()) throw new Error('화면이 바뀌어 담기를 취소했어요.');
  if(!store.menu.length) throw new Error('메뉴를 한 줄 이상 적어 주세요.');
  if(target.stores.some(s=>s.id===id)) return;
  if(catalogSelectionCount()>=20) throw new Error('한 모임에는 가게를 20곳까지 담을 수 있어요.');
  target.stores.push(store);
  if(menuStore) S.catPicked.add(id);
  if(scope==='room') target.dirty=true;
  else persistDraft();
  const done=document.getElementById('catDone');if(done)done.textContent=`${catalogSelectionCount()}곳 담기 완료`;
}
async function mountCatalogMap() {
  const root=document.getElementById('catalogMap');if(!root)return;
  try{
    const {mountMenuMap}=await import('./menu-map.js');
    if(document.getElementById('catalogMap')!==root)return;
    catalogMap=mountMenuMap(root,CATALOG.stores.filter(catalogMatches),{isSelected:id=>S.catPicked.has(id),onToggle:id=>{
      if(!S.catPicked.has(id) && catalogSelectionCount()>=20){toast('한 모임에는 가게를 20곳까지 담을 수 있어요.');return false;}
      if(S.catPicked.has(id))S.catPicked.delete(id);else S.catPicked.add(id);
      document.getElementById('catList').innerHTML=catalogList();document.getElementById('catDone').textContent=`${catalogSelectionCount()}곳 담기 완료`;
      return true;
    }});
  }catch{if(document.getElementById('catalogMap')===root)root.textContent='지도를 불러오지 못했어요. 아래 목록에서 계속 고를 수 있어요.';}
}

// ---------- 방 ----------
function viewRoom() {
  if (S.loading || (!S.room && !S.error)) return `${topBar('', 'home')}${brandLoadingView()}`;
  if (!S.room) {
    return `${topBar('다맛다', 'home')}<div class="empty"><div class="big">🔍</div><h2>${S.error === 'gone' ? '방을 찾을 수 없어요' : '방을 열지 못했어요'}</h2><p class="muted">${S.error === 'gone' ? '링크가 맞는지, 방이 삭제되지 않았는지 확인해 주세요.' : esc(S.error)}</p><button class="btn" data-act="retry">다시 열기</button></div>`;
  }
  if (!S.who && !['sum', 'set', 'all'].includes(S.tab)) S.tab = 'who';
  const views = {who: roomWho, menu: roomMenu, store: roomStore, cart: roomCart, review: roomReview, mine: roomMine, all: roomAll, sum: roomSum, set: roomSet};
  let html = (views[S.tab] || roomMenu)();
  if(hasUnsentCart()&&!['menu','store','cart','review'].includes(S.tab))html=html.replace('</header>',`</header><aside class="pending-room-notice" role="status"><b>${esc(S.who)} · ${myAnswer()?'변경사항을 아직 보내지 않았어요':'담은 메뉴를 아직 보내지 않았어요'}</b><button class="text-btn" data-act="tab" data-t="cart">장바구니 확인 ›</button></aside>`);
  if(S.host)html=html.replace('</header>','</header>'+managementBackupHtml());
  if(S.managementNotice)html=html.replace('</header>',`</header><aside class="management-notice" role="alert">${esc(S.managementNotice)}</aside>`);
  const pinned = (['who', 'menu', 'store'].includes(S.tab) ? pinBar() : '')
    + (['menu', 'store'].includes(S.tab) ? storeShortcuts() : '');
  return pinned ? '<div class="room-pinned">' + html.replace('</header>', '</header>' + pinned + '</div>') : html;
}
function storeShortcuts() {
  const stores = S.room.stores;
  if (stores.length < 2) return '';
  return `<nav class="store-shortcuts${stores.length>2?' many':''}" aria-label="가게 메뉴 바로가기">${stores.map(s=>`<button type="button" data-act="store-jump" data-id="${esc(s.id)}" aria-controls="store-heading-${encodeURIComponent(s.id)}" aria-label="${esc(s.name)} 메뉴로 이동"><span>${esc(s.name)}</span><i aria-hidden="true">↓</i></button>`).join('')}</nav>`;
}
// Track the store occupying most of the readable area, excluding fixed controls.
function updateStoreHighlight() {
  const buttons = [...document.querySelectorAll('.store-shortcuts button')];
  if (!buttons.length) return '';
  const entries = [...document.querySelectorAll('.room-menu-store')]
    .map(section=>({id:section.dataset.storeId,rect:section.getBoundingClientRect()}))
    .filter(entry=>entry.rect.bottom>entry.rect.top);
  const top = Math.max(0,document.querySelector('.room-pinned')?.getBoundingClientRect().bottom || 0) + 12;
  let bottom = innerHeight;
  const bounds = entries[0]?.rect;
  if (bounds) for (const overlay of document.querySelectorAll('.nav,.cartbar')) {
    const rect = overlay.getBoundingClientRect();
    if (rect.left<bounds.right && rect.right>bounds.left && rect.top>top) bottom=Math.min(bottom,rect.top);
  }
  let current='',largest=0;
  for (const entry of entries) {

    return `${topBar('장바구니', '', whoChip())}<div class="wrap">${answerConflictHtml()}</div><div class="empty"><div class="empty-food" aria-hidden="true">${FOOD_ICONS.tray}</div><h2>아직 담은 메뉴가 없어요</h2>${a ? '<p class="muted">이미 보낸 메뉴는 그대로 있어요.</p>' : ''}<button class="btn" data-act="tab" data-t="menu">메뉴 고르기</button>
    ${a ? '<button class="text-btn red" data-act="answer-del" style="margin-top:14px">보낸 메뉴 취소</button>' : ''}</div>${roomNav()}`;
  }

  <div class="cart-page"><div class="cart-heading"><h2>담은 메뉴 <span>${cartCount()}</span></h2><button class="text-btn" data-act="tab" data-t="menu">＋ 더 담기</button></div>
  ${[...byStore].map(([s, ls]) => `<section class="cart-store"><div class="cs-head">${thumb(s, 'sm')}<b>${esc(s.name)}</b></div>
    ${ls.map(l => menuItemBox({...l.item, n:l.n}, '', qtyCtl(l.item.id,l.item.name))).join('')}${storeRequestInput(s)}</section>`).join('')}
  ${S.req ? `<section class="cart-req legacy-request"><label for="req" class="h3">가게 미지정 요청</label><p class="hint">가게별 요청으로 옮겨 주세요. 주문 메시지에 자동으로 들어가지 않아요.</p><textarea class="input" id="req" maxlength="200" rows="2">${esc(S.req)}</textarea></section>` : ''}
  ${locked()?'':thanksComposer()}
  <section class="cart-summary"><div class="total"><span>합계</span><b>${won(cartSum())}</b></div>
    ${budget() ? `<div class="cart-budget${budgetLeft() < 0 ? ' over' : ''}"><span>${esc(budgetLabel(S.room.treat))} 예산 ${won(budget())}</span><b>${budgetLeft() < 0 ? `${won(-budgetLeft())} 초과` : `${won(budgetLeft())} 남음`}</b></div>` : ''}
    <p class="cart-footnote">${a ? '다시 보내면 기존 메뉴가 바뀌어요.' : '방장에게 메뉴를 보내요. 가게 주문은 별도예요.'}</p></section></div>
  ${locked() || S.answerConflict ? '' : cartBar(S.sending ? '보내는 중…' : cartIsSent() ? '보낸 메뉴 보기' : a ? '변경사항 보내기' : '메뉴 보내기', cartIsSent() ? 'tab" data-t="mine' : 'send')}${roomNav()}`;
}

function roomReview() {
  const lines = cartLines();
  if (!lines.length) return roomCart();
  const a = myAnswer();
  const draft = {name: S.who, at: Date.now(), ...currentDraft()};
  return `${topBar('보내기 전 확인', 'tab" data-t="cart', whoChip())}<div class="wrap review">
    ${closedNote()}${answerConflictHtml()}${selectionStatus()}<h2 class="sec-title">${esc(S.who)} 님, 이렇게 보낼까요?</h2>
    ${ticket(draft, true)}
    <p class="hint">${a ? '다시 보내면 보낸 메뉴가 이 내용으로 바뀌어요.' : '보내면 이 방의 모인 메뉴에 반영돼요. 가게 주문은 별도로 진행해요.'}</p>
    <button class="btn gray block" data-act="tab" data-t="cart">메뉴·요청사항 고치기</button>
  </div>${locked() || S.answerConflict ? '' : cartBar(S.sending ? '보내는 중…' : a ? '변경사항 보내기' : '장바구니 보내기', 'send')}${roomNav()}`;
}
// Menu names remain the primary content in cart, confirmation and both summaries.
function menuItemBox(item, storeName = '', controls = '') {
  return `<div class="menu-item-box"><div class="menu-item-main"><b class="menu-item-name">${esc(item.name)}</b>${storeName ? `<span class="menu-item-store">${esc(storeName)}</span>` : ''}</div>
    <div class="menu-item-side">${controls || `<span class="menu-item-count">${item.n}개</span>`}${item.price != null ? `<b class="menu-item-price">${item.price ? won(item.price * item.n) : '가격 확인'}</b>` : ''}</div></div>`;
}
function answerStoreGroups(a) {
  const groups = new Map();
  for (const item of a.items) { if (!groups.has(item.s)) groups.set(item.s, []); groups.get(item.s).push(item); }
  return [...groups];
}
function answerMenuBoxes(a, showEmptyRequests = false) {
  return answerStoreGroups(a).map(([sid, items]) => {
    const name = storeOf(sid)?.name || '(지운 가게)', request = str(a.storeReqs?.[sid], 200).trim();
    return `<section class="answer-store-group" aria-label="${esc(name)} 메뉴"><h3 class="answer-store-name">${esc(name)}</h3>${items.map(i => menuItemBox(i)).join('')}
      ${request || showEmptyRequests ? `<div class="menu-box-request"><b>${esc(name)} 요청사항</b><p>${esc(request) || '요청사항 없음'}</p></div>` : ''}</section>`;
  }).join('');
}
function ticket(a, preview = false) {
  const sum = a.items.reduce((x, i) => x + i.price * i.n, 0);
  return `<div class="ticket"><div class="t-head"><span>🍽 ${esc(S.room.title)}</span><b>${avatar(a.name)} ${esc(a.name)}</b><small>${preview ? '아직 제출 전 · 최종 확인' : `${new Date(a.at).toLocaleString('ko-KR', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'})} 보내기 완료`}</small></div>
    ${answerMenuBoxes(a)}${legacyRequestHtml(a)}${thanksReceipt(a.thanks)}
    <div class="t-total"><span>합계</span><b>${won(sum)}</b></div></div>`;
}

function roomMine() {
  const mine = [...S.answers.values()].filter(a => a.uid === UID).sort((a, b) => (b.name === S.who) - (a.name === S.who) || b.at - a.at);
  const cur = myAnswer(), other = cur && cur.uid && cur.uid !== UID && !S.host; // 같은 이름으로 다른 기기에서 보낸 주문
  const lock = locked();
  if (!mine.length && !other) return `${topBar('보낸 메뉴', '', whoChip())}<div class="empty"><div class="big">🧾</div><h2>아직 보낸 메뉴가 없어요</h2><p class="muted">메뉴를 담고 「메뉴 보내기」를 눌러 주세요.</p><button class="btn" data-act="tab" data-t="${cartCount() ? 'cart' : S.who ? 'menu' : 'who'}">${cartCount() ? '장바구니 확인하기' : '메뉴 보러 가기'}</button></div>${roomNav()}`;
  const justSent = cur && cur.uid === UID && Date.now() - S.sentAt < 15000;
  return `${topBar('보낸 메뉴', '', whoChip())}<div class="wrap">
    ${cur && !other && !cartIsSent() ? `<div class="notice"><b>장바구니에 보내지 않은 변경사항이 있어요.</b><p>아래는 마지막으로 보낸 메뉴예요.</p><button class="text-btn" data-act="tab" data-t="cart">장바구니 이어서 확인하기 ›</button></div>` : ''}
    ${other ? `<div class="notice other-dev"><b>「${esc(cur.name)}」 선택은 다른 기기에서 보냈어요.</b> 고치려면 그 기기에서 하거나 방을 관리하는 사람에게 알려 주세요. 내 이름이 아니면 아래에서 이름을 다시 골라 주세요.</div>${ticket(cur)}` : ''}
    ${justSent ? `<div class="sent-ok" role="status"><div class="so-ic"><span class="sent-brand" aria-hidden="true">${FOOD_ICONS.tray}</span></div><div><h2>다맛다!</h2><p class="muted">마감 전까지 고칠 수 있어요.</p></div></div>` : ''}
    ${mine.length ? `<div class="mine-head"><h2 class="sec-title">내가 보낸 메뉴 <small>${mine.length}</small></h2>${mine.length > 1 ? '<span class="hint">이름마다 따로 고치고 취소할 수 있어요</span>' : ''}</div>` : ''}
    <div class="stack">${mine.map(a => `<div class="mine-item${a.name === S.who ? ' cur' : ''}">${ticket(a)}
      <div class="row mine-acts"><button class="btn gray" style="flex:1" data-act="edit-mine" data-who="${esc(a.name)}"${lock ? ' disabled' : ''}>고치기</button><button class="btn gray" style="flex:1" data-act="answer-del" data-who="${esc(a.name)}"${lock ? ' disabled' : ''}>취소</button></div></div>`).join('')}</div>
    ${lock ? `<p class="hint" style="text-align:center;margin-top:10px">${S.room.closed ? '다맛다가 마감되어' : '마감 시간이 지나서'} 고치거나 취소할 수 없어요.</p>` : ''}
    <button class="btn line-dark block" style="margin-top:14px" data-act="tab" data-t="who">다른 사람 메뉴도 고르기</button>
    <button class="text-btn" data-act="tab" data-t="${S.host ? 'sum' : 'all'}" style="margin-top:8px">모인 메뉴 구경하기 ›</button>
  </div>${roomNav()}`;
}

// ---------- 모인 주문 ----------
function totals() {
  const groups = new Map();
  for (const a of S.answers.values()) {
    for (const it of a.items) {
      if (!groups.has(it.s)) groups.set(it.s, {store: storeOf(it.s) || {id: it.s, name: '(지운 가게)', phone: '', emoji: '🍴', color: '#eef2f3', menu: []}, items: new Map(), who: new Map(), sum: 0});
      const g = groups.get(it.s);
      const k = it.m, row = g.items.get(k) || {id:it.m,name:it.name,n:0,price:it.price,sum:0,people:new Map()};
      row.n += it.n; row.sum += it.price*it.n; row.people.set(a.name,(row.people.get(a.name)||0)+it.n); g.items.set(k, row); g.sum += it.price * it.n;
      if (!g.who.has(a.name)) g.who.set(a.name, {ls: [], r: str(a.storeReqs?.[it.s], 200).trim()});
      g.who.get(a.name).ls.push(`${it.name} ${it.n}`);
    }
  }
  const order = (S.room?.stores || []).map(s => s.id);
  return [...groups.values()].sort((x, y) => order.indexOf(x.store.id) - order.indexOf(y.store.id));
}
function ownerMessage(g) {
  const lines = [`안녕하세요, 사장님! ${S.room.title} 주문입니다.`, '────────', ...[...g.items.values()].map(i => `${i.name} ${i.n}개`), '────────', `합계 ${won(g.sum)} (메뉴판 가격 기준)`];
  if (S.room.note) lines.push(S.room.note);
  if (S.byPerson) lines.push('', '사람별로 나눠 담아 주시면 감사하겠습니다.', ...[...g.who].map(([w, x]) => `- ${w}: ${x.ls.join(', ')}${x.r ? ` (요청: ${x.r})` : ''}`));
  else { const reqs = [...g.who].filter(([, x]) => x.r); if (reqs.length) lines.push('', '요청 사항', ...reqs.map(([w, x]) => `- ${w}: ${x.r}`)); }
  lines.push('', '감사합니다!');
  return lines.join('\n');
}
function shareCard() {
  return `<details class="share-card"${S.created || !S.answers.size ? ' open' : ''}><summary class="sc-top"><span class="sc-ic">${ICON.link}</span><div><b>참여 링크</b><span>링크를 보내 함께 고르기</span></div><span class="sc-expand" aria-hidden="true">⌄</span></summary><div class="sc-content">
    <div class="sc-link">${esc(roomLink())}</div>
    <button class="btn block" data-act="copy-invite">${ICON.link}링크 보내기</button>
    <div id="inviteBox" hidden class="copy-box"><textarea class="input code-box" readonly aria-label="초대 글"></textarea></div></div></details>`;
}
function progressBlock(withRemind) {
  const r = S.room, answered = new Set([...S.answers.values()].map(a => a.name));
  if (!r.names.length) return `<section class="participation"><div class="participation-top"><span>참여 현황</span><b>${S.answers.size}<small>명 보냄</small></b></div></section>`;
  const todo=r.names.filter(n=>!answered.has(n)),done=r.names.length-todo.length,extra=[...answered].filter(n=>!r.names.includes(n)),pct=Math.round(done/r.names.length*100);
  const remind=`🍽 ${r.title}\n아직 메뉴를 보내지 않은 분: ${todo.join(', ')}\n메뉴를 골라 보내 주세요.\n${roomLink()}`;
  return `<section class="participation"><div class="participation-top"><span>참여 현황${extra.length ? ` · 명단 밖 ${extra.length}명` : ''}</span><b>${done}<small>/ ${r.names.length}명</small></b></div><div class="participation-track"><div class="bar"><i style="width:${pct}%"></i></div><span>${pct}%</span></div>
  ${todo.length ? `<details class="pending-people"><summary><span>아직 안 보낸 사람 <b>${todo.length}</b></span><span>${todo.slice(0,3).map(esc).join(' · ')}${todo.length>3?' 외':''} ⌄</span></summary><div class="pills">${todo.map(w=>`<span class="pill no">${esc(w)}</span>`).join('')}</div>${withRemind?'<button class="text-btn" data-act="copy-remind">참여 안내 복사</button><div id="remindBox" hidden class="copy-box"><textarea class="input code-box" readonly></textarea></div>':''}</details>` : '<p class="all-done">모두 보냈어요 ✓</p>'}
  ${withRemind ? `<textarea id="remindText" hidden>${esc(remind)}</textarea>` : ''}</section>`;
}

function summaryMenuHtml(item) {
  const people=[...item.people].map(([name,n])=>esc(name)+(n>1?' ×'+n:'')).join(' · ');
  return `<div class="summary-store-line"><strong>${item.id?.startsWith('custom-')?'<small class="shared-menu-tag">직접 추가</small>':''}${esc(item.name)}</strong><span class="summary-menu-people" aria-label="고른 사람">${people}</span><span class="summary-menu-count">${item.n}개</span><b class="summary-menu-price">${won(item.sum)}</b></div>`;
}
function byStoreHtml(host) {
  const groups = totals();
  if (!groups.length) return '<p class="muted empty-line">아직 모인 메뉴가 없어요.</p>';
  const total = groups.reduce((a, g) => a + g.sum, 0);
  const unassigned = [...S.answers.values()].filter(a => a.req);
  return `${unassigned.length ? `<section class="card unassigned-requests"><h3>가게 미지정 요청 · 이전 방식</h3><p class="hint">어느 가게의 요청인지 확인해 주세요. 아래 가게 주문 메시지에는 자동으로 넣지 않아요.</p>${unassigned.map(a => `<p><strong>${esc(a.name)}</strong><br>${esc(a.req)}</p>`).join('')}</section>` : ''}
  
  <div class="stack">${groups.map((g, i) => `<section class="card sum-card store-summary-card"><div class="sum-head">${thumb(g.store, 'sm')}<div><b>${esc(g.store.name)}</b>${g.store.phone ? `<span>${esc(g.store.phone)}</span>` : ''}</div><b class="sum-won">${won(g.sum)}</b></div>
    ${[...g.items.values()].map(summaryMenuHtml).join('')}
    <p class="order-people">${g.who.size}명 · ${[...g.items.values()].reduce((sum,item)=>sum+item.n,0)}개</p>
    ${[...g.who].some(([, x]) => x.r) ? `<div class="group-requests"><b>이 가게 요청사항</b>${[...g.who].filter(([, x]) => x.r).map(([w, x]) => `<p><strong>${esc(w)}</strong> · ${esc(x.ls.join(', '))}<br>${esc(x.r)}</p>`).join('')}</div>` : ''}
    ${host ? `<details class="message-preview no-print"><summary>주문 메시지 옵션</summary><label class="toggle"><input type="checkbox" data-act="by-person" ${S.byPerson ? 'checked' : ''}> 사람별로 나눠 적기</label><pre>${esc(ownerMessage(g))}</pre></details>` : ''}
    ${host ? `<div class="row no-print">${g.store.phone ? `<button class="btn gray" data-act="copy" data-text="${esc(g.store.phone)}" data-msg="📞 번호를 복사했어요">번호 복사</button>` : ''}<button class="btn" style="flex:1" data-act="copy-owner" data-i="${i}">${ICON.copy || ICON.link} 주문 메시지 복사</button></div>
    <div id="ownerBox${i}" hidden class="copy-box"><textarea class="input code-box" readonly></textarea></div>` : ''}</section>`).join('')}
  <div class="card"><div class="total" style="margin:0;padding:0;border:0"><span>전체 합계</span><span>${won(total)}</span></div></div></div>`;
}
function byPersonHtml(host) {
  const order=S.room.names;
  const list=[...S.answers.values()].sort((a,b)=>((order.indexOf(a.name)+1||999)-(order.indexOf(b.name)+1||999))||a.at-b.at);

function sumSeg() {
  return `<div class="seg wide no-print" role="group"><button class="${S.sumBy === 'store' ? 'on' : ''}" data-act="sum-by" data-by="store">가게별</button><button class="${S.sumBy === 'person' ? 'on' : ''}" data-act="sum-by" data-by="person">사람별</button></div>`;
}
function roomSum() {
  if (!S.host) { S.tab = 'all'; return roomAll(); }
  return `${topBar('방 관리', 'home')}
  <div class="wrap admin host-layout"><section class="host-room-title"><h2>${esc(S.room.title)}</h2><p>${S.room.closed ? '마감' : deadlineInfo(S.room.deadline) ? esc(deadlineInfo(S.room.deadline).text) : '메뉴 모으는 중'}${S.room.treat ? ` · ${esc(treatHeadline(S.room.treat.by))}` : ''}</p><div id="inviteBox" hidden class="copy-box"><textarea class="input code-box" readonly aria-label="초대 글"></textarea></div></section>
    <aside class="host-overview" aria-label="참여 현황"><div class="invite-actions"><button class="invite-copy" data-act="copy-invite"><span class="invite-icon" aria-hidden="true">${ICON.link}</span><span><b>초대 링크 복사</b><small>같이 먹을 사람에게 보내기</small></span><span class="invite-arrow" aria-hidden="true">↗</span></button><button class="invite-share" data-act="share-invite" aria-label="초대 링크 공유">${ICON.ext}</button></div>
${hostCartProgressHtml()}</aside>
    <div class="host-results">${thanksWall(true)}${sumSeg()}${S.sumBy === 'store' ? byStoreHtml(true) : byPersonHtml(true)}

      closed: false, createdAt: FB.serverTimestamp(), updatedAt: FB.serverTimestamp(),
    });

    }

  } catch (e) {

    persistDraft(); rerender(); scrollTo(0, 0);
  }
}
async function sendAnswer() {
  if (S.sending) return;
  captureRequests(); syncAnswerDraft();
  if (!S.answersReady) { toast('제출 내역을 불러오는 중이에요. 잠시 후 다시 보내 주세요.'); return; }
  if (S.answerConflict || !S.answerBase) { S.answerConflict = true; go({tab:'cart'}); return; }
  const lines = cartLines();
  if (!lines.length) return;
  if (locked()) { toast(S.room.closed ? '다맛다가 마감됐어요' : '마감 시간이 지났어요'); return; }
  if (budget() && budgetLeft() < 0) { overBudgetToast(); return; }
  const roomId = S.roomId, who = S.who, expected = S.answerBase.version;
  const payload = {name:who, req:S.req, storeReqs:draftStoreReqs(), uid:UID,
    items:lines.map(l => ({m:l.item.id,n:l.n,name:l.item.name,price:l.item.price,s:l.item.store.id}))};
  const thanks=tidyThanks(S.thanks);if(thanks)payload.thanks=thanks;
  S.sending = true; rerender(); sendingCurtain();
  try {
    const ref = FB.doc(DB, 'dinnerRooms', roomId, 'answers', answerId(who));
    await FB.runTransaction(DB, async transaction => {
      const snapshot = await transaction.get(ref);
      const latest = snapshot.exists() ? tidyAnswer(answerId(who),snapshot.data()) : null;
      if (answerVersion(latest) !== expected) throw Object.assign(new Error('Answer changed'), {code:'answer-changed',latest});
      transaction.set(ref, {...payload,at:FB.serverTimestamp()});
    });
    if (S.roomId !== roomId || S.who !== who) { S.sending = false; dismissSendCurtain(false); return; }
    // The content is the compare-and-set token; timestamps need not be guessed.
    S.answerBase = {version:answerVersion(payload),content:orderContent(payload)}; S.answerConflict = false;
    if (answerVersion(myAnswer()) === expected) S.answers.set(answerId(who),{...payload,id:answerId(who),at:Date.now()});
    S.sending = false; S.sentAt = Date.now(); syncAnswerDraft(); persistRoom();
    setSentNames(S.roomId, [...new Set([...sentNames(S.roomId), S.who])]);
    buzz([20, 40, 20]);
    go({tab: 'mine'});
    finishSendCurtain(thanks);
  } catch (e) {
    S.sending = false; dismissSendCurtain(false); rerender();
    if (S.roomId !== roomId || S.who !== who) return;
    if (e.code === 'answer-changed') {
      if (e.latest) S.answers.set(answerId(who),e.latest); else S.answers.delete(answerId(who));
      S.answerConflict = true; go({tab:'cart'}); return;
    }
    toast(/permission/.test(String(e && e.code)) ? (S.room.closed ? '다맛다가 마감됐어요.' : `「${S.who}」 이름으로 다른 기기에서 이미 보냈어요. 그 기기에서 고치거나 방을 관리하는 사람에게 알려 주세요.`) : friendly(e));
  }
}

  if (S.edit && t.id === 'e-treat') { S.edit.treat = t.checked ? (S.room.treat ? {...S.room.treat} : {by: '', cap: 10000}) : null; S.edit.dirty = true; rerender(); return; }
  if (S.edit && t.id === 'e-treat-by') { S.edit.treat.by = t.value; markDirtySoft(); return; }
  if (S.edit && t.id === 'e-treat-unit') { S.edit.treat.unit=t.value.slice(0,12);const label=document.getElementById('e-budget-label');if(label)label.textContent=budgetLabel(S.edit.treat)+' 예산';markDirtySoft();return; }
  if (S.edit && t.id === 'e-treat-cap') { S.edit.treat.cap = num(t.value); markDirtySoft(); return; }
  if (S.edit && t.dataset.e) { S.edit[t.dataset.e] = t.type === 'checkbox' ? t.checked : t.value; markDirtySoft(); return; }
  if (S.edit && t.dataset.em) {
    for (const s of S.edit.stores) for (const m of s.menu) if (m.id === t.dataset.em) { m[t.dataset.f] = t.dataset.f === 'price' ? num(t.value) : t.value; delete m.priceBasis;delete m.priceSource;delete m.priceDataDate;delete m.priceComparison;s.checkedAt='';s.menuBasis=''; }
    markDirtySoft();
  }
});
// 글자를 적는 동안에는 다시 그리지 않고, 저장 막대만 띄워요.
function markDirtySoft() {
  if (S.edit.dirty) return;
  S.edit.dirty = true;
  const nav = document.querySelector('.nav');
  (nav || $app).insertAdjacentHTML(nav ? 'beforebegin' : 'beforeend', `<div class="bottom-bar save-bar"><button class="btn gray" data-act="edit-cancel">되돌리기</button><button class="btn" style="flex:1" data-act="edit-save">바꾼 내용 저장</button></div>`);
}
document.addEventListener('change', e => { if (e.target.dataset.e === 'freeJoin' && S.edit) { S.edit.freeJoin = e.target.checked; markDirtySoft(); } });
document.addEventListener('keydown', e => {
  if(e.target.matches?.('[data-cart-status]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
    e.preventDefault();const tabs=[...document.querySelectorAll('[data-cart-status]')],at=tabs.indexOf(e.target),next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(at+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[next]?.click();return;
  }
  if (e.key === 'Escape' && e.target.id === 'menuSearch') { e.preventDefault(); S.menuQuery = ''; e.target.value = ''; refreshMenuSearch(); return; }
  if (e.key === 'Escape' && document.getElementById('sheet')) { closeSheet(); return; }
  if (e.key === 'Enter' && e.target.id === 'whoName') document.querySelector('[data-act="who-typed"]')?.click();
});

// ---------- 주소 ----------
function route() {
  if(legacyMove.active){if(location.hash!==legacyMove.hash){legacyMove.hash=location.hash;legacyMove.error='주소가 바뀌었어요. 연결 상태를 다시 확인한 뒤 이동해 주세요.';if(!legacyMove.busy)rerender();}return;}
  const catalogView=history.state?.dinnerCatalog;
  if(catalogView && ['region','stores'].includes(catalogView.step) && ['create','room'].includes(catalogView.scope) && (catalogView.scope==='create'?S.draft:S.edit) && (!catalogView.roomId||catalogView.roomId===S.roomId)){
    Object.assign(S,{route:'catalog',catStep:catalogView.step,catFor:catalogView.scope,catCity:catalogView.city||'all',catArea:'all',catCat:'all',catFilters:false,catShowMap:false,catLimit:12,catPreview:''});render();scrollTo(0,0);return;
  }
  // 예전 「링크로 보내기」 판(#s=…)은 classic.html 로 보내요.
  if (/^#s=/.test(location.hash)) { location.replace('classic.html' + location.hash); return; }
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  const id = (h.get('r') || '').replace(/[^a-z0-9]/gi, '').slice(0, 40);
  const want = ROOM_TABS.includes(h.get('t')) ? h.get('t') : '';
  if (S.route === 'room' && S.tab === 'set' && S.edit?.dirty && (id !== S.roomId || want !== 'set')) {
    rememberView('pushState'); toast('바꾼 내용을 저장하거나 되돌려 주세요'); return;
  }
  if (location.hash === '#new') { stopListening();beginCreate();return; }
  if (id) {
    const key = (h.get('k') || '').replace(/[^a-z0-9_-]/gi, '').slice(0, 64);
    // 방장 열쇠는 주소창에서 바로 지워요(실수로 그대로 공유하지 않게). 이 기기에는 기억해요.
    if (key) { rememberRoom(id, {key}); history.replaceState(null, '', `#r=${id}${want ? `&t=${want}` : ''}`); }
    if (id !== S.roomId || S.route !== 'room') openRoom(id, key, want);
    else go({...restoredRoomView(id), tab: want || (S.who ? 'menu' : 'who')}, false);
    return;
  }
  stopListening(); S.roomId = '';
  if (S.route !== 'catalog') go({route: 'home'}, false);
}
addEventListener('hashchange', route);
// Two store views can share the same hash; popstate also restores their store/search context.
addEventListener('popstate', route);
function launchApp() {
  if(legacySite()){
    let stay=false;try{stay=sessionStorage.getItem('dinner-legacy-stay')==='1';}catch{}
    const q=new URLSearchParams(location.search),callback=q.has('state')&&(q.has('code')||q.has('error'));
    if(!stay||callback){legacyMove.hash=location.hash;checkLegacyMove();return;}
  }
  const query=new URLSearchParams(location.search);
  if(query.has('state')&&(query.has('code')||query.has('error'))){
    hostAccount.busy=true;
    document.getElementById('app').innerHTML='<div class="wrap host-gate" role="status"><h1>카카오 로그인 확인 중…</h1><p>연결한 모임을 안전하게 불러오고 있어요.</p></div>';
  }else route();
  initHostAccount();
}
launchApp();
checkAppUpdate();
setInterval(checkAppUpdate,60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='hidden')checkAppUpdate();});
addEventListener('focus',checkAppUpdate);
addEventListener('online',()=>{appUpdate.checkedAt=0;checkAppUpdate();});
setInterval(() => { if (S.route === 'room' && S.room && S.room.deadline && !document.getElementById('sheet') && !document.querySelector('input:focus,textarea:focus')) { const c = document.querySelector('.rh-meta'); if (c) rerender(); } }, 60000);


// Optional requests remain open across quantity changes and snapshot renders.
document.addEventListener('toggle', event => { const el=event.target;if(el.matches?.('[data-request-fold]')&&el.isConnected){S.requestOpen ||= {}; S.requestOpen[el.dataset.requestFold]=el.open;} }, true);

document.addEventListener('toggle',event=>{const el=event.target;if(el.matches?.('[data-settings-fold]')&&el.isConnected){S.settingsOpen ||= {};S.settingsOpen[el.dataset.settingsFold]=el.open;}},true);
document.addEventListener('toggle',event=>{const el=event.target;if(el.matches?.('[data-thanks-fold]')&&el.isConnected)S.thanksOpen=el.open;},true);
document.addEventListener('toggle',event=>{const el=event.target;if(el.matches?.('[data-cart-help]')&&el.isConnected)S.cartProgressHelpOpen=el.open;},true);

</script>
