<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>메뉴 모으기</title>
<meta name="description" content="방을 만들고 링크를 보내면, 다들 이름을 고르고 메뉴를 담아 보내요. 방장은 모인 주문을 가게별로 바로 봐요.">
<meta property="og:title" content="메뉴 모으기 — 링크 열고 메뉴 고르기">
<meta property="og:description" content="방을 만들고 링크를 보내면, 다들 이름을 고르고 메뉴를 담아 보내요. 방장은 모인 주문을 가게별로 바로 봐요.">
<meta name="theme-color" content="#14b8ac">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 저녁에 뭐 먹을래? — 배달앱 같은 모바일 화면.
   흰 바탕 + 민트 한 가지 색, 사진이 주인공. 칸 사이는 그림자 대신 얇은 선과 회색 띠(8px)로 나눠요.
   제목 글꼴은 로고·딸깍에만 주아체, 나머지는 시스템 고딕. 아이콘은 선 아이콘. */
:root{
  --mint:#14b8ac;--mint-d:#0d958b;--mint-l:#e7f7f5;--mint-ll:#f2fbfa;
  --ink:#1f1f1f;--sub:#6f7377;--mute:#a1a5a9;--line:#eceeef;--band:#f4f5f6;--bg:#fff;--card:#fff;
  --red:#ef4444;--red-l:#fdeeee;--yellow:#ffcf3f;--yellow-l:#fff6d8;--blue:#2b7de1;--blue-l:#eaf3fd;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Apple SD Gothic Neo","Pretendard",system-ui,-apple-system,"Malgun Gothic","Noto Sans KR",sans-serif;
  --nav-h:62px;--top-h:56px;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px))}
#app.view-admin,#app.view-who,#app.view-pin{padding-bottom:40px}
#app.view-map{padding-bottom:0}
#app.enter>*:not(.nav):not(.cartbar):not(.share-bar){animation:enter .2s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
h2 small{font-size:.95rem;color:var(--mint-d);font-weight:800;margin-left:2px}
.muted{color:var(--sub);font-size:.86rem;line-height:1.5}
.eyebrow{font-size:.78rem;font-weight:700;color:var(--mint-d)}
.wrap{padding:0 16px}
.band{height:8px;background:var(--band);margin:20px 0}
.band.thin{margin:14px 0}

/* 위 막대 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--top-h);background:#fff;padding:0 60px 0 12px;display:flex;align-items:center;gap:6px}
.top h1{font-size:1.08rem;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{border:0;background:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink);padding:0;flex:0 0 38px}
.chip-who{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px 5px 6px;font-weight:700;font-size:.82rem;white-space:nowrap}
.chip-who i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--band);display:grid;place-items:center;font-size:.95rem}
.home-top .where{flex:1;min-width:0;border:0;background:none;display:flex;align-items:center;gap:4px;padding:6px 4px;text-align:left}
.home-top .where svg{width:20px;height:20px;color:var(--mint-d);flex:0 0 20px}
.home-top .where b{font-size:1.08rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-top .where .caret{font-size:.7rem;color:var(--sub)}

/* 아래 탭 */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:25;width:min(520px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-i{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--mute);border-radius:12px}
.nav-i i{font-style:normal;display:grid;place-items:center}
.nav-i span{font-size:.68rem;font-weight:700}
.nav-i.on{color:var(--ink)}
.nav-i.on svg{stroke-width:2.3}
.nav-badge{position:absolute;top:0;left:calc(50% + 5px);background:var(--mint);color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:.66rem;display:grid;place-items:center;padding:0 5px;border:2px solid #fff;font-weight:800}
.nav-dot{position:absolute;top:3px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.nav-dot.done{background:var(--mint)}
.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{30%{transform:scale(1.4)}}

/* 공통 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.notice{background:var(--yellow-l);border-radius:12px;padding:11px 13px;font-size:.88rem;margin:12px 0;line-height:1.5}
.notice.red{background:var(--red-l)}
.notice.mint{background:var(--mint-ll);color:#0b6f68}
.input{width:100%;border:1px solid #dfe2e4;border-radius:12px;padding:12px 13px;background:#fff}
.input:focus{outline:none;border-color:var(--mint);box-shadow:0 0 0 3px var(--mint-l)}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:800;background:var(--mint);color:#fff;white-space:nowrap;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--mint-d);box-shadow:inset 0 0 0 1px var(--mint)}
.btn.gray{background:var(--band);color:var(--ink)}
.btn.red{background:var(--red)}
.btn.line-dark{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #d6dadc}
.btn.block{width:100%;padding:16px;font-size:1.02rem}
.btn:disabled{opacity:.45}
.small-btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:.8rem;font-weight:700;text-decoration:none;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--band);color:var(--sub)}
.chip.mint{background:var(--mint-l);color:var(--mint-d)}
.chip.warn{background:var(--yellow-l);color:#866000}
.chip.deliv{background:var(--blue-l);color:var(--blue)}
.tag{display:inline-block;font-size:.68rem;font-weight:800;border-radius:5px;padding:1px 5px;margin-right:3px;background:var(--mint-l);color:var(--mint-d)}
.tag.hot{background:#feecec;color:#d23b3b}.tag.kid{background:var(--yellow-l);color:#8a6100}
.footer-link{display:block;margin:28px auto 8px;background:none;border:0;color:var(--mute);font-size:.8rem;text-decoration:underline}
.btn:focus-visible,.small-btn:focus-visible,.nav-i:focus-visible,.store:focus-visible,.ddal:focus-visible,.seg button:focus-visible,.zone-tabs button:focus-visible,.cat:focus-visible,.pop-card:focus-visible,.menu-main:focus-visible,.sorts button:focus-visible,.who-btn:focus-visible,.tabs-line button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}

/* 가게 그림(썸네일): 사진이 오면 사진, 아니면 대표 음식 + 메뉴 음식 두 개 */
.thumb{position:relative;flex:0 0 auto;width:88px;height:88px;border-radius:12px;overflow:hidden;background:radial-gradient(120% 100% at 25% 15%,rgba(255,255,255,.7),rgba(255,255,255,0) 55%),var(--c,#eef2f3)}
.thumb::before{content:"";position:absolute;left:50%;top:54%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.55)}
.thumb .t-main{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:2.5rem;filter:drop-shadow(0 3px 3px rgba(0,0,0,.12))}
.thumb .t-side{position:absolute;font-size:1.1rem}
.thumb .t0{right:8%;top:8%;transform:rotate(14deg)}
.thumb .t1{left:8%;bottom:8%;transform:rotate(-12deg)}
.thumb.sm{width:44px;height:44px;border-radius:10px}.thumb.sm .t-main{font-size:1.5rem}.thumb.sm .t-side{display:none}
.thumb.md{width:64px;height:64px;border-radius:12px}.thumb.md .t-main{font-size:2rem}.thumb.md .t-side{display:none}
.thumb.lg{width:100%;height:240px;border-radius:0}.thumb.lg .t-main{font-size:5rem}.thumb.lg .t-side{font-size:2.2rem}.thumb.lg::before{width:150px}
.thumb.lg .t0{right:24%;top:16%}.thumb.lg .t1{left:24%;bottom:22%}
.thumb,.m-emo,.pop-emo,.sheet-emo{position:relative;overflow:hidden}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.ph.on{opacity:1}

/* 누가 주문? */
.who-hero{background:var(--mint);color:#fff;padding:34px 22px 28px;margin-bottom:8px}
.who-badge{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 11px;font-size:.78rem;font-weight:700}
.who-hero h1{font-family:var(--display);font-weight:400;margin:14px 0 8px;font-size:2.6rem;line-height:1.1}
.who-hero p{margin:0 0 16px;opacity:.92;font-weight:600}
.view-who h2{margin:22px 0 12px}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.who-btn{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px 11px;font-weight:700;font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .12s,transform .1s}
.who-btn i{font-style:normal;font-size:1.8rem}
.who-btn:hover{border-color:var(--mint)}
.who-btn:active{transform:scale(.97)}

/* 마감 시계 */
.countdown{display:inline-flex;gap:4px;align-items:center;background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums}
.countdown b{color:var(--mint-d)}
.countdown.soon b{color:#c26a00}
.countdown.late{background:var(--red-l);color:#c22}

/* 홈 */
.zone-tabs{display:flex;align-items:flex-end;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);position:relative}
.zone-tabs button{border:0;background:none;padding:10px 0 11px;font-weight:700;font-size:.98rem;color:var(--mute);position:relative;display:flex;gap:4px;align-items:baseline}
.zone-tabs button small{font-size:.75rem;font-weight:700;color:var(--mute)}
.zone-tabs button.on{color:var(--ink)}
.zone-tabs button.on small{color:var(--mint-d)}
.zone-tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.seg button{border:0;background:none;border-radius:999px;padding:7px 12px;font-weight:700;font-size:.84rem;color:var(--sub);display:flex;gap:4px;align-items:baseline;white-space:nowrap}
.seg button small{font-size:.72rem;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}
.seg button.on small{color:#9ee6df}
.zone-note{margin-left:auto;padding-bottom:12px;font-size:.76rem;color:var(--sub);font-weight:600;white-space:nowrap}
.slot-card{margin:16px 16px 0;background:var(--mint);border-radius:20px;padding:16px 16px 16px;color:#fff;position:relative;overflow:hidden}
.slot-card::after{content:"";position:absolute;right:-36px;top:-46px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.slot-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;font-weight:700;opacity:.95;position:relative}
.slot-head .countdown{background:rgba(255,255,255,.18);color:#fff;font-size:.74rem;padding:4px 9px}
.slot-head .countdown b{color:#fff}
.slot-card h2{font-family:var(--display);font-weight:400;font-size:1.75rem;margin:6px 0 12px;letter-spacing:0;position:relative}
.reel{position:relative;min-height:92px;border-radius:14px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 14px;overflow:hidden}
.reel.has{justify-content:flex-start}
.reel .r-emo{font-size:2.6rem;line-height:1}
.reel .r-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.reel .r-name{font-size:1.2rem;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reel .r-sub{font-size:.78rem;font-weight:600;color:var(--sub)}
.reel .r-sub i{font-style:normal;margin:0 4px;color:var(--mute)}
.reel .r-sub.hit{color:var(--mint-d);font-weight:800}
.reel.spin .r-emo,.reel.spin .r-text{animation:roll .12s linear}
@keyframes roll{from{transform:translateY(-70%);opacity:.15}to{transform:none;opacity:1}}
.reel.hit{animation:hit .5s ease-out}
@keyframes hit{0%{box-shadow:0 0 0 0 rgba(255,255,255,.9)}100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
.pick-acts{display:flex;gap:8px;margin-top:8px;animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:none;opacity:1}}
.btn.line{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);padding:11px 14px}
.btn.line.grow{flex:1;background:#173f3c;box-shadow:none;text-align:center;justify-content:center}
.ddal{display:flex;align-items:baseline;justify-content:center;gap:8px;width:100%;margin-top:12px;border:0;border-radius:14px;background:#fff;color:var(--mint-d);padding:14px 12px;transition:transform .08s}
.ddal span{font-family:var(--display);font-size:1.75rem;line-height:1}
.ddal small{font-size:.8rem;font-weight:700;color:var(--sub)}
.ddal:active{transform:scale(.98)}
.ddal:disabled{opacity:.6}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.browse-note{background:var(--band);border-radius:12px;padding:12px 14px;margin:14px 0 0;font-size:.84rem;line-height:1.5;color:var(--sub)}
.browse-note b{color:var(--ink)}
.sent-note{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;border:0;background:var(--mint-ll);color:var(--mint-d);border-radius:12px;padding:13px 15px;margin:14px 0 0;font-weight:700;text-align:left}
.cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:18px -16px 0;padding:0 12px;scroll-padding:0 12px}
.cats::-webkit-scrollbar,.rail::-webkit-scrollbar,.sorts::-webkit-scrollbar{display:none}
.cat{flex:0 0 64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:.76rem;color:#444;padding:0}
.cat i{font-style:normal;width:52px;height:52px;border-radius:18px;background:var(--band);display:grid;place-items:center;font-size:1.65rem;transition:transform .12s,background .12s}
.cat.on{color:var(--mint-d);font-weight:800}
.cat.on i{background:var(--mint-l)}
.cat:active i{transform:scale(.93)}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 4px}
.sec-sub{margin:0 0 6px;font-size:.82rem;color:var(--sub)}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 16px 2px;margin:0 -16px;scroll-padding:0 16px;scrollbar-width:none}
.pop-card{flex:0 0 120px;scroll-snap-align:start;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.pop-emo{width:120px;height:120px;border-radius:14px;display:grid;place-items:center;font-size:2.6rem;margin-bottom:7px;background:radial-gradient(100% 90% at 25% 15%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),var(--c)}
.pop-card b{font-size:.88rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-card span{font-size:.74rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-card em{font-style:normal;font-weight:800;font-size:.88rem;font-variant-numeric:tabular-nums;margin-top:2px}
.sorts{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:2px 0 -4px}
.sorts button{flex:0 0 auto;border:0;background:none;padding:6px 2px;font-weight:600;font-size:.8rem;color:var(--mute)}
.sorts button.on{color:var(--ink);font-weight:800}
.sorts button.on::before{content:"✓ ";color:var(--mint-d)}

/* 가게 줄 */
.stores{display:flex;flex-direction:column}
.store{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;position:relative}
.store:last-child{border-bottom:0}
.store:active{background:var(--mint-ll)}
.store .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px;padding-top:2px}
.store .nm{display:flex;align-items:center;gap:6px;min-width:0}
.store .nm b{font-size:1.02rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{flex:0 0 auto;font-size:.66rem;font-weight:800;border-radius:4px;padding:1px 5px;background:var(--band);color:var(--sub)}
.mini.deliv{background:var(--blue-l);color:var(--blue)}
.store .meta,.meta{font-size:.8rem;color:var(--sub);font-weight:500}
.meta i{font-style:normal;margin:0 5px;color:#ccd0d3}
.store .menu-line{font-size:.8rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store .from{display:flex;gap:8px;align-items:baseline;font-size:.8rem;color:var(--mute)}
.store .from b{font-size:.86rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.store.look .nm b{color:#4a4d50}
.store.look .thumb{filter:saturate(.8)}
.badge{position:absolute;top:14px;right:0;background:var(--mint);color:#fff;border-radius:999px;font-size:.7rem;font-weight:800;padding:2px 8px}

/* 가게 화면 */
.view-store .top{position:absolute;left:0;right:0;max-width:520px;margin:0 auto;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.view-store .top h1{opacity:0}
.view-store .top .back{background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.view-store .top .chip-who{display:none}
.shop-hero{position:relative}
.shop-card{position:relative;margin:-28px 0 0;background:#fff;border-radius:22px 22px 0 0;padding:22px 16px 6px;text-align:center}
.shop-kind{font-size:.78rem;color:var(--sub);font-weight:600}
.shop-card h2{margin:4px 0 4px;font-size:1.45rem;font-weight:800}
.shop-rev{font-size:.84rem;color:var(--sub)}
.shop-rev b{color:var(--ink)}
.tagline{margin:8px auto 0;font-size:.86rem;color:var(--sub);max-width:30em}
.shop-acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));margin:16px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.shop-acts button,.shop-acts a{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;font-size:.74rem;font-weight:700;color:#444;text-decoration:none}
.shop-acts svg{width:22px;height:22px}
.shop-acts>*+*{border-left:1px solid var(--line)}
.facts{margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.fact{display:flex;gap:12px;font-size:.86rem;line-height:1.45}
.fact dt{flex:0 0 40px;color:var(--mute);font-weight:600}
.fact dd{margin:0;color:#333}
.tabs-line{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs-line button{flex:0 0 auto;border:0;background:none;padding:12px 0;font-weight:700;color:var(--mute);position:relative}
.tabs-line button.on{color:var(--ink)}
.tabs-line button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.menus{padding:0 16px}
.menu{position:relative;border-bottom:1px solid var(--line)}
.menu:last-child{border-bottom:0}
.menu-main{display:flex;gap:14px;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:16px 0}
.menu .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.menu .tags:empty{display:none}
.menu .name{font-weight:800;font-size:1rem;line-height:1.35}
.menu .desc{font-size:.8rem;color:var(--sub);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.menu .price{font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums;margin-top:2px}
.menu .price.unknown{color:#8a6100;font-weight:700;font-size:.86rem}
.menu.in .name::after{content:" · 담음";color:var(--mint-d);font-size:.8rem}
.m-emo{flex:0 0 96px;height:96px;border-radius:12px;display:grid;place-items:center;font-size:2.4rem;background:radial-gradient(100% 90% at 25% 15%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),var(--c)}
.m-ctl{position:absolute;right:6px;bottom:22px}
.qty{display:flex;align-items:center;border-radius:999px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px #d6dadc}
.qty button{border:0;background:none;width:32px;height:32px;font-size:1.1rem;font-weight:800;color:var(--ink)}
.qty b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums;font-size:.9rem}
.qty.big button{width:44px;height:44px;font-size:1.3rem}.qty.big b{min-width:30px;font-size:1.05rem}
.m-ctl .qty{box-shadow:0 1px 6px rgba(0,0,0,.16)}
.add{width:32px;height:32px;border:0;border-radius:50%;background:#fff;color:var(--ink);font-size:1.3rem;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 1px 6px rgba(0,0,0,.2)}
.shop-info h3{font-size:1rem;font-weight:800;margin:0 0 6px}
.shop-info p{margin:4px 0;font-size:.82rem;color:var(--sub);line-height:1.5}
.shop-info .src{color:var(--mute);font-size:.74rem;word-break:break-all}

/* 메뉴 시트 */
.sheet-bg{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:min(520px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;animation:up .24s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40%)}}
.sheet-x{position:absolute;right:12px;top:12px;z-index:3;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.92);font-weight:900;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.sheet-emo{height:230px;display:grid;place-items:center;font-size:4.6rem;background:radial-gradient(100% 90% at 25% 15%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),var(--c)}
.sheet-body{padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:4px 0 6px;font-size:1.35rem}
.sheet .muted{margin:0 0 4px}
.sheet-store{font-size:.8rem;color:var(--mute);font-weight:600}
.sheet-price{font-size:1.3rem;font-weight:800;margin:10px 0 14px;font-variant-numeric:tabular-nums}
.sheet-qty{display:flex;justify-content:space-between;align-items:center;padding:12px 0 16px;border-top:1px solid var(--line);font-weight:700}

/* 장바구니 */
.who-line{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:.95rem}
.who-line i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--band);display:grid;place-items:center}
.cart-store .cs-head{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.cart-store .cs-head>div:not(.thumb){flex:1;min-width:0}
.cart-store .nm{font-weight:700}
.stores+.more{display:block;width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;margin:6px 0 0;font-weight:700;font-size:.9rem;color:var(--ink)}
.cart-store .more{border:0;background:none;color:var(--mint-d);font-weight:700;font-size:.86rem;padding:10px 0 0}
.h3{display:block;font-weight:800;margin-bottom:8px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.quick button{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.8rem;font-weight:600;background:#fff;color:#444}
.quick button.on{border-color:var(--mint);background:var(--mint-ll);color:var(--mint-d);font-weight:800}
.summary .line{border-bottom:0;padding:4px 0}
.line{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.line:last-child{border-bottom:0}
.line b{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px));width:min(488px,calc(100% - 24px));z-index:24;background:var(--mint);color:#fff;border:0;border-radius:14px;padding:15px 18px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:1rem;box-shadow:0 6px 18px rgba(20,184,172,.35)}
.cartbar .n{background:#fff;color:var(--mint-d);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:.82rem}
.cartbar .sp{flex:1;text-align:left}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem;padding-top:12px;margin-top:8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:80px 24px}
.empty .big{font-size:3.6rem;opacity:.85}
.empty h2{margin:12px 0 6px}
.empty .btn{margin-top:14px}

/* 주문서 */
.view-done .wrap{padding-top:8px}
.steps{list-style:none;display:flex;gap:6px;padding:0;margin:8px 0 16px}
.steps li{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.74rem;font-weight:700;color:var(--mute);text-align:center}
.steps i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--band);color:var(--sub);font-size:.8rem}
.steps li.on{color:var(--mint-d)}.steps li.on i{background:var(--mint);color:#fff}
.ticket{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px}
.t-head{display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:12px;border-bottom:1px dashed #d8dcde;margin-bottom:8px}
.t-head span{font-size:.78rem;font-weight:700;color:var(--mint-d)}
.t-head b{font-size:1.3rem;font-weight:800}
.t-head small{color:var(--mute);font-weight:600}
.t-store{font-weight:800;margin:12px 0 4px;font-size:.9rem}
.t-line{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:.9rem;font-variant-numeric:tabular-nums;color:#333}
.t-req{margin-top:10px;background:var(--band);border-radius:10px;padding:8px 10px;font-size:.86rem}
.t-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px solid var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.t-total b{font-size:1.25rem}
.t-code{margin-top:16px;padding-top:12px;border-top:1px dashed #d8dcde;height:56px;overflow:hidden}
.t-code small{display:block;color:var(--mute);font-weight:600;font-size:.72rem;margin-bottom:3px}
.t-code code{display:block;font-size:.64rem;color:var(--sub);word-break:break-all;line-height:1.3}
.raw{margin-top:14px}
.raw summary{cursor:pointer;color:var(--sub);font-weight:700;font-size:.86rem;padding:6px 0}
.receipt{background:var(--band);border-radius:12px;padding:14px;white-space:pre-wrap;font-size:.86rem;line-height:1.55;word-break:break-all}
.code-box{width:100%;min-height:150px;font-size:.85rem}

/* 지도 */
.mapwrap{position:relative;display:flex;flex-direction:column;height:calc(100vh - var(--top-h) - var(--nav-h) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:420px}
.map{position:relative;flex:1;min-height:240px;background:#e8eef0}
.map-top{position:absolute;top:10px;left:12px;right:12px;z-index:500}
.map-btn{position:absolute;left:12px;z-index:500;width:44px;height:44px;border-radius:14px;border:0;background:var(--card);box-shadow:0 2px 10px rgba(20,40,45,.18);font-size:1.25rem}
.mapwrap .leaflet-top{top:62px}
.mapwrap .leaflet-bottom{bottom:14px}
.map-sheet{flex:0 0 auto;background:#fff;border-radius:18px 18px 0 0;padding:14px 16px 12px;box-shadow:0 -2px 14px rgba(0,0,0,.1);position:relative;z-index:501;margin-top:-14px}
.map-sheet .row{align-items:flex-start}
.map-sheet .name{font-size:1.1rem;font-weight:800;line-height:1.3}
.map-fallback{flex:1;overflow:auto;padding:66px 12px 24px}
.mpin{display:grid;place-items:center}
.mpin span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid var(--mint);font-size:1.15rem;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.mpin.rough span{border-style:dashed}
.mpin.sel span{width:46px;height:46px;background:var(--yellow);border-color:var(--mint-d);font-size:1.5rem}
.mpin.off{opacity:.35}
.mpin em{position:absolute;top:50px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-weight:800;font-size:.8rem;background:var(--ink);color:#fff;border-radius:8px;padding:3px 8px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.mpin.cluster span{background:var(--mint);color:#fff;border-color:#fff;font-weight:900;font-size:1rem;box-shadow:0 0 0 5px rgba(16,179,166,.25),0 3px 8px rgba(0,0,0,.25)}
.mpin.cluster b::before{content:"🍽 ";font-size:.8rem}
.mpin.camp span{width:44px;height:44px;background:var(--mint);border-color:#fff;font-size:1.35rem}
.leaflet-container{font-family:var(--body)}
.locator{position:fixed;inset:0;z-index:60;background:rgba(20,30,35,.55);display:grid;place-items:center;padding:12px}
.locator .box{background:var(--card);border-radius:20px;width:min(520px,100%);max-height:100%;overflow:auto;padding:14px}
.locator .lmap{position:relative;height:min(52vh,420px);border-radius:14px;overflow:hidden;margin:10px 0;background:#e8eef0}
.locator .lmap .cross{position:absolute;left:50%;top:50%;z-index:500;transform:translate(-50%,-100%);font-size:2.2rem;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}

/* 약도(지도를 못 불러올 때) */
.sketch{background:var(--card);border-radius:var(--r);padding:10px}
.sketch svg{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;font-family:var(--body)}
.sketch .ring{fill:none;stroke:#cfe9e6;stroke-width:1.5;stroke-dasharray:4 4}
.sketch .ring.cur{fill:rgba(18,181,170,.07);stroke:var(--mint);stroke-dasharray:none}
.sketch .ring-label{fill:var(--sub);font-size:11px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3px}
.sketch .north{fill:var(--sub);font-size:11px;font-weight:800;text-anchor:end}
.sketch .area-label{fill:var(--ink);font-size:12px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:4px}
.sketch .camp circle{fill:var(--mint)}
.sketch .camp text{text-anchor:middle;font-size:15px}
.sketch .camp .camp-label{fill:var(--mint-d);font-size:12px;font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:4px}
.sketch .pin{cursor:pointer}
.sketch .pin circle{fill:#fff;stroke:var(--mint);stroke-width:2}
.sketch .pin text{text-anchor:middle;font-size:13px}
.sketch .pin.sel circle{fill:var(--yellow);stroke:var(--mint-d);stroke-width:3}
.sketch .pin.off{opacity:.28;cursor:default}

/* 담당자 */
.admin-tabs{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px));background:#fff;z-index:4}
.admin-tabs button small{font-size:.72rem;color:var(--mint-d);font-weight:800}
.admin{padding-top:18px;padding-bottom:120px}
.ap-intro h2{margin-bottom:4px}
.search{margin:14px 0 0;padding:11px 14px;background:var(--band);border-color:transparent}
.filter-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 4px;padding:0 16px}
.filter-chips::-webkit-scrollbar{display:none}
.filter-chips button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:700;font-size:.84rem;color:var(--sub)}
.filter-chips button small{color:var(--mute);font-weight:700}
.filter-chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.filter-chips button.on small{color:#9ee6df}
.prow{padding:14px 0;border-bottom:1px solid var(--line)}
.prow-main{display:flex;gap:12px;align-items:center}
.prow-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow-txt b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow-txt .menu-line{font-size:.78rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow:not(.on) .thumb{opacity:.75}
.switch{position:relative;flex:0 0 auto;width:52px;height:32px;cursor:pointer}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:#d9dde0;transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+i{background:var(--mint)}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:3px solid var(--mint);outline-offset:2px}
.prow-acts{display:flex;gap:6px;margin:10px 0 0 76px;flex-wrap:wrap}
.prow-acts button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:.78rem;font-weight:700;color:var(--ink)}
.add-store{display:block;width:100%;margin:16px 0 0;padding:14px;border:1px dashed #cfd4d7;border-radius:12px;background:none;font-weight:700;color:var(--sub)}
.share-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);z-index:25;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.sb-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.sb-txt b{font-size:1rem;font-weight:800}
.sb-txt span{font-size:.78rem;color:var(--sub)}
.share-bar.todo .sb-txt span{color:#d1490f;font-weight:700}
.share-bar .btn{padding:13px 20px}
.share-bar .btn:disabled{background:#cfd4d7}
.link-box{margin-top:16px}
.empty-line{text-align:center;padding:28px 0}
.a-sec{margin:0 -16px 20px;padding:0 16px 20px;border-bottom:8px solid var(--band)}
.a-sec:last-child{border-bottom:0;margin-bottom:0}
.a-sec h3{font-size:1.02rem;font-weight:800;margin:0 0 4px}
.a-sec h3 small{color:var(--mint-d);font-weight:800;font-size:.9rem}
.a-sec .code-box{margin:8px 0 10px;min-height:110px}
.a-sec .notice{margin:10px 0}
.a-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.a-head h3{margin:0}
.text-btn{border:0;background:none;color:var(--mint-d);font-weight:700;font-size:.86rem;padding:8px 0}
.text-btn.red{color:#c22a31}
.prog{display:flex;gap:16px;align-items:center}
.prog-num{font-size:1rem;color:var(--sub);font-weight:700;font-variant-numeric:tabular-nums}
.prog-num b{font-size:2.4rem;color:var(--ink);font-weight:800;letter-spacing:-.03em}
.prog-txt{flex:1;display:flex;flex-direction:column;gap:2px}
.prog-txt span{font-size:.82rem;color:var(--sub)}
.bar{height:8px;background:var(--band);border-radius:999px;overflow:hidden;margin:6px 0 0}
.bar i{display:block;height:100%;background:var(--mint);border-radius:999px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border-radius:999px;padding:5px 11px;font-size:.84rem;font-weight:700;background:var(--band)}
.pill.ok{background:var(--mint-l);color:var(--mint-d)}
.pill.no{background:#fff;color:var(--sub);box-shadow:inset 0 0 0 1px var(--line)}
.seg.wide{display:flex;width:100%;box-shadow:none;background:var(--band);margin-bottom:14px;border-radius:12px}
.seg.wide button{flex:1;justify-content:center;padding:11px 6px;border-radius:10px}
.seg.wide button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.sum-head{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.sum-head>div:not(.thumb){flex:1;min-width:0;display:flex;flex-direction:column}
.sum-head>div:not(.thumb) b{font-weight:800}
.sum-head>div:not(.thumb) span{font-size:.8rem;color:var(--sub)}
.sum-won{font-size:1.05rem;font-variant-numeric:tabular-nums}
.who-ava{font-style:normal;width:40px;height:40px;border-radius:50%;background:var(--band);display:grid;place-items:center;font-size:1.3rem;flex:0 0 40px}
.sum-card .row{margin-top:12px}
.sum-card>.muted{margin:8px 0 0}
.req-line{background:var(--band);border-radius:10px;padding:9px 11px;font-size:.86rem;margin:10px 0 0}
.toggle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;margin:0 0 12px}
.toggle input{width:20px;height:20px;accent-color:var(--mint)}
.field{display:block;font-size:.82rem;font-weight:700;color:var(--sub);margin-top:10px}
.field .input{margin-top:4px;padding:10px 11px}
.edit-box{background:var(--band);border-radius:12px;padding:12px;margin:12px 0 0}
.edit-box .field:first-child{margin-top:0}
.edit-row{display:grid;grid-template-columns:1fr 96px 38px;gap:6px;margin-top:6px}
.edit-row .input{padding:9px;min-width:0}
.x-btn{border:0;background:#fff;border-radius:10px;color:var(--sub);font-weight:800}
.more-fields{margin-top:6px;border-top:1px solid #e3e6e8;padding-top:4px}
.more-fields summary{cursor:pointer;font-weight:700;font-size:.86rem;color:var(--sub);padding:8px 0}
.big-num{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.info{font-size:.82rem;color:var(--sub);margin-top:4px;line-height:1.45}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%) translateY(-20px);opacity:0;transition:.25s;background:rgba(22,35,42,.95);color:#fff;padding:12px 18px;border-radius:999px;font-weight:800;font-size:.92rem;z-index:90;box-shadow:0 8px 20px rgba(0,0,0,.2);pointer-events:none;width:max-content;max-width:min(92vw,420px);text-align:center;word-break:keep-all}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.top,.tabs-line,.share-bar,.nav,.no-print,#toast,.cartbar{display:none!important}#app{padding:0;max-width:none}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}}

.mpin.look span{width:30px;height:30px;font-size:.95rem;border-color:#c4cdd0;opacity:.85;box-shadow:0 1px 4px rgba(0,0,0,.16)}
.mpin.cluster.look span{background:#a3adb1;box-shadow:0 0 0 4px rgba(163,173,177,.25),0 2px 6px rgba(0,0,0,.2)}
/* 메뉴 모으기(방) — style.css 위에 덧붙여요 */
.mm .top h1:empty{display:none}
.nav.n5{grid-template-columns:repeat(5,1fr)}
.nav-badge.soft{background:var(--band);color:var(--sub)}
.bottom-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:26;width:min(520px,100%);background:#fff;border-top:1px solid var(--line);display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.06)}

.hint{font-size:.8rem;color:var(--mute);font-weight:500}
.field .hint{margin-left:4px}
.hint-box{background:var(--band);border-radius:12px;padding:14px;font-size:.86rem;color:var(--sub);line-height:1.5;margin:6px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.two .btn{padding:13px 8px;font-size:.9rem;white-space:normal}
.copy-box{margin-top:10px}
.sec-title{font-size:1.1rem;margin:22px 0 10px}
.sec-title small{color:var(--mint-d);font-weight:800;font-size:.9rem}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--band);border-top-color:var(--mint);margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 첫 화면 */
.land{background:var(--mint);color:#fff;padding:calc(34px + env(safe-area-inset-top,0px)) 22px 26px}
.land-badge{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.8rem}
.land h1{font-family:var(--display);font-weight:400;font-size:2.5rem;line-height:1.12;margin:16px 0 12px;letter-spacing:-.01em}
.land p{margin:0 0 20px;line-height:1.55;opacity:.92;font-size:.95rem}
.land-go{background:#fff;color:var(--mint-d);font-size:1.1rem}
.land-camp{display:flex;flex-direction:column;gap:2px;width:100%;margin-top:10px;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:12px;padding:12px 14px;text-align:left}
.land-camp b{font-weight:800}
.land-camp span{font-size:.8rem;opacity:.85}
.how{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:14px}
.how li{display:flex;gap:12px;align-items:flex-start}
.how i{font-style:normal;flex:0 0 28px;height:28px;border-radius:50%;background:var(--mint-l);color:var(--mint-d);font-weight:800;display:grid;place-items:center;font-size:.86rem}
.how b{display:block;font-weight:800}
.how span{font-size:.84rem;color:var(--sub);line-height:1.45}
.room-list{display:flex;flex-direction:column}
.room-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.rr-ic{width:40px;height:40px;border-radius:12px;background:var(--band);display:grid;place-items:center;font-size:1.2rem}
.rr-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.rr-txt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr-txt small{color:var(--sub);font-size:.78rem}
.rr-go{color:var(--mute);font-size:1.3rem}

/* 방 만들기 */
.form{padding-top:6px;padding-bottom:110px}
.f-sec{padding:18px 0 20px;border-bottom:8px solid var(--band);margin:0 -16px;padding-left:16px;padding-right:16px}
.f-sec:last-child{border-bottom:0}
.f-sec h2{display:flex;align-items:center;gap:8px;font-size:1.08rem;margin:0 0 4px}
.f-sec h2 i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:.78rem;display:grid;place-items:center}
.f-sec h2 small{color:var(--mint-d);font-weight:800;font-size:.9rem}
.f-sec .seg.wide{margin:10px 0 6px}
.pick-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pr-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.pr-txt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.pr-txt span{font-size:.78rem;color:var(--sub)}
.pick-row .x-btn{width:34px;height:34px;background:var(--band)}
.custom-box{background:var(--band);border-radius:14px;padding:4px 14px 14px;margin-top:12px}
.custom-box .btn{margin-top:12px;background:#fff}
.name-tools{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.toggle{margin-top:12px}

/* 방 머리 */
.room-head{padding:6px 16px 16px}
.room-head.big{padding:10px 18px 22px}
.room-head h1{font-size:1.45rem;font-weight:800;letter-spacing:-.03em;margin:4px 0 6px;line-height:1.25}
.room-head.big h1{font-size:1.75rem}
.host-badge{display:inline-block;font-size:.74rem;font-weight:800;color:#8a6100;background:var(--yellow-l);border-radius:999px;padding:4px 10px}
.rh-note{margin:0 0 10px;color:var(--sub);font-size:.9rem;line-height:1.5;white-space:pre-line}
.rh-meta{display:flex;flex-wrap:wrap;gap:6px}
.rh-chip{background:var(--band);border-radius:999px;padding:6px 11px;font-size:.8rem;font-weight:700;color:#444}
.rh-chip b{color:var(--mint-d)}
.rh-chip.warn{background:var(--yellow-l);color:#8a6100}
.rh-chip.red{background:var(--red-l);color:#c22a31}
.who-btn{position:relative}
.who-btn small{font-size:.68rem;color:var(--mint-d);font-weight:800}
.who-btn.did{background:var(--mint-ll);border-color:transparent}
.who-btn.me{border-color:var(--mint);box-shadow:inset 0 0 0 1px var(--mint)}
.name-in{margin-top:10px}
.name-in .input{flex:1}

/* 가게 화면(사진 없는 가게) */
.shop-hero.nopic .shop-card{margin:0;padding-top:10px}
.menu.plain .menu-main{min-height:0}

/* 보냈어요 */
.sent-ok{text-align:center;padding:26px 10px 18px}
.so-ic{width:58px;height:58px;border-radius:50%;background:var(--mint);color:#fff;font-size:1.8rem;font-weight:800;display:grid;place-items:center;margin:0 auto 12px;animation:pop .35s ease-out}
.sent-ok h2{margin:0 0 6px}
.sent-ok .muted{margin:0}
.sheet-gap{height:44px}

/* 방장: 링크 카드 */
.share-card{border:1.5px solid var(--mint);border-radius:16px;padding:16px;margin-bottom:20px;background:var(--mint-ll)}
.sc-top{display:flex;gap:12px;align-items:center}
.sc-ic{width:40px;height:40px;border-radius:12px;background:var(--mint);color:#fff;display:grid;place-items:center;flex:0 0 40px}
.sc-top b{display:block;font-weight:800}
.sc-top span{font-size:.8rem;color:var(--sub)}
.sc-link{margin:12px 0 10px;background:#fff;border-radius:10px;padding:10px 12px;font-size:.82rem;color:var(--sub);word-break:break-all;font-family:ui-monospace,Menlo,monospace}
.state-row{display:flex;align-items:center;gap:12px;margin-top:8px}
.state-row>div{flex:1;display:flex;flex-direction:column}
.state-row b{font-weight:800}
.state-row span{font-size:.8rem;color:var(--sub)}
.state-row .btn{padding:12px 18px}
.store-edit{border-bottom:1px solid var(--line)}
.store-edit summary{list-style:none;cursor:pointer}
.store-edit summary::-webkit-details-marker{display:none}
.store-edit .pick-row{border-bottom:0}
.se-open{font-size:.8rem;font-weight:700;color:var(--mint-d);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.store-edit[open] .se-open{background:var(--ink);color:#fff;border-color:var(--ink)}
.store-edit .edit-box{margin:0 0 12px}
.save-bar .btn.gray{flex:0 0 auto;padding:14px 18px}
@media print{.bottom-bar,.share-card{display:none!important}}
.notice.other-dev{background:var(--yellow-l);margin:16px 0 14px}
label.prow{display:block;cursor:pointer}
.prow .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

</head>

<script type="module">
// 메뉴 모으기 — 누구나 방을 만들고 링크를 보내면, 링크를 연 사람이 이름을 밝히고 방장이 정한 가게 안에서 메뉴를 골라요.

const FB_CONFIG = {

};
// 테스트용: 127.0.0.1 에서 ?emu 를 붙이면 로컬 에뮬레이터에 붙어요.
const EMU = location.hostname === '127.0.0.1' && new URLSearchParams(location.search).has('emu');

const won = n => Number(n || 0).toLocaleString('ko-KR') + '원';

const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const clone = v => JSON.parse(JSON.stringify(v));
const rand = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join(''); };
const str = (v, max, d = '') => (typeof v === 'string' ? v.slice(0, max) : d);
const num = v => (Number.isFinite(Number(v)) ? Math.max(0, Math.round(Number(v))) : 0);

// ---------- 가게 모양 다듬기 (방 문서는 아무나 만들 수 있으니 읽을 때 늘 다듬어요) ----------
const safeImg = u => (/^https:\/\/[^\s"'<>]+$/.test(u || '') ? u : '');
const safeColor = c => (/^#[0-9a-fA-F]{3,8}$/.test(c || '') ? c : '#eef2f3');
function tidyStore(s, i = 0) {
  s = s && typeof s === 'object' ? s : {};
  const id = str(s.id, 40) || `s${i}`;
  return {
    id, name: str(s.name, 40, '가게'), emoji: str(s.emoji, 8, '🍴'), color: safeColor(s.color), category: str(s.category, 12),
    area: str(s.area, 16), minutes: num(s.minutes), phone: str(s.phone, 20), address: str(s.address, 80), photo: safeImg(str(s.photo, 400)),
    reviews: num(s.reviews), hours: str(s.hours, 80), naver: safeImg(str(s.naver, 200)), note: str(s.note, 80),

      tags: Array.isArray(m.tags) ? m.tags.filter(t => ['best', 'kid', 'hot'].includes(t)) : [], img: safeImg(str(m.img, 400)),
    })),
  };
}

function fromCatalog(s) { return tidyStore({...s, desc: undefined}); }
function tidyRoom(d) {

    freeJoin: d.freeJoin !== false, closed: d.closed === true, owner: str(d.owner, 128),

}

}

// ---------- 상태 ----------
const S = {
  route: 'home', roomId: '', room: null, answers: new Map(), host: false, loading: false, error: '',
  tab: 'menu', store: null, mfilter: 'all',

function rememberRoom(id, patch) {
  const list = myRooms().filter(r => r.id !== id), old = myRooms().find(r => r.id === id) || {};

  save('mm-rooms', list.slice(0, 30));
}
const roomLocal = () => load('mm-room-' + S.roomId, {});
function persistRoom() { save('mm-room-' + S.roomId, {who: S.who, cart: S.cart, req: S.req, sentAt: S.sentAt}); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');

}

// ---------- Firebase ----------
let FB = null, DB = null, UID = '';
let booting = null;
function boot() {
  return booting ??= (async () => {
    const fb = await import('./firebase.js');
    const app = fb.initializeApp(FB_CONFIG);
    const auth = fb.getAuth(app);
    let db;
    try { db = fb.initializeFirestore(app, {localCache: fb.persistentLocalCache({tabManager: fb.persistentMultipleTabManager()})}); }
    catch { db = fb.initializeFirestore(app, {}); }
    if (EMU) { fb.connectAuthEmulator(auth, 'http://127.0.0.1:9099', {disableWarnings: true}); fb.connectFirestoreEmulator(db, '127.0.0.1', 8080); }
    let user = await new Promise(res => { const stop = fb.onAuthStateChanged(auth, u => { stop(); res(u); }); });
    if (!user) user = (await fb.signInAnonymously(auth)).user;
    FB = fb; DB = db; UID = user.uid;
  })().catch(e => { booting = null; throw e; });
}
function friendly(e) {
  const c = String(e && (e.code || e.message) || e);
  if (/permission/.test(c)) return '권한이 없어요. (방이 마감됐거나, 다른 기기에서 같은 이름으로 낸 주문이에요)';
  if (/unavailable|network|offline/i.test(c)) return '인터넷 연결을 확인해 주세요.';
  if (/operation-not-allowed|admin-restricted/.test(c)) return 'Firebase 익명 로그인이 꺼져 있어요.';
  return '잠깐 문제가 생겼어요. 다시 해 주세요.';
}
let unsub = [];

  Object.assign(S, {who: local.who || '', cart: local.cart || {}, req: local.req || '', sentAt: local.sentAt || 0, tab: local.who ? 'menu' : 'who'});
  render();
  try {
    await boot();
    const hostRef = FB.doc(DB, 'dinnerRooms', id, 'hosts', UID);
    let isHost = false;
    try { isHost = (await FB.getDoc(hostRef)).exists(); } catch {}
    const mine = myRooms().find(r => r.id === id);
    key = key || (mine && mine.key) || '';
    if (!isHost && key) {
      try { await FB.setDoc(hostRef, {key, at: FB.serverTimestamp()}); isHost = true; } catch {}
    }
    S.host = isHost;

    let first = true;
    unsub.push(FB.onSnapshot(FB.doc(DB, 'dinnerRooms', id), snap => {
      if (S.roomId !== id) return;
      if (!snap.exists()) { S.room = null; S.loading = false; S.error = 'gone'; render(); return; }
      S.room = tidyRoom(snap.data()); S.loading = false;
      rememberRoom(id, S.host ? {title: S.room.title, host: true} : {title: S.room.title});
      if (first && S.host && !S.who) S.tab = 'sum';
      first = false;
      reindex(); keepView();
    }, e => { S.loading = false; S.error = friendly(e); render(); }));
    unsub.push(FB.onSnapshot(FB.collection(DB, 'dinnerRooms', id, 'answers'), snap => {
      if (S.roomId !== id) return;

function cartIsSent() {
  const a = myAnswer();

  const now = Object.fromEntries(cartLines().map(l => [l.item.id, l.n]));

}

function deadlineInfo(dl) {
  if (!dl) return null;
  const t = new Date(dl).getTime();
  if (!Number.isFinite(t)) return null;
  const left = Math.round((t - Date.now()) / 60000);
  const at = new Date(t).toLocaleString('ko-KR', {month: 'numeric', day: 'numeric', weekday: 'short', hour: 'numeric', minute: '2-digit'});
  return {left, at, text: left <= 0 ? '마감 시간이 지났어요' : left >= 1440 ? `마감 ${at}` : left >= 60 ? `마감까지 ${Math.floor(left / 60)}시간 ${left % 60}분` : `마감까지 ${left}분`};
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.append(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); ta.remove();
    if (ok) return true;
  } catch {}
  return false;
}
async function copyOrShow(text, okMsg, boxId) {

}

function totals() {
  const groups = new Map();
  for (const a of S.answers.values()) {
    for (const it of a.items) {
      if (!groups.has(it.s)) groups.set(it.s, {store: storeOf(it.s) || {id: it.s, name: '(지운 가게)', phone: '', emoji: '🍴', color: '#eef2f3', menu: []}, items: new Map(), who: new Map(), sum: 0});
      const g = groups.get(it.s);
      const k = it.m, row = g.items.get(k) || {name: it.name, n: 0, price: it.price};
      row.n += it.n; g.items.set(k, row); g.sum += it.price * it.n;
      if (!g.who.has(a.name)) g.who.set(a.name, {ls: [], r: a.req});
      g.who.get(a.name).ls.push(`${it.name} ${it.n}`);
    }
  }
  const order = (S.room?.stores || []).map(s => s.id);
  return [...groups.values()].sort((x, y) => order.indexOf(x.store.id) - order.indexOf(y.store.id));
}

function byStoreHtml(host) {
  const groups = totals();
  if (!groups.length) return '<p class="muted empty-line">아직 받은 주문이 없어요.</p>';
  const total = groups.reduce((a, g) => a + g.sum, 0);
  return `${host ? `<label class="toggle no-print"><input type="checkbox" data-act="by-person" ${S.byPerson ? 'checked' : ''}> 주문 메시지에 사람별로 나눠 적기</label>` : ''}
  <div class="stack">${groups.map((g, i) => `<section class="card sum-card"><div class="sum-head">${thumb(g.store, 'sm')}<div><b>${esc(g.store.name)}</b>${g.store.phone ? `<span>${esc(g.store.phone)}</span>` : ''}</div><b class="sum-won">${won(g.sum)}</b></div>
    ${[...g.items.values()].map(it => `<div class="line"><span>${esc(it.name)}</span><b>${it.n}개</b></div>`).join('')}
    <p class="muted">${g.who.size}명: ${[...g.who.keys()].map(esc).join(', ')}</p>
    ${host ? `<div class="row no-print">${g.store.phone ? `<button class="btn gray" data-act="copy" data-text="${esc(g.store.phone)}" data-msg="📞 번호를 복사했어요">번호 복사</button>` : ''}<button class="btn" style="flex:1" data-act="copy-owner" data-i="${i}">주문 메시지 복사</button></div>
    <div id="ownerBox${i}" hidden class="copy-box"><textarea class="input code-box" readonly></textarea></div>` : ''}</section>`).join('')}
  <div class="card"><div class="total" style="margin:0;padding:0;border:0"><span>전체 합계</span><span>${won(total)}</span></div></div></div>`;
}
function byPersonHtml(host) {
  const order = S.room.names;
  const list = [...S.answers.values()].sort((a, b) => ((order.indexOf(a.name) + 1 || 999) - (order.indexOf(b.name) + 1 || 999)) || a.at - b.at);
  if (!list.length) return '<p class="muted empty-line">아직 받은 주문이 없어요.</p>';
  return `<div class="stack">${list.map(a => `<section class="card sum-card"><div class="sum-head"><i class="who-ava">${avatar(a.name)}</i><div><b>${esc(a.name)}</b><span>${new Date(a.at).toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit'})}</span></div><b class="sum-won">${won(a.items.reduce((x, i) => x + i.price * i.n, 0))}</b></div>
    ${a.items.map(i => `<div class="line"><span>${esc(i.name)} <small class="muted">${esc(storeOf(i.s)?.name || '')}</small></span><b>${i.n}개</b></div>`).join('')}
    ${a.req ? `<p class="req-line">💬 ${esc(a.req)}</p>` : ''}
    ${host ? `<button class="text-btn red no-print" data-act="answer-del-host" data-id="${esc(a.id)}">이 주문 지우기</button>` : ''}</section>`).join('')}</div>`;
}
function sumSeg() {
  return `<div class="seg wide no-print" role="group"><button class="${S.sumBy === 'store' ? 'on' : ''}" data-act="sum-by" data-by="store">가게별</button><button class="${S.sumBy === 'person' ? 'on' : ''}" data-act="sum-by" data-by="person">사람별</button></div>`;
}
function roomSum() {
  if (!S.host) { S.tab = 'all'; return roomAll(); }
  return `${topBar('모인 주문', '', whoChip())}
  <div class="wrap admin">${S.created ? '<div class="notice mint"><b>방을 만들었어요!</b> 아래 링크를 단톡방에 보내면 끝이에요. 모인 주문은 이 화면에 바로 나와요.</div>' : ''}
    ${shareCard()}${progressBlock(true)}
    ${sumSeg()}${S.sumBy === 'store' ? byStoreHtml(true) : byPersonHtml(true)}
    <button class="btn gray block no-print" style="margin-top:14px" data-act="print">인쇄하기</button>
    ${S.who ? '' : '<button class="btn line-dark block no-print" style="margin-top:10px" data-act="tab" data-t="who">나도 주문하기</button>'}
  </div>${roomNav()}`;
}
function roomAll() {
  return `${topBar('모두의 주문', '', whoChip())}<div class="wrap admin">${progressBlock(false)}${sumSeg()}${S.sumBy === 'store' ? byStoreHtml(false) : byPersonHtml(false)}</div>${roomNav()}`;
}

// ---------- 방 설정 (방장) ----------
function roomSet() {
  if (!S.host) { S.tab = 'menu'; return roomMenu(); }
  const e = S.edit || (S.edit = {...clone(S.room), namesText: S.room.names.join('\n'), dirty: false});
  return `${topBar('방 설정', '', whoChip())}
  <div class="wrap admin form">
    <section class="a-sec"><h3>주문 받기</h3>
      <div class="state-row"><div><b>${S.room.closed ? '마감했어요' : '주문 받는 중'}</b><span>${S.room.closed ? '다시 열면 고르고 고칠 수 있어요.' : '마감하면 더 내거나 고칠 수 없어요(방장은 돼요).'}</span></div><button class="btn ${S.room.closed ? '' : 'red'}" data-act="toggle-close">${S.room.closed ? '다시 열기' : '마감하기'}</button></div></section>
    <section class="a-sec"><h3>방 정보</h3>
      <label class="field">방 이름<input class="input" data-e="title" maxlength="40" value="${esc(e.title)}"></label>
      <label class="field">안내<textarea class="input" data-e="note" rows="2" maxlength="300">${esc(e.note)}</textarea></label>
      <label class="field">마감<input class="input" type="datetime-local" data-e="deadline" value="${esc(e.deadline)}"></label></section>
    <section class="a-sec"><h3>누가 고르나요</h3>
      <label class="field">명단 <span class="hint">한 줄에 한 명 · 비우면 누구나</span><textarea class="input" data-e="namesText" rows="5">${esc(e.namesText)}</textarea></label>
      <label class="toggle"><input type="checkbox" data-e="freeJoin" ${e.freeJoin ? 'checked' : ''}> 명단에 없는 사람도 이름 적고 참여</label></section>
    <section class="a-sec"><h3>가게·메뉴 <small>${e.stores.length}</small></h3>
      <p class="hint">이미 받은 주문은 그대로예요(보낸 때의 이름·가격으로 남아요).</p>
      ${e.stores.map(s => `<details class="store-edit"><summary>${storeRow(s, '<span class="se-open">고치기</span>')}</summary>
        <div class="edit-box">${s.menu.map(m => `<div class="edit-row"><input class="input" data-em="${esc(m.id)}" data-f="name" value="${esc(m.name)}" maxlength="40" aria-label="메뉴 이름"><input class="input" data-em="${esc(m.id)}" data-f="price" type="number" min="0" step="100" inputmode="numeric" value="${m.price || ''}" placeholder="원" aria-label="가격"><button class="x-btn" data-act="edit-menu-del" data-id="${esc(m.id)}" aria-label="메뉴 지우기">✕</button></div>`).join('')}
        <button class="text-btn" data-act="edit-menu-add" data-id="${esc(s.id)}">＋ 메뉴 추가</button>
        ${e.stores.length > 1 ? `<button class="text-btn red" data-act="edit-store-del" data-id="${esc(s.id)}" style="margin-left:14px">이 가게 빼기</button>` : ''}</div></details>`).join('')}
      <div class="two" style="margin-top:12px">${CATALOG.stores.length ? `<button class="btn line-dark" data-act="catalog" data-for="room">목록에서 더 넣기</button>` : ''}<button class="btn line-dark" data-act="custom-open" data-for="e">메뉴 직접 적기</button></div>
      ${S.editCustomOpen ? customForm('e') : ''}</section>
    <section class="a-sec"><h3>다른 기기에서도 방장으로</h3><p class="hint">이 링크로 열면 그 기기도 방장 화면이 돼요. <b>방장끼리만</b> 나눠 주세요.</p>
      <button class="btn gray block" data-act="copy-host">방장 링크 복사</button><div id="hostBox" hidden class="copy-box"><textarea class="input code-box" readonly></textarea></div></section>
    <section class="a-sec"><h3>방 지우기</h3><p class="hint">방과 링크가 없어져요. 되돌릴 수 없어요.</p><button class="btn red block" data-act="room-del">방 지우기</button></section>
  </div>
  ${e.dirty ? `<div class="bottom-bar save-bar"><button class="btn gray" data-act="edit-cancel">되돌리기</button><button class="btn" style="flex:1" data-act="edit-save">${S.sending ? '저장 중…' : '바꾼 내용 저장'}</button></div>` : ''}
  ${e.dirty ? '' : roomNav()}`;
}

// ---------- 메뉴 시트 ----------
function openItem(id) {
  const it = ITEMS.get(id);
  if (!it) return;
  const s = it.store;
  let q = Math.max(1, S.cart[id] || 1);
  closeSheet();
  const bg = document.createElement('div');
  bg.className = 'sheet-bg'; bg.id = 'sheet';
  const pic = it.img || it.emoji;
  const draw = () => {
    bg.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(it.name)}"><button class="sheet-x" data-act="item-close" aria-label="닫기">✕</button>
      ${pic ? `<div class="sheet-emo" style="--c:${esc(s.color)}">${esc(it.emoji || s.emoji)}${photo(it.img)}</div>` : '<div class="sheet-gap"></div>'}
      <div class="sheet-body"><div class="tags">${tags(it)}</div><h2>${esc(it.name)}</h2>${it.desc ? `<p class="muted">${esc(it.desc)}</p>` : ''}
      <div class="sheet-store">${esc(s.name)}</div>
      <div class="sheet-price">${price(it.price)}</div>
      <div class="sheet-qty"><span>수량</span><div class="qty big"><button data-act="sq" data-d="-1" aria-label="하나 빼기">−</button><b>${q}</b><button data-act="sq" data-d="1" aria-label="하나 더">+</button></div></div>
      <button class="btn block" data-act="sheet-add" data-id="${esc(id)}">${it.price ? `${won(it.price * q)} ` : ''}${S.cart[id] ? `${q}개로 바꾸기` : `${q}개 담기`}</button></div></div>`;
  };
  bg.addEventListener('click', e => {
    if (e.target === bg) { closeSheet(); return; }
    const b = e.target.closest('[data-act="sq"]');
    if (b) { e.stopPropagation(); q = Math.max(1, Math.min(30, q + Number(b.dataset.d))); draw(); }
  });
  draw();
  document.body.append(bg);
  bg.querySelector('[data-act="sheet-add"]')?.focus();
}
function closeSheet() { document.getElementById('sheet')?.remove(); }
function bumpCart() {
  buzz(10);
  const b = document.getElementById('cartBadge') || document.querySelector('.cartbar .n');
  if (b && !reduceMotion()) { b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
}

// ---------- 쓰기 ----------
function roomDoc(d) {
  return {
    title: d.title.trim().slice(0, 40), note: (d.note || '').trim().slice(0, 300), deadline: (d.deadline || '').slice(0, 20),
    names: d.names, freeJoin: !!d.freeJoin, stores: d.stores.map(s => tidyStore(s)),
  };
}
async function createRoom() {
  const d = S.draft;
  if (!d.title.trim() || !d.stores.length || S.sending) return;
  S.sending = true; rerender();
  try {
    await boot();
    const id = rand(12), key = rand(32);
    const b = FB.writeBatch(DB);
    b.set(FB.doc(DB, 'dinnerRoomKeys', id), {key});
    b.set(FB.doc(DB, 'dinnerRooms', id, 'hosts', UID), {key, at: FB.serverTimestamp()});
    b.set(FB.doc(DB, 'dinnerRooms', id), {
      v: 1, owner: UID, ...roomDoc({...d, names: d.mode === 'list' ? parseNames(d.names) : [], freeJoin: d.mode === 'free' || d.freeJoin}),
      closed: false, createdAt: FB.serverTimestamp(), updatedAt: FB.serverTimestamp(),
    });
    await b.commit();
    rememberRoom(id, {key, host: true, title: d.title.trim()});
    S.sending = false; S.draft = null; S.created = true;
    location.hash = `r=${id}`; // hashchange 가 방을 열어요
  } catch (e) {
    S.sending = false; rerender();
    toast(/permission/.test(String(e && e.code)) ? '방을 만들 권한이 없어요. Firebase 규칙(rooms.rules)을 게시했는지 확인해 주세요.' : friendly(e));
  }
}
async function sendAnswer() {
  const lines = cartLines();
  if (!lines.length || S.sending) return;
  S.req = (document.getElementById('req')?.value ?? S.req).trim().slice(0, 200);
  S.sending = true; rerender();
  try {
    await FB.setDoc(FB.doc(DB, 'dinnerRooms', S.roomId, 'answers', answerId(S.who)), {
      name: S.who, req: S.req, uid: UID, at: FB.serverTimestamp(),
      items: lines.map(l => ({m: l.item.id, n: l.n, name: l.item.name, price: l.item.price, s: l.item.store.id})),
    });
    S.sending = false; S.sentAt = Date.now(); persistRoom();
    buzz([20, 40, 20]);
    go({tab: 'mine'});
  } catch (e) {
    S.sending = false; rerender();
    toast(/permission/.test(String(e && e.code)) ? (S.room.closed ? '방장이 주문을 마감했어요.' : `「${S.who}」 이름으로 다른 기기에서 이미 보냈어요. 그 기기에서 고치거나 방장에게 말해 주세요.`) : friendly(e));
  }
}
async function saveEdit() {
  const e = S.edit;
  if (!e || S.sending) return;
  if (!e.title.trim()) { toast('방 이름을 적어 주세요'); return; }
  if (!e.stores.length) { toast('가게가 하나는 있어야 해요'); return; }
  S.sending = true; rerender();
  try {
    await FB.updateDoc(FB.doc(DB, 'dinnerRooms', S.roomId), {...roomDoc({...e, names: parseNames(e.namesText)}), updatedAt: FB.serverTimestamp()});
    S.sending = false; S.edit = null; toast('저장했어요. 링크를 연 사람들 화면도 바로 바뀌어요');
    rerender();
  } catch (err) { S.sending = false; rerender(); toast(friendly(err)); }
}
async function hostUpdate(fields, msg) {
  try { await FB.updateDoc(FB.doc(DB, 'dinnerRooms', S.roomId), {...fields, updatedAt: FB.serverTimestamp()}); if (msg) toast(msg); }
  catch (e) { toast(friendly(e)); }
}
function confirmTwice(el, msg) {
  if (el.dataset.armed) return true;
  el.dataset.armed = '1'; const old = el.textContent; el.textContent = msg;
  setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = old; } }, 3000);
  return false;
}
function setWho(name) {
  name = String(name || '').trim().replace(/\s+/g, ' ').slice(0, 20);
  if (!name) { toast('이름을 적어 주세요'); return; }
  const r = S.room;
  if (r.names.length && !r.freeJoin && !r.names.includes(name)) { toast('명단에 있는 이름만 고를 수 있어요'); return; }
  if (name !== S.who) {
    S.who = name;
    const a = S.answers.get(answerId(name));
    S.cart = a ? Object.fromEntries(a.items.filter(i => ITEMS.has(i.m)).map(i => [i.m, i.n])) : {};
    S.req = a ? a.req : '';
  }
  persistRoom();
  rememberRoom(S.roomId, {title: r.title});
  go({tab: myAnswer() ? 'mine' : 'menu'});
}
function pickedFromCatalog() {
  const by = new Map(CATALOG.stores.map(s => [s.id, s]));
  return [...S.catPicked].map(id => by.get(id)).filter(Boolean).map(fromCatalog);
}

// ---------- 버튼 ----------
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'home': stopListening(); location.hash = ''; go({route: 'home'}); break;
    case 'new': case 'new-camp':
      S.draft = act === 'new-camp' ? campDraft() : S.draft || EMPTY_DRAFT();
      if (location.hash === '#new') go({route: 'create'}); else location.hash = 'new';
      break;
    case 'retry': openRoom(S.roomId); break;
    case 'mode': S.draft.mode = el.dataset.m; rerender(); break;
    case 'names-camp': S.draft.names = (CAMP.families || []).join('\n'); rerender(); break;
    case 'draft-del': S.draft.stores = S.draft.stores.filter(s => s.id !== id); rerender(); break;
    case 'custom-open':
      if (el.dataset.for === 'c') S.draft.customOpen = !S.draft.customOpen; else S.editCustomOpen = !S.editCustomOpen;
      rerender(); document.getElementById(`${el.dataset.for}-cname`)?.focus(); break;
    case 'custom-add': {
      const p = el.dataset.for, name = document.getElementById(`${p}-cname`).value.trim(), text = document.getElementById(`${p}-clines`).value;
      const sid = 'c' + rand(6), menu = parseMenu(text, sid);
      if (!name) { toast('가게 이름을 적어 주세요'); return; }
      if (!menu.length) { toast('메뉴를 한 줄에 하나씩 적어 주세요'); return; }
      const s = tidyStore({id: sid, name, emoji: /카페|커피|cafe|coffee|스타벅스|투썸|이디야|메가|빽다방|컴포즈/i.test(name) ? '☕' : '🍽️', color: '#eaf6f4', category: '', menu});
      if (p === 'c') { S.draft.stores.push(s); S.draft.custom = {name: '', lines: ''}; S.draft.customOpen = false; }
      else { S.edit.stores.push(s); S.editCustom = {name: '', lines: ''}; S.editCustomOpen = false; S.edit.dirty = true; }
      rerender(); toast(`${name} 메뉴 ${menu.length}개를 넣었어요`); break;
    }
    case 'catalog': {
      S.catFor = el.dataset.for;
      const have = (S.catFor === 'create' ? S.draft.stores : S.edit.stores).map(s => s.id);
      S.catPicked = new Set(have.filter(x => CATALOG.stores.some(s => s.id === x)));
      go({route: 'catalog'}); break;
    }
    case 'cat-area': S.catArea = el.dataset.a; rerender(); break;
    case 'cat-pick': {
      if (el.checked) S.catPicked.add(id); else S.catPicked.delete(id);
      el.closest('.prow').classList.toggle('on', el.checked);
      document.getElementById('catDone').textContent = `${S.catPicked.size}곳 넣기`; break;
    }
    case 'cat-back': case 'cat-done': {
      if (act === 'cat-done') {
        const target = S.catFor === 'create' ? S.draft : S.edit;
        const custom = target.stores.filter(s => !CATALOG.stores.some(c => c.id === s.id));
        const kept = target.stores.filter(s => S.catPicked.has(s.id)); // 이미 넣은 가게는 고친 그대로
        const added = pickedFromCatalog().filter(s => !kept.some(k => k.id === s.id));
        target.stores = [...kept, ...added, ...custom];
        if (S.catFor === 'room') S.edit.dirty = true;
      }
      go(S.catFor === 'create' ? {route: 'create'} : {route: 'room', tab: 'set'}); break;
    }
    case 'create': createRoom(); break;
    // 방 안
    case 'tab': {
      const t = el.dataset.t;
      if (S.tab === 'set' && S.edit?.dirty && t !== 'set') { toast('바꾼 내용을 저장하거나 되돌려 주세요'); return; }
      if (['menu', 'cart', 'mine'].includes(t) && !S.who) { go({tab: 'who'}); return; }
      go({tab: t, created: false}); break;
    }
    case 'who': setWho(el.dataset.who); break;
    case 'who-typed': setWho(document.getElementById('whoName').value); break;
    case 'store': go({tab: 'store', store: id, mfilter: 'all'}); break;
    case 'mfilter': S.mfilter = el.dataset.f; rerender(); break;
    case 'plus': case 'minus': {
      setQty(id, (S.cart[id] || 0) + (act === 'plus' ? 1 : -1)); rerender();
      if (act === 'plus') { bumpCart(); if (S.cart[id] === 1) toast(`🛒 ${ITEMS.get(id).name} 담았어요`); }
      break;
    }
    case 'item': openItem(id); break;
    case 'item-close': closeSheet(); break;
    case 'sheet-add': {
      const q = Number(document.querySelector('#sheet .sheet-qty b')?.textContent) || 1, had = S.cart[id] || 0;
      setQty(id, q); closeSheet(); rerender(); bumpCart();
      toast(had ? `🛒 ${ITEMS.get(id).name} ${q}개로 바꿨어요` : `🛒 ${ITEMS.get(id).name} ${q}개 담았어요`); break;
    }
    case 'quick-req': {
      S.req = (document.getElementById('req')?.value ?? S.req);
      const t = el.dataset.t, parts = S.req.split(/\s*,\s*/).filter(Boolean);
      S.req = (parts.includes(t) ? parts.filter(p => p !== t) : [...parts, t]).join(', ').slice(0, 200);
      persistRoom(); rerender(); break;
    }
    case 'send': sendAnswer(); break;
    case 'edit-mine': go({tab: 'cart'}); break;
    case 'answer-del': {
      if (!confirmTwice(el, '한 번 더 누르면 취소해요')) break;
      try { await FB.deleteDoc(FB.doc(DB, 'dinnerRooms', S.roomId, 'answers', answerId(S.who))); toast('보낸 주문을 취소했어요'); } catch (err) { toast(friendly(err)); }
      break;
    }
    case 'answer-del-host': {
      if (!confirmTwice(el, '한 번 더 누르면 지워요')) break;
      try { await FB.deleteDoc(FB.doc(DB, 'dinnerRooms', S.roomId, 'answers', id)); } catch (err) { toast(friendly(err)); }
      break;
    }
    case 'sum-by': S.sumBy = el.dataset.by; rerender(); break;
    case 'by-person': S.byPerson = el.checked; break;
    case 'copy': copyOrShow(el.dataset.text, el.dataset.msg || '복사했어요', ''); break;
    case 'copy-invite': copyOrShow(inviteText(), '🔗 복사했어요. 단톡방에 붙여넣어 보내 주세요', 'inviteBox'); break;
    case 'copy-remind': copyOrShow(document.getElementById('remindText').value, '📣 재촉 글을 복사했어요', 'remindBox'); break;
    case 'copy-owner': copyOrShow(ownerMessage(totals()[Number(el.dataset.i)]), '📋 주문 메시지를 복사했어요', 'ownerBox' + el.dataset.i); break;
    case 'copy-host': {
      const key = myRooms().find(r => r.id === S.roomId)?.key;
      if (!key) { toast('이 기기에는 방장 열쇠가 없어요. 방을 만든 기기에서 복사해 주세요'); return; }
      copyOrShow(`${roomLink()}&k=${key}`, '👑 방장 링크를 복사했어요. 방장끼리만 나눠 주세요', 'hostBox'); break;
    }
    case 'print': try { print(); } catch { toast('이 화면에서는 인쇄가 안 돼요'); } break;
    case 'toggle-close': hostUpdate({closed: !S.room.closed}, S.room.closed ? '다시 열었어요' : '주문을 마감했어요'); break;
    case 'edit-save': saveEdit(); break;
    case 'edit-cancel': S.edit = null; S.editCustomOpen = false; rerender(); break;
    case 'edit-menu-del': { for (const s of S.edit.stores) s.menu = s.menu.filter(m => m.id !== id); S.edit.dirty = true; rerender(); break; }
    case 'edit-menu-add': {
      const s = S.edit.stores.find(x => x.id === id);
      s.menu.push({id: `${s.id}-m${rand(4)}`, name: '새 메뉴', emoji: '', price: 0, desc: '', tags: [], img: ''});
      S.edit.dirty = true; rerender();
      const det = [...document.querySelectorAll('.store-edit')].find(d => d.querySelector(`[data-act="edit-menu-add"][data-id="${CSS.escape(id)}"]`));
      if (det) { det.open = true; det.querySelector('.edit-row:last-of-type input')?.select(); }
      break;
    }
    case 'edit-store-del': { S.edit.stores = S.edit.stores.filter(s => s.id !== id); S.edit.dirty = true; rerender(); break; }
    case 'room-del': {
      if (!confirmTwice(el, '정말요? 한 번 더 누르면 지워요')) break;
      try {
        await FB.deleteDoc(FB.doc(DB, 'dinnerRooms', S.roomId));
        save('mm-rooms', myRooms().filter(r => r.id !== S.roomId));
        stopListening(); location.hash = ''; toast('방을 지웠어요');
      } catch (err) { toast(friendly(err)); }
      break;
    }
  }
});
// 입력칸
document.addEventListener('input', e => {
  const t = e.target;
  if (S.route === 'create' && S.draft) {
    if (t.id === 'c-title') { S.draft.title = t.value; const b = document.querySelector('[data-act=create]'); const can = t.value.trim() && S.draft.stores.length; b.disabled = !can; b.textContent = can ? '방 만들고 링크 받기' : t.value.trim() ? '가게를 넣어 주세요' : '방 이름을 적어 주세요'; }
    if (t.id === 'c-note') S.draft.note = t.value;
    if (t.id === 'c-deadline') S.draft.deadline = t.value;
    if (t.id === 'c-names') { S.draft.names = t.value; const h = document.querySelector('.name-tools .hint'); if (h) h.textContent = `${parseNames(t.value).length}명`; }
    if (t.id === 'c-free') S.draft.freeJoin = t.checked;
    if (t.id === 'c-cname') S.draft.custom.name = t.value;
    if (t.id === 'c-clines') S.draft.custom.lines = t.value;
    return;
  }
  if (t.id === 'catSearch') { S.catQuery = t.value; document.getElementById('catList').innerHTML = catalogList(); return; }
  if (t.id === 'req') { S.req = t.value.slice(0, 200); persistRoom(); return; }
  if (t.id === 'e-cname' || t.id === 'e-clines') { S.editCustom = S.editCustom || {name: '', lines: ''}; S.editCustom[t.id === 'e-cname' ? 'name' : 'lines'] = t.value; return; }
  if (S.edit && t.dataset.e) { S.edit[t.dataset.e] = t.type === 'checkbox' ? t.checked : t.value; markDirtySoft(); return; }
  if (S.edit && t.dataset.em) {
    for (const s of S.edit.stores) for (const m of s.menu) if (m.id === t.dataset.em) m[t.dataset.f] = t.dataset.f === 'price' ? num(t.value) : t.value;
    markDirtySoft();
  }
});
// 글자를 적는 동안에는 다시 그리지 않고, 저장 막대만 띄워요.
function markDirtySoft() {
  if (S.edit.dirty) return;
  S.edit.dirty = true;
  document.querySelector('.nav')?.remove();
  $app.insertAdjacentHTML('beforeend', `<div class="bottom-bar save-bar"><button class="btn gray" data-act="edit-cancel">되돌리기</button><button class="btn" style="flex:1" data-act="edit-save">바꾼 내용 저장</button></div>`);
}
document.addEventListener('change', e => { if (e.target.dataset.e === 'freeJoin' && S.edit) { S.edit.freeJoin = e.target.checked; markDirtySoft(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('sheet')) { closeSheet(); return; }
  if (e.key === 'Enter' && e.target.id === 'whoName') document.querySelector('[data-act="who-typed"]')?.click();
});

// ---------- 주소 ----------
function route() {
  // 예전 「링크로 보내기」 판(#s=…)은 classic.html 로 보내요.
  if (/^#s=/.test(location.hash)) { location.replace('classic.html' + location.hash); return; }
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (location.hash === '#new') { S.draft = S.draft || EMPTY_DRAFT(); stopListening(); go({route: 'create'}); return; }
  const id = (h.get('r') || '').replace(/[^a-z0-9]/gi, '').slice(0, 40);
  if (id) {
    const key = (h.get('k') || '').replace(/[^a-z0-9]/gi, '').slice(0, 64);
    // 방장 열쇠는 주소창에서 바로 지워요(실수로 그대로 공유하지 않게). 이 기기에는 기억해요.
    if (key) { rememberRoom(id, {key}); history.replaceState(null, '', `#r=${id}`); }
    if (id !== S.roomId || S.route !== 'room') openRoom(id, key);
    return;
  }
  stopListening(); S.roomId = '';
  if (S.route !== 'catalog') go({route: 'home'});
}
addEventListener('hashchange', route);
route();
setInterval(() => { if (S.route === 'room' && S.room && S.room.deadline && !document.querySelector('input:focus,textarea:focus')) { const c = document.querySelector('.rh-meta'); if (c) rerender(); } }, 60000);
</script>
</body>
