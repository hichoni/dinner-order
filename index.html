<style>
/* 저녁에 뭐 먹을래? — 배달앱 같은 모바일 화면.
   흰 바탕 + 민트 한 가지 색, 사진이 주인공. 칸 사이는 그림자 대신 얇은 선과 회색 띠(8px)로 나눠요.
   제목 글꼴은 로고·딸깍에만 주아체, 나머지는 시스템 고딕. 아이콘은 선 아이콘. */
:root{
  --mint:#14b8ac;--mint-d:#0d958b;--mint-l:#e7f7f5;--mint-ll:#f2fbfa;
  --ink:#1f1f1f;--sub:#6f7377;--mute:#a1a5a9;--line:#eceeef;--band:#f4f5f6;--bg:#fff;--card:#fff;
  --red:#ef4444;--red-l:#fdeeee;--yellow:#ffcf3f;--yellow-l:#fff6d8;--blue:#2b7de1;--blue-l:#eaf3fd;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Apple SD Gothic Neo","Pretendard",system-ui,-apple-system,"Malgun Gothic","Noto Sans KR",sans-serif;
  --nav-h:62px;--top-h:56px;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px))}
#app.view-admin,#app.view-who,#app.view-pin{padding-bottom:40px}
#app.view-map{padding-bottom:0}
#app.enter>*:not(.nav):not(.cartbar):not(.share-bar){animation:enter .2s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
h2 small{font-size:.95rem;color:var(--mint-d);font-weight:800;margin-left:2px}
.muted{color:var(--sub);font-size:.86rem;line-height:1.5}
.eyebrow{font-size:.78rem;font-weight:700;color:var(--mint-d)}
.wrap{padding:0 16px}
.band{height:8px;background:var(--band);margin:20px 0}
.band.thin{margin:14px 0}

/* 위 막대 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--top-h);background:#fff;padding:0 60px 0 12px;display:flex;align-items:center;gap:6px}
.top h1{font-size:1.08rem;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{border:0;background:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink);padding:0;flex:0 0 38px}
.chip-who{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px 5px 6px;font-weight:700;font-size:.82rem;white-space:nowrap}
.chip-who i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--band);display:grid;place-items:center;font-size:.95rem}
.home-top .where{flex:1;min-width:0;border:0;background:none;display:flex;align-items:center;gap:4px;padding:6px 4px;text-align:left}
.home-top .where svg{width:20px;height:20px;color:var(--mint-d);flex:0 0 20px}
.home-top .where b{font-size:1.08rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-top .where .caret{font-size:.7rem;color:var(--sub)}

/* 아래 탭 */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:25;width:min(520px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-i{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--mute);border-radius:12px}
.nav-i i{font-style:normal;display:grid;place-items:center}
.nav-i span{font-size:.68rem;font-weight:700}
.nav-i.on{color:var(--ink)}
.nav-i.on svg{stroke-width:2.3}
.nav-badge{position:absolute;top:0;left:calc(50% + 5px);background:var(--mint);color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:.66rem;display:grid;place-items:center;padding:0 5px;border:2px solid #fff;font-weight:800}
.nav-dot{position:absolute;top:3px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.nav-dot.done{background:var(--mint)}
.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{30%{transform:scale(1.4)}}

/* 공통 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.notice{background:var(--yellow-l);border-radius:12px;padding:11px 13px;font-size:.88rem;margin:12px 0;line-height:1.5}
.notice.red{background:var(--red-l)}
.notice.mint{background:var(--mint-ll);color:#0b6f68}
.input{width:100%;border:1px solid #dfe2e4;border-radius:12px;padding:12px 13px;background:#fff}
.input:focus{outline:none;border-color:var(--mint);box-shadow:0 0 0 3px var(--mint-l)}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:800;background:var(--mint);color:#fff;white-space:nowrap;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--mint-d);box-shadow:inset 0 0 0 1px var(--mint)}
.btn.gray{background:var(--band);color:var(--ink)}
.btn.red{background:var(--red)}
.btn.line-dark{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #d6dadc}
.btn.block{width:100%;padding:16px;font-size:1.02rem}
.btn:disabled{opacity:.45}
.small-btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:.8rem;font-weight:700;text-decoration:none;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--band);color:var(--sub)}
.chip.mint{background:var(--mint-l);color:var(--mint-d)}
.chip.warn{background:var(--yellow-l);color:#866000}
.chip.deliv{background:var(--blue-l);color:var(--blue)}
.tag{display:inline-block;font-size:.68rem;font-weight:800;border-radius:5px;padding:1px 5px;margin-right:3px;background:var(--mint-l);color:var(--mint-d)}
.tag.hot{background:#feecec;color:#d23b3b}.tag.kid{background:var(--yellow-l);color:#8a6100}
.footer-link{display:block;margin:28px auto 8px;background:none;border:0;color:var(--mute);font-size:.8rem;text-decoration:underline}
.btn:focus-visible,.small-btn:focus-visible,.nav-i:focus-visible,.store:focus-visible,.ddal:focus-visible,.seg button:focus-visible,.zone-tabs button:focus-visible,.cat:focus-visible,.pop-card:focus-visible,.menu-main:focus-visible,.sorts button:focus-visible,.who-btn:focus-visible,.tabs-line button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}

/* 가게 그림(썸네일): 사진이 오면 사진, 아니면 대표 음식 + 메뉴 음식 두 개 */
.thumb{position:relative;flex:0 0 auto;width:88px;height:88px;border-radius:12px;overflow:hidden;background:radial-gradient(120% 100% at 25% 15%,rgba(255,255,255,.7),rgba(255,255,255,0) 55%),var(--c,#eef2f3)}
.thumb::before{content:"";position:absolute;left:50%;top:54%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.55)}
.thumb .t-main{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:2.5rem;filter:drop-shadow(0 3px 3px rgba(0,0,0,.12))}
.thumb .t-side{position:absolute;font-size:1.1rem}
.thumb .t0{right:8%;top:8%;transform:rotate(14deg)}
.thumb .t1{left:8%;bottom:8%;transform:rotate(-12deg)}
.thumb.sm{width:44px;height:44px;border-radius:10px}.thumb.sm .t-main{font-size:1.5rem}.thumb.sm .t-side{display:none}
.thumb.md{width:64px;height:64px;border-radius:12px}.thumb.md .t-main{font-size:2rem}.thumb.md .t-side{display:none}
.thumb.lg{width:100%;height:240px;border-radius:0}.thumb.lg .t-main{font-size:5rem}.thumb.lg .t-side{font-size:2.2rem}.thumb.lg::before{width:150px}
.thumb.lg .t0{right:24%;top:16%}.thumb.lg .t1{left:24%;bottom:22%}
.thumb,.m-emo,.pop-emo,.sheet-emo{position:relative;overflow:hidden}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.ph.on{opacity:1}

/* 누가 주문? */
.who-hero{background:var(--mint);color:#fff;padding:34px 22px 28px;margin-bottom:8px}
.who-badge{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 11px;font-size:.78rem;font-weight:700}
.who-hero h1{font-family:var(--display);font-weight:400;margin:14px 0 8px;font-size:2.6rem;line-height:1.1}
.who-hero p{margin:0 0 16px;opacity:.92;font-weight:600}
.view-who h2{margin:22px 0 12px}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.who-btn{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px 11px;font-weight:700;font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .12s,transform .1s}
.who-btn i{font-style:normal;font-size:1.8rem}
.who-btn:hover{border-color:var(--mint)}
.who-btn:active{transform:scale(.97)}

/* 마감 시계 */
.countdown{display:inline-flex;gap:4px;align-items:center;background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums}
.countdown b{color:var(--mint-d)}
.countdown.soon b{color:#c26a00}
.countdown.late{background:var(--red-l);color:#c22}

/* 홈 */
.zone-tabs{display:flex;align-items:flex-end;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);position:relative}
.zone-tabs button{border:0;background:none;padding:10px 0 11px;font-weight:700;font-size:.98rem;color:var(--mute);position:relative;display:flex;gap:4px;align-items:baseline}
.zone-tabs button small{font-size:.75rem;font-weight:700;color:var(--mute)}
.zone-tabs button.on{color:var(--ink)}
.zone-tabs button.on small{color:var(--mint-d)}
.zone-tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.seg button{border:0;background:none;border-radius:999px;padding:7px 12px;font-weight:700;font-size:.84rem;color:var(--sub);display:flex;gap:4px;align-items:baseline;white-space:nowrap}
.seg button small{font-size:.72rem;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}
.seg button.on small{color:#9ee6df}
.zone-note{margin-left:auto;padding-bottom:12px;font-size:.76rem;color:var(--sub);font-weight:600;white-space:nowrap}
.slot-card{margin:16px 16px 0;background:var(--mint);border-radius:20px;padding:16px 16px 16px;color:#fff;position:relative;overflow:hidden}
.slot-card::after{content:"";position:absolute;right:-36px;top:-46px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.slot-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;font-weight:700;opacity:.95;position:relative}
.slot-head .countdown{background:rgba(255,255,255,.18);color:#fff;font-size:.74rem;padding:4px 9px}
.slot-head .countdown b{color:#fff}
.slot-card h2{font-family:var(--display);font-weight:400;font-size:1.75rem;margin:6px 0 12px;letter-spacing:0;position:relative}
.reel{position:relative;min-height:92px;border-radius:14px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 14px;overflow:hidden}
.reel.has{justify-content:flex-start}
.reel .r-emo{font-size:2.6rem;line-height:1}
.reel .r-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.reel .r-name{font-size:1.2rem;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reel .r-sub{font-size:.78rem;font-weight:600;color:var(--sub)}
.reel .r-sub i{font-style:normal;margin:0 4px;color:var(--mute)}
.reel .r-sub.hit{color:var(--mint-d);font-weight:800}
.reel.spin .r-emo,.reel.spin .r-text{animation:roll .12s linear}
@keyframes roll{from{transform:translateY(-70%);opacity:.15}to{transform:none;opacity:1}}
.reel.hit{animation:hit .5s ease-out}
@keyframes hit{0%{box-shadow:0 0 0 0 rgba(255,255,255,.9)}100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
.pick-acts{display:flex;gap:8px;margin-top:8px;animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:none;opacity:1}}
.btn.line{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);padding:11px 14px}
.btn.line.grow{flex:1;background:#173f3c;box-shadow:none;text-align:center;justify-content:center}
.ddal{display:flex;align-items:baseline;justify-content:center;gap:8px;width:100%;margin-top:12px;border:0;border-radius:14px;background:#fff;color:var(--mint-d);padding:14px 12px;transition:transform .08s}
.ddal span{font-family:var(--display);font-size:1.75rem;line-height:1}
.ddal small{font-size:.8rem;font-weight:700;color:var(--sub)}
.ddal:active{transform:scale(.98)}
.ddal:disabled{opacity:.6}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.browse-note{background:var(--band);border-radius:12px;padding:12px 14px;margin:14px 0 0;font-size:.84rem;line-height:1.5;color:var(--sub)}
.browse-note b{color:var(--ink)}
.sent-note{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;border:0;background:var(--mint-ll);color:var(--mint-d);border-radius:12px;padding:13px 15px;margin:14px 0 0;font-weight:700;text-align:left}
.cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:18px -16px 0;padding:0 12px;scroll-padding:0 12px}
.cats::-webkit-scrollbar,.rail::-webkit-scrollbar,.sorts::-webkit-scrollbar{display:none}
.cat{flex:0 0 64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:.76rem;color:#444;padding:0}
.cat i{font-style:normal;width:52px;height:52px;border-radius:18px;background:var(--band);display:grid;place-items:center;font-size:1.65rem;transition:transform .12s,background .12s}
.cat.on{color:var(--mint-d);font-weight:800}
.cat.on i{background:var(--mint-l)}
.cat:active i{transform:scale(.93)}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 4px}
.sec-sub{margin:0 0 6px;font-size:.82rem;color:var(--sub)}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 16px 2px;margin:0 -16px;scroll-padding:0 16px;scrollbar-width:none}
.pop-card{flex:0 0 120px;scroll-snap-align:start;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.pop-emo{width:120px;height:120px;border-radius:14px;display:grid;place-items:center;font-size:2.6rem;margin-bottom:7px;background:radial-gradient(100% 90% at 25% 15%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),var(--c)}
.pop-card b{font-size:.88rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-card span{font-size:.74rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-card em{font-style:normal;font-weight:800;font-size:.88rem;font-variant-numeric:tabular-nums;margin-top:2px}
.sorts{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:2px 0 -4px}
.sorts button{flex:0 0 auto;border:0;background:none;padding:6px 2px;font-weight:600;font-size:.8rem;color:var(--mute)}
.sorts button.on{color:var(--ink);font-weight:800}
.sorts button.on::before{content:"✓ ";color:var(--mint-d)}

/* 가게 줄 */
.stores{display:flex;flex-direction:column}
.store{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;position:relative}
.store:last-child{border-bottom:0}
.store:active{background:var(--mint-ll)}
.store .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px;padding-top:2px}
.store .nm{display:flex;align-items:center;gap:6px;min-width:0}
.store .nm b{font-size:1.02rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{flex:0 0 auto;font-size:.66rem;font-weight:800;border-radius:4px;padding:1px 5px;background:var(--band);color:var(--sub)}
.mini.deliv{background:var(--blue-l);color:var(--blue)}
.store .meta,.meta{font-size:.8rem;color:var(--sub);font-weight:500}
.meta i{font-style:normal;margin:0 5px;color:#ccd0d3}
.store .menu-line{font-size:.8rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store .from{display:flex;gap:8px;align-items:baseline;font-size:.8rem;color:var(--mute)}
.store .from b{font-size:.86rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.store.look .nm b{color:#4a4d50}
.store.look .thumb{filter:saturate(.8)}
.badge{position:absolute;top:14px;right:0;background:var(--mint);color:#fff;border-radius:999px;font-size:.7rem;font-weight:800;padding:2px 8px}

/* 가게 화면 */
.view-store .top{position:absolute;left:0;right:0;max-width:520px;margin:0 auto;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.view-store .top h1{opacity:0}
.view-store .top .back{background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.view-store .top .chip-who{display:none}
.shop-hero{position:relative}
.shop-card{position:relative;margin:-28px 0 0;background:#fff;border-radius:22px 22px 0 0;padding:22px 16px 6px;text-align:center}
.shop-kind{font-size:.78rem;color:var(--sub);font-weight:600}
.shop-card h2{margin:4px 0 4px;font-size:1.45rem;font-weight:800}
.shop-rev{font-size:.84rem;color:var(--sub)}
.shop-rev b{color:var(--ink)}
.tagline{margin:8px auto 0;font-size:.86rem;color:var(--sub);max-width:30em}
.shop-acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));margin:16px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.shop-acts button,.shop-acts a{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;font-size:.74rem;font-weight:700;color:#444;text-decoration:none}
.shop-acts svg{width:22px;height:22px}
.shop-acts>*+*{border-left:1px solid var(--line)}
.facts{margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.fact{display:flex;gap:12px;font-size:.86rem;line-height:1.45}
.fact dt{flex:0 0 40px;color:var(--mute);font-weight:600}
.fact dd{margin:0;color:#333}
.tabs-line{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs-line button{flex:0 0 auto;border:0;background:none;padding:12px 0;font-weight:700;color:var(--mute);position:relative}
.tabs-line button.on{color:var(--ink)}
.tabs-line button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.menus{padding:0 16px}
.menu{position:relative;border-bottom:1px solid var(--line)}
.menu:last-child{border-bottom:0}
.menu-main{display:flex;gap:14px;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:16px 0}
.menu .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.menu .tags:empty{display:none}
.menu .name{font-weight:800;font-size:1rem;line-height:1.35}
.menu .desc{font-size:.8rem;color:var(--sub);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.menu .price{font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums;margin-top:2px}
.menu .price.unknown{color:#8a6100;font-weight:700;font-size:.86rem}
.menu.in .name::after{content:" · 담음";color:var(--mint-d);font-size:.8rem}
.m-emo{flex:0 0 96px;height:96px;border-radius:12px;display:grid;place-items:center;font-size:2.4rem;background:radial-gradient(100% 90% at 25% 15%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),var(--c)}
.m-ctl{position:absolute;right:6px;bottom:22px}
.qty{display:flex;align-items:center;border-radius:999px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px #d6dadc}
.qty button{border:0;background:none;width:32px;height:32px;font-size:1.1rem;font-weight:800;color:var(--ink)}
.qty b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums;font-size:.9rem}
.qty.big button{width:44px;height:44px;font-size:1.3rem}.qty.big b{min-width:30px;font-size:1.05rem}
.m-ctl .qty{box-shadow:0 1px 6px rgba(0,0,0,.16)}
.add{width:32px;height:32px;border:0;border-radius:50%;background:#fff;color:var(--ink);font-size:1.3rem;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 1px 6px rgba(0,0,0,.2)}
.shop-info h3{font-size:1rem;font-weight:800;margin:0 0 6px}
.shop-info p{margin:4px 0;font-size:.82rem;color:var(--sub);line-height:1.5}
.shop-info .src{color:var(--mute);font-size:.74rem;word-break:break-all}

/* 메뉴 시트 */
.sheet-bg{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:min(520px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;animation:up .24s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40%)}}
.sheet-x{position:absolute;right:12px;top:12px;z-index:3;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.92);font-weight:900;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.sheet-emo{height:230px;display:grid;place-items:center;font-size:4.6rem;background:radial-gradient(100% 90% at 25% 15%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),var(--c)}
.sheet-body{padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:4px 0 6px;font-size:1.35rem}
.sheet .muted{margin:0 0 4px}
.sheet-store{font-size:.8rem;color:var(--mute);font-weight:600}
.sheet-price{font-size:1.3rem;font-weight:800;margin:10px 0 14px;font-variant-numeric:tabular-nums}
.sheet-qty{display:flex;justify-content:space-between;align-items:center;padding:12px 0 16px;border-top:1px solid var(--line);font-weight:700}

/* 장바구니 */
.who-line{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:.95rem}
.who-line i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--band);display:grid;place-items:center}
.cart-store .cs-head{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.cart-store .cs-head>div:not(.thumb){flex:1;min-width:0}
.cart-store .nm{font-weight:700}
.stores+.more{display:block;width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;margin:6px 0 0;font-weight:700;font-size:.9rem;color:var(--ink)}
.cart-store .more{border:0;background:none;color:var(--mint-d);font-weight:700;font-size:.86rem;padding:10px 0 0}
.h3{display:block;font-weight:800;margin-bottom:8px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.quick button{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.8rem;font-weight:600;background:#fff;color:#444}
.quick button.on{border-color:var(--mint);background:var(--mint-ll);color:var(--mint-d);font-weight:800}
.summary .line{border-bottom:0;padding:4px 0}
.line{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.line:last-child{border-bottom:0}
.line b{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px));width:min(488px,calc(100% - 24px));z-index:24;background:var(--mint);color:#fff;border:0;border-radius:14px;padding:15px 18px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:1rem;box-shadow:0 6px 18px rgba(20,184,172,.35)}
.cartbar .n{background:#fff;color:var(--mint-d);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:.82rem}
.cartbar .sp{flex:1;text-align:left}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem;padding-top:12px;margin-top:8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:80px 24px}
.empty .big{font-size:3.6rem;opacity:.85}
.empty h2{margin:12px 0 6px}
.empty .btn{margin-top:14px}

/* 주문서 */
.view-done .wrap{padding-top:8px}
.steps{list-style:none;display:flex;gap:6px;padding:0;margin:8px 0 16px}
.steps li{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.74rem;font-weight:700;color:var(--mute);text-align:center}
.steps i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--band);color:var(--sub);font-size:.8rem}
.steps li.on{color:var(--mint-d)}.steps li.on i{background:var(--mint);color:#fff}
.ticket{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px}
.t-head{display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:12px;border-bottom:1px dashed #d8dcde;margin-bottom:8px}
.t-head span{font-size:.78rem;font-weight:700;color:var(--mint-d)}
.t-head b{font-size:1.3rem;font-weight:800}
.t-head small{color:var(--mute);font-weight:600}
.t-store{font-weight:800;margin:12px 0 4px;font-size:.9rem}
.t-line{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:.9rem;font-variant-numeric:tabular-nums;color:#333}
.t-req{margin-top:10px;background:var(--band);border-radius:10px;padding:8px 10px;font-size:.86rem}
.t-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px solid var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.t-total b{font-size:1.25rem}
.t-code{margin-top:16px;padding-top:12px;border-top:1px dashed #d8dcde;height:56px;overflow:hidden}
.t-code small{display:block;color:var(--mute);font-weight:600;font-size:.72rem;margin-bottom:3px}
.t-code code{display:block;font-size:.64rem;color:var(--sub);word-break:break-all;line-height:1.3}
.raw{margin-top:14px}
.raw summary{cursor:pointer;color:var(--sub);font-weight:700;font-size:.86rem;padding:6px 0}
.receipt{background:var(--band);border-radius:12px;padding:14px;white-space:pre-wrap;font-size:.86rem;line-height:1.55;word-break:break-all}
.code-box{width:100%;min-height:150px;font-size:.85rem}

/* 지도 */
.mapwrap{position:relative;display:flex;flex-direction:column;height:calc(100vh - var(--top-h) - var(--nav-h) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:420px}
.map{position:relative;flex:1;min-height:240px;background:#e8eef0}
.map-top{position:absolute;top:10px;left:12px;right:12px;z-index:500}
.map-btn{position:absolute;left:12px;z-index:500;width:44px;height:44px;border-radius:14px;border:0;background:var(--card);box-shadow:0 2px 10px rgba(20,40,45,.18);font-size:1.25rem}
.mapwrap .leaflet-top{top:62px}
.mapwrap .leaflet-bottom{bottom:14px}
.map-sheet{flex:0 0 auto;background:#fff;border-radius:18px 18px 0 0;padding:14px 16px 12px;box-shadow:0 -2px 14px rgba(0,0,0,.1);position:relative;z-index:501;margin-top:-14px}
.map-sheet .row{align-items:flex-start}
.map-sheet .name{font-size:1.1rem;font-weight:800;line-height:1.3}
.map-fallback{flex:1;overflow:auto;padding:66px 12px 24px}
.mpin{display:grid;place-items:center}
.mpin span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid var(--mint);font-size:1.15rem;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.mpin.rough span{border-style:dashed}
.mpin.sel span{width:46px;height:46px;background:var(--yellow);border-color:var(--mint-d);font-size:1.5rem}
.mpin.off{opacity:.35}
.mpin em{position:absolute;top:50px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-weight:800;font-size:.8rem;background:var(--ink);color:#fff;border-radius:8px;padding:3px 8px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.mpin.cluster span{background:var(--mint);color:#fff;border-color:#fff;font-weight:900;font-size:1rem;box-shadow:0 0 0 5px rgba(16,179,166,.25),0 3px 8px rgba(0,0,0,.25)}
.mpin.cluster b::before{content:"🍽 ";font-size:.8rem}
.mpin.camp span{width:44px;height:44px;background:var(--mint);border-color:#fff;font-size:1.35rem}
.leaflet-container{font-family:var(--body)}
.locator{position:fixed;inset:0;z-index:60;background:rgba(20,30,35,.55);display:grid;place-items:center;padding:12px}
.locator .box{background:var(--card);border-radius:20px;width:min(520px,100%);max-height:100%;overflow:auto;padding:14px}
.locator .lmap{position:relative;height:min(52vh,420px);border-radius:14px;overflow:hidden;margin:10px 0;background:#e8eef0}
.locator .lmap .cross{position:absolute;left:50%;top:50%;z-index:500;transform:translate(-50%,-100%);font-size:2.2rem;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}

/* 약도(지도를 못 불러올 때) */
.sketch{background:var(--card);border-radius:var(--r);padding:10px}
.sketch svg{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;font-family:var(--body)}
.sketch .ring{fill:none;stroke:#cfe9e6;stroke-width:1.5;stroke-dasharray:4 4}
.sketch .ring.cur{fill:rgba(18,181,170,.07);stroke:var(--mint);stroke-dasharray:none}
.sketch .ring-label{fill:var(--sub);font-size:11px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3px}
.sketch .north{fill:var(--sub);font-size:11px;font-weight:800;text-anchor:end}
.sketch .area-label{fill:var(--ink);font-size:12px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:4px}
.sketch .camp circle{fill:var(--mint)}
.sketch .camp text{text-anchor:middle;font-size:15px}
.sketch .camp .camp-label{fill:var(--mint-d);font-size:12px;font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:4px}
.sketch .pin{cursor:pointer}
.sketch .pin circle{fill:#fff;stroke:var(--mint);stroke-width:2}
.sketch .pin text{text-anchor:middle;font-size:13px}
.sketch .pin.sel circle{fill:var(--yellow);stroke:var(--mint-d);stroke-width:3}
.sketch .pin.off{opacity:.28;cursor:default}

/* 담당자 */
.admin-tabs{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px));background:#fff;z-index:4}
.admin-tabs button small{font-size:.72rem;color:var(--mint-d);font-weight:800}
.admin{padding-top:18px;padding-bottom:120px}
.ap-intro h2{margin-bottom:4px}
.search{margin:14px 0 0;padding:11px 14px;background:var(--band);border-color:transparent}
.filter-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 4px;padding:0 16px}
.filter-chips::-webkit-scrollbar{display:none}
.filter-chips button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:700;font-size:.84rem;color:var(--sub)}
.filter-chips button small{color:var(--mute);font-weight:700}
.filter-chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.filter-chips button.on small{color:#9ee6df}
.prow{padding:14px 0;border-bottom:1px solid var(--line)}
.prow-main{display:flex;gap:12px;align-items:center}
.prow-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow-txt b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow-txt .menu-line{font-size:.78rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow:not(.on) .thumb{opacity:.75}
.switch{position:relative;flex:0 0 auto;width:52px;height:32px;cursor:pointer}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:#d9dde0;transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+i{background:var(--mint)}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:3px solid var(--mint);outline-offset:2px}
.prow-acts{display:flex;gap:6px;margin:10px 0 0 76px;flex-wrap:wrap}
.prow-acts button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:.78rem;font-weight:700;color:var(--ink)}
.add-store{display:block;width:100%;margin:16px 0 0;padding:14px;border:1px dashed #cfd4d7;border-radius:12px;background:none;font-weight:700;color:var(--sub)}
.share-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);z-index:25;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.sb-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.sb-txt b{font-size:1rem;font-weight:800}
.sb-txt span{font-size:.78rem;color:var(--sub)}
.share-bar.todo .sb-txt span{color:#d1490f;font-weight:700}
.share-bar .btn{padding:13px 20px}
.share-bar .btn:disabled{background:#cfd4d7}
.link-box{margin-top:16px}
.empty-line{text-align:center;padding:28px 0}
.a-sec{margin:0 -16px 20px;padding:0 16px 20px;border-bottom:8px solid var(--band)}
.a-sec:last-child{border-bottom:0;margin-bottom:0}
.a-sec h3{font-size:1.02rem;font-weight:800;margin:0 0 4px}
.a-sec h3 small{color:var(--mint-d);font-weight:800;font-size:.9rem}
.a-sec .code-box{margin:8px 0 10px;min-height:110px}
.a-sec .notice{margin:10px 0}
.a-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.a-head h3{margin:0}
.text-btn{border:0;background:none;color:var(--mint-d);font-weight:700;font-size:.86rem;padding:8px 0}
.text-btn.red{color:#c22a31}
.prog{display:flex;gap:16px;align-items:center}
.prog-num{font-size:1rem;color:var(--sub);font-weight:700;font-variant-numeric:tabular-nums}
.prog-num b{font-size:2.4rem;color:var(--ink);font-weight:800;letter-spacing:-.03em}
.prog-txt{flex:1;display:flex;flex-direction:column;gap:2px}
.prog-txt span{font-size:.82rem;color:var(--sub)}
.bar{height:8px;background:var(--band);border-radius:999px;overflow:hidden;margin:6px 0 0}
.bar i{display:block;height:100%;background:var(--mint);border-radius:999px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border-radius:999px;padding:5px 11px;font-size:.84rem;font-weight:700;background:var(--band)}
.pill.ok{background:var(--mint-l);color:var(--mint-d)}
.pill.no{background:#fff;color:var(--sub);box-shadow:inset 0 0 0 1px var(--line)}
.seg.wide{display:flex;width:100%;box-shadow:none;background:var(--band);margin-bottom:14px;border-radius:12px}
.seg.wide button{flex:1;justify-content:center;padding:11px 6px;border-radius:10px}
.seg.wide button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.sum-head{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.sum-head>div:not(.thumb){flex:1;min-width:0;display:flex;flex-direction:column}
.sum-head>div:not(.thumb) b{font-weight:800}
.sum-head>div:not(.thumb) span{font-size:.8rem;color:var(--sub)}
.sum-won{font-size:1.05rem;font-variant-numeric:tabular-nums}
.who-ava{font-style:normal;width:40px;height:40px;border-radius:50%;background:var(--band);display:grid;place-items:center;font-size:1.3rem;flex:0 0 40px}
.sum-card .row{margin-top:12px}
.sum-card>.muted{margin:8px 0 0}
.req-line{background:var(--band);border-radius:10px;padding:9px 11px;font-size:.86rem;margin:10px 0 0}
.toggle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;margin:0 0 12px}
.toggle input{width:20px;height:20px;accent-color:var(--mint)}
.field{display:block;font-size:.82rem;font-weight:700;color:var(--sub);margin-top:10px}
.field .input{margin-top:4px;padding:10px 11px}
.edit-box{background:var(--band);border-radius:12px;padding:12px;margin:12px 0 0}
.edit-box .field:first-child{margin-top:0}
.edit-row{display:grid;grid-template-columns:1fr 96px 38px;gap:6px;margin-top:6px}
.edit-row .input{padding:9px;min-width:0}
.x-btn{border:0;background:#fff;border-radius:10px;color:var(--sub);font-weight:800}
.more-fields{margin-top:6px;border-top:1px solid #e3e6e8;padding-top:4px}
.more-fields summary{cursor:pointer;font-weight:700;font-size:.86rem;color:var(--sub);padding:8px 0}
.big-num{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.info{font-size:.82rem;color:var(--sub);margin-top:4px;line-height:1.45}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%) translateY(-20px);opacity:0;transition:.25s;background:rgba(22,35,42,.95);color:#fff;padding:12px 18px;border-radius:999px;font-weight:800;font-size:.92rem;z-index:90;box-shadow:0 8px 20px rgba(0,0,0,.2);pointer-events:none;width:max-content;max-width:min(92vw,420px);text-align:center;word-break:keep-all}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.top,.tabs-line,.share-bar,.nav,.no-print,#toast,.cartbar{display:none!important}#app{padding:0;max-width:none}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}}

.mpin.look span{width:30px;height:30px;font-size:.95rem;border-color:#c4cdd0;opacity:.85;box-shadow:0 1px 4px rgba(0,0,0,.16)}
.mpin.cluster.look span{background:#a3adb1;box-shadow:0 0 0 4px rgba(163,173,177,.25),0 2px 6px rgba(0,0,0,.2)}
.img-note{display:none;position:absolute;left:6px;bottom:6px;z-index:2;font-size:.6rem;font-weight:700;color:#fff;background:rgba(16,40,38,.55);border-radius:6px;padding:2px 5px;pointer-events:none}
.ph.on+.img-note{display:block}
.sheet-emo .img-note{left:12px;bottom:12px;font-size:.72rem;padding:3px 8px}
/* 메뉴 모으기(방) — style.css 위에 덧붙여요.
   클레이·글라스: 옅은 청록 바탕 + 뒤에 흐린 색 구름, 반투명 흰 카드(유리)에 부드러운 그림자, 손으로 빚은 듯 볼록한 버튼.
   색은 배민 느낌의 청록 하나에, 꾸밈으로만 살구·라벤더를 아주 옅게 써요. 글꼴은 프리텐다드. */
:root{
  --mint:#12b5a8;--mint-d:#0b958a;--mint-l:#dcf5f1;--mint-ll:#eefaf8;
  --ink:#15302d;--sub:#5d706d;--mute:#9aaba8;--line:rgba(13,90,84,.08);--band:#eaf2f1;--bg:#edf5f4;
  --glass:rgba(255,255,255,.68);--glass-hi:rgba(255,255,255,.86);--glass-b:rgba(255,255,255,.9);
  --clay:0 22px 40px -22px rgba(13,90,84,.32),0 6px 14px -8px rgba(13,90,84,.12),inset 0 1px 0 rgba(255,255,255,.95);
  --clay-s:0 10px 20px -12px rgba(13,90,84,.38),0 2px 4px -2px rgba(13,90,84,.08),inset 0 1px 0 rgba(255,255,255,.95);
  --press:inset 0 2px 6px rgba(13,90,84,.10),inset 0 -1px 0 rgba(255,255,255,.9);
  --grad:linear-gradient(180deg,#34d6c8 0%,#14b8ab 52%,#0ea397 100%);
  --grad-shadow:0 14px 24px -12px rgba(14,163,151,.75),inset 0 2px 0 rgba(255,255,255,.38),inset 0 -3px 0 rgba(0,0,0,.08);
  --body:"Pretendard Variable","Pretendard",-apple-system,"Apple SD Gothic Neo",system-ui,"Malgun Gothic","Noto Sans KR",sans-serif;
  --r:24px;
}
html,body{background:linear-gradient(170deg,#e6f6f3 0%,#f1f4f9 48%,#ecf6f3 100%) fixed;color:var(--ink)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(42vmax 42vmax at 108% -6%,rgba(20,184,171,.22),transparent 62%),
  radial-gradient(30vmax 30vmax at -12% 34%,rgba(255,170,140,.16),transparent 62%),
  radial-gradient(36vmax 36vmax at 92% 92%,rgba(150,160,255,.15),transparent 62%)}
body::before{background:transparent}
#app{background:transparent}
.mm{letter-spacing:-.02em;word-break:keep-all;overflow-wrap:anywhere}
.mm h1,.mm h2,.mm h3{letter-spacing:-.03em}

/* 유리 카드 */
.mm .stores,.mm .menus,.mm .room-list,.mm .plist,.mm .card,.mm .ticket,.mm .f-sec,.mm .a-sec,.mm .share-card,.mm .room-head,
.mm .cart-store,.mm .summary,.mm .cart-req,.mm .how li,.mm .land-camp,.mm .sent-ok,.mm .empty>.inner{
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  border:1px solid var(--glass-b);border-radius:var(--r);box-shadow:var(--clay)}
.mm .band{height:14px;background:none;margin:0}
.mm .band.thin{height:12px;margin:0}

/* 위 막대 · 아래 탭 (떠 있는 유리) */
.mm .top{background:rgba(237,246,245,.7);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.mm .top h1:empty{display:none}
.mm .top .back{background:rgba(255,255,255,.75);box-shadow:var(--clay-s)}
.mm .chip-who{background:rgba(255,255,255,.8);border:1px solid var(--glass-b);box-shadow:var(--clay-s)}
.mm .chip-who i{background:var(--mint-l)}
.mm .nav{bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(500px,calc(100% - 20px));border-radius:26px;padding:6px;
  background:rgba(255,255,255,.74);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--glass-b);box-shadow:0 22px 44px -18px rgba(13,90,84,.42),inset 0 1px 0 #fff}
.nav.n5{grid-template-columns:repeat(5,1fr)}
.mm .nav-i{border-radius:18px;padding:7px 0 6px;color:var(--mute)}
.mm .nav-i.on{background:linear-gradient(180deg,#e6faf6,#d3f2ed);color:var(--mint-d);box-shadow:inset 0 1px 0 #fff,0 6px 12px -8px rgba(13,90,84,.4)}
.mm .nav-badge{background:var(--grad);box-shadow:0 4px 8px -3px rgba(14,163,151,.6)}
.nav-badge.soft{background:#fff!important;color:var(--sub);box-shadow:var(--clay-s)!important}
.mm .cartbar{bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom,0px));background:var(--grad);border-radius:22px;box-shadow:0 18px 30px -14px rgba(14,163,151,.8),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.08)}
.bottom-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:26;width:min(500px,calc(100% - 20px));display:flex;gap:10px;padding:10px;border-radius:26px;
  background:rgba(255,255,255,.74);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--glass-b);box-shadow:0 22px 44px -18px rgba(13,90,84,.42),inset 0 1px 0 #fff}
#app.enter>.bottom-bar{animation:none}

/* 버튼 · 입력 */
.mm .btn{border-radius:18px;background:var(--grad);box-shadow:var(--grad-shadow);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.mm .btn svg{width:20px;height:20px;stroke-width:2.4}
.mm .btn.gray,.mm .btn.line-dark{background:linear-gradient(180deg,#fff,#f2f8f7);color:var(--ink);box-shadow:var(--clay-s),0 0 0 1px rgba(13,90,84,.05)}
.mm .btn.red{background:linear-gradient(180deg,#ff8a80,#f05252);box-shadow:0 14px 24px -12px rgba(240,82,82,.7),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.08)}
.mm .btn:disabled{background:#d3dfdd;box-shadow:none;opacity:1;color:#fff}
.mm .small-btn{background:linear-gradient(180deg,#fff,#f2f8f7);border:0;box-shadow:var(--clay-s),0 0 0 1px rgba(13,90,84,.05)}
.mm .text-btn{color:var(--mint-d)}
.mm .x-btn{width:34px;height:34px;border:0;border-radius:12px;background:rgba(255,255,255,.8);box-shadow:var(--clay-s);color:var(--sub);font-weight:800}
.mm .input{background:rgba(255,255,255,.7);border:1px solid rgba(13,90,84,.07);border-radius:16px;box-shadow:var(--press)}
.mm .input:focus{border-color:var(--mint);box-shadow:var(--press),0 0 0 4px rgba(20,184,171,.16)}
.mm .field{color:var(--sub)}
.hint{font-size:.8rem;color:var(--mute);font-weight:500}
.field .hint{margin-left:4px}
.mm .toggle input,.mm input[type=checkbox]{accent-color:var(--mint)}
.mm .notice{background:rgba(255,246,214,.8);border:1px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:var(--clay-s)}
.mm .notice.mint{background:rgba(226,248,244,.85);color:#08695f}
.mm .notice.red{background:rgba(255,234,234,.85)}
.mm .seg.wide{background:rgba(13,90,84,.06);box-shadow:var(--press);border-radius:18px;padding:4px}
.mm .seg.wide button{border-radius:14px;color:var(--sub)}
.mm .seg.wide button.on{background:#fff;color:var(--mint-d);box-shadow:var(--clay-s)}
.mm .filter-chips button,.mm .quick button,.mm .tabs-line button{border:1px solid var(--glass-b);background:rgba(255,255,255,.72);box-shadow:var(--clay-s);border-radius:999px;color:var(--sub);font-weight:700}
.mm .filter-chips button.on,.mm .quick button.on,.mm .tabs-line button.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 10px 18px -10px rgba(14,163,151,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.mm .filter-chips button.on small{color:#d6fffa}
.mm .tabs-line{border:0;gap:8px;padding:6px 16px 10px;margin-top:4px}
.mm .tabs-line button{padding:8px 14px;font-size:.86rem}
.mm .tabs-line button.on::after{display:none}
.mm .quick button{padding:8px 13px}
.copy-box{margin-top:10px}
.spinner{width:36px;height:36px;border-radius:50%;border:4px solid rgba(20,184,171,.15);border-top-color:var(--mint);margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sec-title{font-size:1.12rem;margin:22px 4px 10px}
.sec-title small{color:var(--mint-d);font-weight:800;font-size:.9rem}

/* 그림 */
.mm .thumb{border-radius:18px;box-shadow:0 10px 18px -12px rgba(13,90,84,.45),inset 0 1px 0 rgba(255,255,255,.6)}
.mm .thumb.sm{border-radius:13px}
.mm .thumb.md{border-radius:16px}
.mm .thumb.lg{border-radius:0;box-shadow:none}
.mm .m-emo{border-radius:18px;box-shadow:0 10px 18px -12px rgba(13,90,84,.45)}

/* 첫 화면 */
.land{position:relative;overflow:hidden;padding:calc(26px + env(safe-area-inset-top,0px)) 22px 22px}
.deco span{position:absolute;border-radius:50%;pointer-events:none}
.deco .d1{width:112px;height:112px;right:-26px;top:58px;background:radial-gradient(circle at 32% 28%,#a6f5ec 0%,#2fd2c4 38%,#0fa596 100%);
  box-shadow:inset -10px -14px 22px rgba(0,0,0,.12),inset 8px 8px 16px rgba(255,255,255,.45),0 22px 34px -16px rgba(13,90,84,.55)}
.deco .d2{width:62px;height:62px;right:78px;top:12px;background:radial-gradient(circle,transparent 27%,#ffc1ab 28%,#ff9a7a 72%,transparent 73%);filter:drop-shadow(0 12px 14px rgba(255,120,90,.3))}
.deco .d3{width:30px;height:30px;right:22px;top:182px;background:radial-gradient(circle at 32% 28%,#e3e4ff,#9fa6ff 60%,#7d84f0);box-shadow:0 10px 16px -8px rgba(110,110,230,.5)}
.land-logo{display:flex;align-items:center;gap:10px;position:relative}
.logo-ic{width:42px;height:42px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:var(--grad-shadow)}
.logo-ic svg{width:22px;height:22px}
.land-logo b{font-size:1.15rem;font-weight:800}
.land h1{position:relative;font-size:2.35rem;font-weight:800;line-height:1.16;margin:28px 0 12px;letter-spacing:-.05em}
.land h1 em{font-style:normal;color:var(--mint-d)}
.land p{position:relative;margin:0 0 22px;line-height:1.6;color:var(--sub);font-size:.95rem;max-width:21em}
.land-go{font-size:1.08rem}
.land-camp{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:14px;text-align:left;color:var(--ink)}
.lc-ic{width:44px;height:44px;border-radius:15px;background:linear-gradient(180deg,#fff,#eaf7f4);box-shadow:var(--clay-s);display:grid;place-items:center;font-size:1.4rem;flex:0 0 44px}
.lc-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lc-txt b{font-weight:800}
.lc-txt small{font-size:.78rem;color:var(--sub)}
.lc-go{font-size:1.4rem;color:var(--mute)}
.how{list-style:none;padding:0;margin:6px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.how li{padding:16px 14px;display:flex;flex-direction:column;gap:4px}
.how i{font-style:normal;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:1.3rem;margin-bottom:6px;box-shadow:var(--clay-s)}
.how .t1{background:linear-gradient(180deg,#e9fbf8,#cdf2ec)}.how .t2{background:linear-gradient(180deg,#eef0ff,#dadfff)}
.how .t3{background:linear-gradient(180deg,#fff2ec,#ffdccf)}.how .t4{background:linear-gradient(180deg,#fff8e6,#ffebbd)}
.how b{font-weight:800}
.how span{font-size:.8rem;color:var(--sub);line-height:1.4}
.room-list{display:flex;flex-direction:column;padding:4px 14px}
.room-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.room-row:last-child{border-bottom:0}
.rr-ic{width:42px;height:42px;border-radius:14px;background:linear-gradient(180deg,#fff,#eaf7f4);box-shadow:var(--clay-s);display:grid;place-items:center;font-size:1.2rem}
.rr-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.rr-txt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr-txt small{color:var(--sub);font-size:.78rem}
.rr-go{color:var(--mute);font-size:1.3rem}

/* 방 만들기 */
.form{padding-top:8px;padding-bottom:120px}
.f-sec{margin:0 0 14px;padding:18px 16px}
.f-sec h2{display:flex;align-items:center;gap:9px;font-size:1.08rem;margin:0 0 4px}
.f-sec h2 i{font-style:normal;width:28px;height:28px;border-radius:10px;background:var(--grad);color:#fff;font-size:.82rem;display:grid;place-items:center;box-shadow:var(--grad-shadow)}
.f-sec h2 small{color:var(--mint-d);font-weight:800;font-size:.9rem}
.f-sec .seg.wide{margin:12px 0 6px}
.hint-box{background:rgba(13,90,84,.05);box-shadow:var(--press);border-radius:16px;padding:14px;font-size:.86rem;color:var(--sub);line-height:1.5;margin:8px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two .btn{padding:13px 8px;font-size:.9rem;white-space:normal;line-height:1.3}
.pick-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pr-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.pr-txt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.pr-txt span{font-size:.78rem;color:var(--sub)}
.custom-box{background:rgba(13,90,84,.045);box-shadow:var(--press);border-radius:20px;padding:4px 14px 14px;margin-top:14px}
.custom-box .btn{margin-top:12px}
.name-tools{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.mm .toggle{margin-top:12px}

/* 맛집 목록 */
.mm .search{margin:12px 0 0;padding:13px 16px}
.cat-row{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:14px -16px 2px;padding:4px 12px 12px}
.cat-row::-webkit-scrollbar{display:none}
.cat-row button{flex:0 0 66px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.76rem;font-weight:700;color:var(--sub);padding:0}
.cat-row i{font-style:normal;width:54px;height:54px;border-radius:19px;background:linear-gradient(180deg,#fff,#edf6f4);box-shadow:var(--clay-s),0 0 0 1px rgba(255,255,255,.9);display:grid;place-items:center;font-size:1.55rem;transition:transform .12s}
.cat-row small{font-size:.66rem;color:var(--mute);font-weight:700;margin-top:-3px}
.cat-row button.on{color:var(--mint-d)}
.cat-row button.on i{background:var(--grad);box-shadow:var(--grad-shadow);transform:translateY(-2px)}
.cat-row button:active i{transform:scale(.94)}
.mm .filter-chips{margin:4px -16px 12px}
.mm .plist{padding:2px 14px}
label.prow{display:block;cursor:pointer}
.mm .prow:last-child{border-bottom:0}
.prow .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm .switch i{background:rgba(13,90,84,.12);box-shadow:var(--press)}
.mm .switch i::after{box-shadow:0 3px 8px rgba(13,90,84,.3),inset 0 -2px 0 rgba(0,0,0,.05)}
.mm .switch input:checked+i{background:var(--grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}

/* 방 머리 */
.room-head{margin:6px 16px 4px;padding:18px}
.room-head.big{margin-top:10px;padding:22px 20px}
.room-head h1{font-size:1.45rem;font-weight:800;margin:4px 0 6px;line-height:1.25}
.room-head.big h1{font-size:1.7rem}
.host-badge{display:inline-block;font-size:.74rem;font-weight:800;color:#8a6100;background:linear-gradient(180deg,#fff7dc,#ffecb0);border-radius:999px;padding:5px 11px;box-shadow:var(--clay-s)}
.rh-note{margin:0 0 12px;color:var(--sub);font-size:.9rem;line-height:1.5;white-space:pre-line}
.rh-meta{display:flex;flex-wrap:wrap;gap:6px}
.rh-chip{background:rgba(255,255,255,.85);border-radius:999px;padding:7px 12px;font-size:.8rem;font-weight:700;color:#3d504d;box-shadow:var(--clay-s)}
.rh-chip b{color:var(--mint-d)}
.rh-chip.warn{background:#fff3cf;color:#8a6100}
.rh-chip.red{background:#ffe5e5;color:#c22a31}

/* 이름 고르기 */
.mm .who-grid{gap:10px}
.mm .who-btn{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--glass-b);border-radius:20px;box-shadow:var(--clay-s)}
.mm .who-btn:hover{border-color:var(--glass-b)}
.who-btn small{font-size:.68rem;color:var(--mint-d);font-weight:800}
.mm .who-btn.did{background:rgba(220,245,241,.85)}
.mm .who-btn.me{box-shadow:var(--clay-s),0 0 0 2px var(--mint)}
.name-in{margin-top:10px}
.name-in .input{flex:1}

/* 가게 · 메뉴 */
.mm .stores{padding:2px 14px}
.mm .store:active{background:transparent;opacity:.8}
.mm .badge{background:var(--grad);box-shadow:0 6px 10px -6px rgba(14,163,151,.8);top:16px}
.mm .shop-hero.nopic{padding-top:6px}
.mm .shop-card{margin:-40px 12px 0;border-radius:var(--r);background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--glass-b);box-shadow:var(--clay);padding:20px 16px 12px}
.mm .shop-hero.nopic .shop-card{margin:0 16px}
.mm .shop-acts{border-color:var(--line);margin-top:14px}
.mm .shop-acts>*+*{border-color:var(--line)}
.mm .menus{margin:0 16px;padding:0 16px}
.mm .menu{border-color:var(--line)}
.mm .menu:last-child{border-bottom:0}
.menu.plain .menu-main{min-height:0}
.mm .add{background:var(--grad);color:#fff;box-shadow:var(--grad-shadow)}
.mm .qty{background:rgba(255,255,255,.95);box-shadow:var(--clay-s),0 0 0 1px rgba(13,90,84,.05)}
.mm .m-ctl .qty{box-shadow:var(--clay-s)}
.mm .tag{border-radius:7px}
.mm .sent-note{background:rgba(220,245,241,.9);border:1px solid var(--glass-b);border-radius:18px;box-shadow:var(--clay-s)}

/* 장바구니 · 영수증 */
.mm .who-line{margin:12px 20px 12px}
.mm .who-line i{background:#fff;box-shadow:var(--clay-s)}
.mm .cart-store,.mm .cart-req,.mm .summary{margin:0 16px;padding:14px 16px}
.mm .cart-req .h3{display:block;font-weight:800;margin-bottom:10px}
.mm .cart-req .input{resize:none}
.sheet-gap{height:44px}
.mm .sheet{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border-radius:30px 30px 0 0}
.mm .sheet-bg,.sheet-bg{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);background:rgba(16,40,38,.38)}
.sheet .btn{border-radius:18px;background:var(--grad);box-shadow:var(--grad-shadow)}
.sheet .qty{box-shadow:var(--clay-s)}
.mm .ticket{padding:20px 18px 18px}
.mm .t-head{border-color:rgba(13,90,84,.15)}
.mm .t-total{border-color:var(--ink)}
.mm .t-req{background:rgba(13,90,84,.05)}
.sent-ok{text-align:center;padding:26px 16px 22px;margin:14px 0}
.so-ic{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#a6f5ec 0%,#2fd2c4 40%,#0fa596 100%);color:#fff;font-size:1.9rem;font-weight:800;display:grid;place-items:center;margin:0 auto 12px;animation:pop .35s ease-out;
  box-shadow:inset -6px -8px 14px rgba(0,0,0,.12),inset 5px 5px 10px rgba(255,255,255,.4),0 16px 26px -12px rgba(13,90,84,.6)}
.sent-ok h2{margin:0 0 6px}
.sent-ok .muted{margin:0}
.notice.other-dev{margin:16px 0 14px}
.mm .empty .big{filter:drop-shadow(0 12px 14px rgba(13,90,84,.2))}

/* 방장 */
.share-card{padding:16px;margin-bottom:14px;background:linear-gradient(160deg,rgba(226,249,245,.85),rgba(255,255,255,.7))!important}
.sc-top{display:flex;gap:12px;align-items:center}
.sc-ic{width:44px;height:44px;border-radius:15px;background:var(--grad);color:#fff;display:grid;place-items:center;flex:0 0 44px;box-shadow:var(--grad-shadow)}
.sc-top b{display:block;font-weight:800}
.sc-top span{font-size:.8rem;color:var(--sub)}
.sc-link{margin:14px 0 12px;background:rgba(255,255,255,.75);box-shadow:var(--press);border-radius:14px;padding:11px 13px;font-size:.8rem;color:var(--sub);word-break:break-all;font-family:ui-monospace,Menlo,monospace}
.mm .a-sec{margin:0 0 14px;padding:16px;border-bottom:1px solid var(--glass-b)}
.mm .a-sec:last-child{margin-bottom:14px}
.mm .prog-num b{color:var(--mint-d)}
.mm .bar{height:10px;background:rgba(13,90,84,.08);box-shadow:var(--press)}
.mm .bar i{background:var(--grad);box-shadow:0 0 10px rgba(20,184,171,.5)}
.mm .pill{background:rgba(255,255,255,.85);box-shadow:var(--clay-s)}
.mm .pill.no{color:var(--sub)}
.mm .pill.ok{background:rgba(220,245,241,.95);color:var(--mint-d)}
.mm .sum-card{padding:16px}
.mm .req-line{background:rgba(13,90,84,.05)}
.mm .who-ava{background:#fff;box-shadow:var(--clay-s)}
.state-row{display:flex;align-items:center;gap:12px;margin-top:8px}
.state-row>div{flex:1;display:flex;flex-direction:column}
.state-row b{font-weight:800}
.state-row span{font-size:.8rem;color:var(--sub)}
.state-row .btn{padding:12px 18px}
.store-edit{border-bottom:1px solid var(--line)}
.store-edit summary{list-style:none;cursor:pointer}
.store-edit summary::-webkit-details-marker{display:none}
.store-edit .pick-row{border-bottom:0}
.se-open{font-size:.8rem;font-weight:700;color:var(--mint-d);background:#fff;box-shadow:var(--clay-s);border-radius:10px;padding:7px 11px}
.store-edit[open] .se-open{background:var(--grad);color:#fff}
.mm .edit-box{background:rgba(13,90,84,.045);box-shadow:var(--press);border-radius:18px;margin:0 0 12px}
.save-bar .btn.gray{flex:0 0 auto;padding:14px 18px}
@media print{.bottom-bar,.share-card,body::after{display:none!important}html,body{background:#fff}}
@media (prefers-reduced-transparency:reduce){.mm .stores,.mm .menus,.mm .card,.mm .f-sec,.mm .a-sec,.mm .room-head,.mm .nav,.bottom-bar{background:#fff}}
.mm .summary .total{border:0;padding-top:0;margin-top:0}
.mm .summary p{margin:6px 0 0}
.img-note{position:absolute;left:6px;bottom:6px;z-index:2;font-size:.6rem;font-weight:700;color:#fff;background:rgba(16,40,38,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:6px;padding:2px 5px;pointer-events:none;letter-spacing:0}
.sheet-emo .img-note{left:12px;bottom:12px;font-size:.72rem;padding:3px 8px}
.img-note{display:none}
.ph.on+.img-note{display:block}

/* 첫 화면: 내가 만든 방 · 참여한 방 */
.my-rooms{margin-top:6px}
.my-rooms .seg.wide{margin-bottom:12px}
.my-rooms .seg button small{font-size:.74rem;color:var(--mute)}
.my-rooms .seg button.on small{color:var(--mint-d)}
.room-cards{display:flex;flex-direction:column;gap:12px}
.room-card{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--glass-b);border-radius:var(--r);box-shadow:var(--clay);overflow:hidden;animation:rise .35s ease-out both}
.room-card:nth-child(2){animation-delay:.05s}.room-card:nth-child(3){animation-delay:.1s}.room-card:nth-child(4){animation-delay:.15s}
.rc-main{display:flex;align-items:center;gap:12px;padding:14px 16px;color:var(--ink);text-decoration:none}
.rc-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.rc-chip{font-size:.72rem;font-weight:700;color:var(--sub);background:rgba(255,255,255,.85);box-shadow:var(--clay-s);border-radius:999px;padding:3px 9px;white-space:nowrap}
.rc-chip.on{color:var(--mint-d);background:#e3f8f4}
.rc-chip.red{color:#c22a31;background:#ffe9e9}
.rc-names{display:block;margin-top:6px;font-size:.78rem;color:var(--sub)}
.rc-acts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line)}
.rc-acts a,.rc-acts button{border:0;background:none;padding:12px 4px;font-size:.84rem;font-weight:700;color:var(--mint-d);text-align:center;text-decoration:none}
.rc-acts>*+*{border-left:1px solid var(--line)}
.rc-acts>*:active{background:rgba(20,184,171,.08)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* 내 주문: 이름별 */
.mine-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mine-head .sec-title{margin-bottom:6px}
.mine-item{position:relative}
.mine-item.cur .ticket{box-shadow:var(--clay),0 0 0 2px var(--mint)}
.mine-acts{margin-top:10px}

/* ── 다듬기: 알림·불러오기·움직임 ── */
#toast{top:calc(env(safe-area-inset-top,0px) + 14px);background:rgba(18,44,41,.82);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
  border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px 18px;font-weight:700;font-size:.9rem;box-shadow:0 18px 34px -16px rgba(0,0,0,.45);
  transform:translateX(-50%) translateY(-16px) scale(.96);transition:transform .32s cubic-bezier(.2,1.4,.4,1),opacity .2s}
#toast.show{transform:translateX(-50%) translateY(0) scale(1)}
/* 뼈대 화면 */
.skel{padding:8px 16px}
.sk-head{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--r);box-shadow:var(--clay);padding:22px 20px;display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.sk-row{display:flex;gap:14px;align-items:center;background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--r);box-shadow:var(--clay-s);padding:14px;margin-bottom:10px}
.sk-row>div{flex:1;display:flex;flex-direction:column;gap:9px}
.sk{display:block;height:12px;border-radius:8px;background:linear-gradient(90deg,rgba(13,90,84,.07) 0%,rgba(13,90,84,.14) 50%,rgba(13,90,84,.07) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.sk.big{height:24px}.sk.thumb{width:72px;height:72px;border-radius:18px;flex:0 0 72px}
.sk.w30{width:30%}.sk.w40{width:40%}.sk.w50{width:50%}.sk.w60{width:60%}.sk.w70{width:70%}.sk.w90{width:90%}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
/* 화면이 바뀔 때만 목록이 차례로 올라와요(실시간으로 다시 그릴 때는 안 움직여요) */
.mm.enter .stores>*,.mm.enter .menus>*,.mm.enter .who-grid>*,.mm.enter .room-cards>*,.mm.enter .how>li,.mm.enter .stack>*,.mm.enter .plist>*{animation:rise .38s cubic-bezier(.2,.8,.3,1) both}
.mm.enter :is(.stores,.menus,.who-grid,.room-cards,.how,.stack,.plist)>:nth-child(2){animation-delay:.04s}
.mm.enter :is(.stores,.menus,.who-grid,.room-cards,.how,.stack,.plist)>:nth-child(3){animation-delay:.08s}
.mm.enter :is(.stores,.menus,.who-grid,.room-cards,.how,.stack,.plist)>:nth-child(4){animation-delay:.12s}
.mm.enter :is(.stores,.menus,.who-grid,.room-cards,.how,.stack,.plist)>:nth-child(5){animation-delay:.16s}
.mm.enter :is(.stores,.menus,.who-grid,.room-cards,.how,.stack,.plist)>:nth-child(n+6){animation-delay:.2s}
.room-card{animation:none}
/* 누르는 느낌 */
.mm :is(.store,.room-card .rc-main,.who-btn,.how li,.land-camp,.prow,.menu-main,.cat-row button,.pick-row){transition:transform .14s ease,box-shadow .2s}
.mm :is(.store,.room-card .rc-main,.who-btn,.prow,.menu-main):active{transform:scale(.985)}
.mm .btn{transition:transform .12s ease,box-shadow .2s,filter .2s}
.mm .btn:active{transform:translateY(1px) scale(.985);filter:brightness(.97)}
.mm .btn:not(:disabled):hover{filter:brightness(1.03)}
.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
.so-ic{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@media (hover:hover){.mm .store:hover,.mm .room-card:hover{box-shadow:var(--clay)}}

/* 📢 총무 한마디 · 🎁 내가 쏜다 — 방 어느 화면에서나 위에 붙어 있어요 */
.pin-bar{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px));z-index:15;padding:4px 12px 6px;pointer-events:none}
.pb-in{pointer-events:auto;display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--glass-b);border-radius:18px;box-shadow:0 14px 26px -16px rgba(13,90,84,.45);padding:9px 12px}
.pb-treat{display:flex;align-items:center;gap:8px;font-size:.84rem;color:#5b3a00}
.pb-treat b{color:#8a4b00}
.pb-gift{width:26px;height:26px;border-radius:9px;background:linear-gradient(180deg,#fff3d6,#ffd98a);display:grid;place-items:center;flex:0 0 26px;box-shadow:0 4px 8px -4px rgba(190,120,0,.5)}
.pb-left{margin-left:auto;font-size:.76rem;font-weight:800;color:var(--mint-d);background:#e3f8f4;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pb-left.over{color:#c22a31;background:#ffe9e9}
.pb-note{display:flex;align-items:flex-start;gap:8px;border:0;background:none;padding:0;text-align:left;width:100%;color:var(--ink)}
.pb-treat+.pb-note{border-top:1px dashed rgba(13,90,84,.15);padding-top:6px}
.pb-ic{width:26px;height:26px;border-radius:9px;background:var(--grad);display:grid;place-items:center;flex:0 0 26px;font-size:.8rem;box-shadow:0 4px 8px -4px rgba(14,163,151,.7)}
.pb-txt{flex:1;min-width:0;font-size:.85rem;line-height:1.45;color:#2b4441;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;padding-top:3px}
.pb-txt b{color:var(--mint-d);margin-right:6px;font-weight:800}
.pb-note.open .pb-txt{-webkit-line-clamp:unset;display:block}
.pb-more{font-size:.72rem;color:var(--mute);font-weight:700;padding-top:5px;white-space:nowrap}
.mm.enter .pin-bar{animation:rise .35s ease-out both}

/* 방 만들기·설정: 내가 쏜다 */
.treat-toggle{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:10px;border-radius:18px;background:rgba(255,255,255,.7);box-shadow:var(--clay-s);cursor:pointer;position:relative}
.treat-toggle input{position:absolute;opacity:0;width:1px;height:1px}
.tt-ic{width:40px;height:40px;border-radius:14px;background:linear-gradient(180deg,#fff6e0,#ffdf9e);display:grid;place-items:center;font-size:1.3rem;flex:0 0 40px;box-shadow:0 8px 14px -8px rgba(190,120,0,.55)}
.tt-txt{flex:1;display:flex;flex-direction:column}
.tt-txt b{font-weight:800;font-size:1rem}
.tt-txt small{font-size:.78rem;color:var(--sub)}
.treat-toggle .switch{pointer-events:none}
.treat-toggle input:checked~.switch i{background:linear-gradient(180deg,#ffc95e,#f5a524);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.treat-toggle input:checked~.switch i::after{transform:translateX(20px)}
.treat-toggle input:focus-visible~.switch i{outline:3px solid var(--mint);outline-offset:2px}
.treat-sec.on .treat-toggle{background:linear-gradient(160deg,rgba(255,246,224,.9),rgba(255,255,255,.75))}
.treat-fields{animation:rise .3s ease-out both}
.cap-in{display:flex;align-items:center;gap:8px}
.cap-in .input{flex:1}
.cap-in span{font-weight:800;color:var(--sub)}
.cap-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cap-chips button{border:1px solid var(--glass-b);background:rgba(255,255,255,.75);box-shadow:var(--clay-s);border-radius:999px;padding:7px 12px;font-size:.82rem;font-weight:700;color:var(--sub)}
.cap-chips button.on{background:linear-gradient(180deg,#ffc95e,#f5a524);color:#fff;border-color:transparent}

/* 예산 */
.budget{margin-top:12px;padding:12px 14px;border-radius:16px;background:linear-gradient(160deg,rgba(255,246,224,.9),rgba(255,255,255,.7));box-shadow:var(--clay-s)}
.bd-top{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;color:#5b3a00}
.bd-top b{color:var(--mint-d);white-space:nowrap}
.budget .bar i{background:linear-gradient(90deg,#ffc95e,#f5a524)}
.budget.over .bd-top b,.budget p{color:#c22a31}
.budget p{margin:8px 0 0;font-size:.8rem;font-weight:700}
.mm .menu.over .info{opacity:.55}
.mm .menu.over .m-emo{filter:grayscale(.5);opacity:.7}
.mm .menu.over .add{background:#d3dfdd;box-shadow:none}
.tag.over{background:#ffe9e9;color:#c22a31}
.rc-chip.gift{color:#8a4b00;background:#fff1cf}
.treat-sum .ts-row{display:flex;justify-content:space-between;padding:6px 0;font-size:.9rem}
.treat-sum .ts-row b{font-variant-numeric:tabular-nums}
@media print{.pin-bar{position:static}}
.mm .menu.in .name::after{content:" · 고름"}
/* 메뉴와 제출 상태를 먼저 읽을 수 있게 하는 참여자 화면 */
.menu-context{display:flex;justify-content:space-between;gap:12px;padding:6px 20px;color:#536b67;font-size:14px}
.shop-compact{position:relative;margin:6px 16px 8px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:16px}
.shop-title{display:flex;align-items:center;gap:10px;padding-right:68px}
.shop-title>div:not(.thumb){min-width:0;flex:1}
.shop-title .thumb{width:44px;height:44px;flex:0 0 44px}
.shop-title h2{font-size:17px;line-height:1.35;margin:0 0 3px;overflow-wrap:anywhere}
.shop-title span,.shop-details{font-size:14px;color:#536b67}
.shop-details summary{position:absolute;right:10px;top:10px;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:flex-end;color:var(--mint-d);font-size:13px;font-weight:700}
.shop-details[open]{padding-top:12px}
.shop-details summary::after{content:'⌄';margin-left:8px}
.shop-details[open] summary::after{content:'⌃'}
.shop-details .shop-acts{margin-top:0}
.store-tabs{display:flex;overflow-x:auto;gap:8px;padding:4px 16px;scrollbar-width:none}
.store-tabs::-webkit-scrollbar{display:none}
.store-tabs button{flex-shrink:0;min-height:44px;border:1px solid #c7dbd7;border-radius:12px;padding:8px 12px;background:#fff;color:#405c56;font:inherit;font-size:14px}
.store-tabs button.on{background:#e0f6ef;border-color:#008c7c;color:#006f62;font-weight:800}
.mm .menu-notices{padding-top:0;padding-bottom:0}
.mm .menu-notices:empty{display:none}
.mm .tab-menu .room-head{padding:0}
.mm .qty button,.mm .add{width:44px;height:44px;min-width:44px;min-height:44px}
.mm .qty{height:44px}
.mm .menu .name,.mm .cart-store .nm{font-size:16px;line-height:1.4}
.mm .menu .desc,.mm .hint,.mm .cart-store .muted,.mm .summary .muted{font-size:14px;color:#536b67}
.mm .selection-status{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.5;background:#fff1d6;color:#76510b}
.mm .selection-status.sent{background:#e3f6ee;color:#17654f}
.mm .selection-status span{font-weight:400}
.mm .sent-note.unsent{background:#fff1d6;color:#76510b}
.mm .t-req,.mm .group-requests,.mm .req-line{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.6;color:#344e47}
.mm .t-req p{margin:4px 0 0}
.group-requests{margin:12px 0;padding:12px;background:#f0f7f3;border:1px solid #d5e6dc;border-radius:12px}
.group-requests p{margin:8px 0 0}
.message-preview{margin:12px 0}
.message-preview summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--mint-d);font-weight:700;font-size:14px}
.message-preview summary::before{content:'⌄';margin-right:8px}
.message-preview pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:14px;line-height:1.6;background:#f5f7f6;border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0}
.mm .review .ticket{margin:12px 0}
.mm .review .sec-title{font-size:20px;line-height:1.45}
.mm .cartbar:disabled{opacity:.65;cursor:wait}
.mm .cart-req .quick button{min-height:44px}
.mm.tab-review{padding-bottom:150px}
.mm :focus-visible{outline:3px solid #006b60;outline-offset:3px}
@media(max-width:420px){.mm .menus{margin:0 12px;padding:0 12px}.mm .menu-main{padding:12px 0;min-height:140px}.mm .menu .desc{-webkit-line-clamp:1}.mm .m-emo{flex-basis:72px;height:72px;margin-bottom:44px}.mm .m-ctl{right:0;bottom:10px}.mm .nav-i span{font-size:12px}.mm .cartbar{font-size:14px}.mm .cartbar .sp{white-space:normal;line-height:1.3}.mm .pb-treat{flex-wrap:wrap;gap:4px}.mm .pb-left{margin-left:34px}.mm .pb-in{padding:6px 10px;gap:3px}.mm .pb-note{padding-top:3px;padding-bottom:3px}.mm .shop-title h2{font-size:16px}}
/* 메뉴 모으기: 민트빛 유리, 볼록한 버튼, 또렷한 메뉴와 넉넉한 터치 영역.
   room.css의 동작별 레이아웃 위에서 브랜드와 반응형 배치를 관리합니다. */
:root{
  --mint:#087e72;--mint-d:#075b53;--mint-l:#d9f5ec;--mint-ll:#effbf7;
  --ink:#153d38;--sub:#4c6863;--mute:#5b746e;--line:rgba(20,93,83,.15);--band:#e3f3f0;--bg:#e8f7f3;
  --glass:rgba(255,255,255,.74);--glass-hi:rgba(255,255,255,.96);--glass-b:rgba(255,255,255,.94);
  --clay:0 20px 38px -24px #0b6f6855,0 5px 14px -8px #275f5b26,inset 0 1px 0 #fff;
  --clay-s:0 8px 15px -10px #0b6f6870,0 2px 4px #1a695409,inset 0 1px 0 #fff;
  --press:inset 0 2px 5px #27635d12,inset 0 -1px 0 #fff;
  --grad:linear-gradient(175deg,#a5f2e3 0%,#63dfcc 38%,#32c5b5 100%);
  --grad-shadow:0 12px 24px -12px #0a857d90,inset 0 2px 0 #ffffffa6,inset 0 -3px 0 #0b78632b;
  --action-ink:#083f39;--r:22px;--top-h:68px;--nav-h:72px;
  --display:var(--body);--accent:#d69749;
}
html{background:var(--bg)}
body{background:radial-gradient(ellipse at 10% 0%,#bdeee299,transparent 48%),radial-gradient(ellipse at 100% 50%,#c8dafa88,transparent 55%),linear-gradient(155deg,#e2f7f1,#edf4fc 55%,#e7f7f1);background-attachment:fixed;color:var(--ink);font-size:16px}
body::after{display:none}body::before{background:#e8f7f3}
#app{max-width:640px;padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
#app.view-home{padding-bottom:0}#app.view-create,#app.view-catalog{padding-bottom:30px}
.mm{line-height:1.5;letter-spacing:-.025em}
.mm h1,.mm h2,.mm h3{letter-spacing:-.035em}
.mm .stores,.mm .room-list,.mm .plist,.mm .card,.mm .ticket,.mm .f-sec,.mm .a-sec,.mm .share-card,.mm .room-head,.mm .cart-store,.mm .summary,.mm .cart-req,.mm .how li,.mm .sent-ok,.mm .who-btn,.mm .room-card{background:var(--glass-hi);border-color:var(--glass-b);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:var(--clay)}
.mm .btn,.mm .small-btn,.mm .x-btn,.mm .top .back,.mm .chip-who,.mm .who-btn,.mm .filter-chips button,.mm .quick button,.mm .tabs-line button{min-height:44px}
.mm .btn,.sheet .btn{border:1px solid #1b9d8c36;border-radius:16px;background:var(--grad);color:var(--action-ink);box-shadow:var(--grad-shadow);font-weight:750;padding:13px 18px}
.mm .btn.block{padding:14px 18px;font-size:16px}
.mm .btn.gray,.mm .btn.line-dark{background:linear-gradient(#ffffffed,#eff9f5);color:var(--ink);border:1px solid #c5ddd5;box-shadow:var(--clay-s)}
.mm .btn.red{background:linear-gradient(#c14d44,#a83631);color:#fff;border-color:#a43630;box-shadow:inset 0 1px 0 #ffffff50,0 8px 16px -12px #a8363190}
.mm .btn:disabled{background:#e2e8e1;color:#67766c;cursor:not-allowed}
.mm .btn:not(:disabled):hover{filter:brightness(.94)}
.mm .small-btn,.mm .x-btn{background:linear-gradient(#fff,#eff9f5);border:1px solid var(--glass-b);border-radius:12px;box-shadow:var(--clay-s)}
.mm .text-btn{min-height:44px;padding-top:10px;padding-bottom:10px}

/* Three landings, a springing tray, then delivery. Native vectors at every scale. */

.motion-piece{transform-origin:48px 121px;animation:food-land 2.8s cubic-bezier(.2,.8,.3,1) infinite;animation-delay:calc(var(--step)*.2s)}
.motion-shadow{fill:#006b6512;transform-origin:180px 202px;animation:shadow-breathe 2.8s ease-in-out infinite}.motion-tray{transform-origin:180px 194px;animation:tray-spring 2.8s ease-in-out infinite}.motion-spark{transform-origin:180px 20px;animation:food-spark 2.8s ease-out infinite}
.motion-steam{animation:food-steam 1.4s ease-in-out infinite}.motion-chopsticks{transform-origin:65px 25px;animation:chop-tick 2.8s ease-in-out infinite}

.brand-loading{min-height:340px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 0}.brand-loading h2{font-size:16px;font-weight:550;margin:24px 0 0;color:var(--sub)}.loading-dots{letter-spacing:2px;margin-left:3px}
.send-curtain .brand-motion{width:310px;margin:0 auto 26px}.send-curtain .send-panel h2{font-size:19px;font-weight:650}.sending .motion-delivery{animation:tray-delivery 2.8s cubic-bezier(.4,0,.3,1) infinite}.sending .motion-step-labels span:last-child{animation-delay:1.65s}

.thanks-note:nth-child(3n+2){background:#fdf3ef;border-color:#eddfd2}.thanks-note:nth-child(3n+3){background:#f0f8f0;border-color:#dce7d6}

.thanks-moment{position:fixed;z-index:1400;bottom:max(86px,calc(env(safe-area-inset-bottom) + 76px));left:50%;transform:translateX(-50%);width:min(370px,calc(100vw - 32px));pointer-events:none}
.thanks-moment-card{position:relative;display:grid;justify-items:center;gap:8px;padding:24px 26px 20px;border:1px solid #e0d9af;border-radius:25px;background:linear-gradient(145deg,#fffef8,#f3f7dc);box-shadow:0 15px 60px #355b4930, inset 0 1px #fff;text-align:center;pointer-events:auto;animation:thanks-pop .45s cubic-bezier(.2,.8,.2,1)}

@keyframes thanks-pop{from{opacity:0;transform:translateY(16px) scale(.91)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes thanks-float{0%{opacity:0;transform:translate(-50%,10px) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),var(--dy)) rotate(var(--turn)) scale(1.15)}}

@media(max-width:380px){.thanks-composer>summary{padding:15px 12px;gap:8px}.thanks-composer>summary b{font-size:14px}.thanks-envelope{width:34px;height:36px;font-size:21px}.thanks-compose-body{padding:0 12px 12px}.thanks-presets button{font-size:12px;padding:10px 8px;gap:5px}.thanks-presets button>span{font-size:19px}.thanks-effects{grid-template-columns:repeat(2,minmax(0,1fr))}.thanks-notes{grid-template-columns:1fr}.thanks-wall{padding:14px}.treat-units{gap:5px}.treat-units button{font-size:12px;padding:6px 2px}}

/* Keep the room's instructions visible while browsing menus. */

async function finishLegacyReceipt(){
  let migrationId=sessionStorage.getItem('dinner-migration');if(!migrationId&&!hostAccount.uid)return;
  let changed=false;
  for(let attempt=0;attempt<50;attempt++){
    const result=await hostApi('/migrate-rooms',migrationId?{migrationId}:{});
    changed ||= !!(result.linked?.length||result.skipped?.length);
    for(const id of result.skipped||[]){legacyMove.skipped.add(id);rememberRoom(id,{host:false,key:'',role:''});}
    if(result.errors?.length)throw Error('migration-incomplete');
    if(!result.remaining){sessionStorage.removeItem('dinner-migration');if(changed)await syncAccountRooms();return;}
    if(!result.linked?.length&&!result.skipped?.length)throw Error('migration-incomplete');
  }
  throw Error('migration-incomplete');
}
async function checkLegacyMove(){
  if(installPreview()){legacyMove.error='미리보기예요. 실제 계정 연결과 이동은 이전 운영 주소에서 진행해 주세요.';rerender();return;}
  if(legacyMove.busy)return;
  Object.assign(legacyMove,{active:true,busy:true,error:''});S.route='legacy-move';render();
  try{
    const saved=legacyStorage('mm-rooms')||[];
    if(!Array.isArray(saved))throw Error('storage-unavailable');
    const known=new Map(saved.filter(r=>/^[a-z0-9]{1,64}$/i.test(r?.id||'')).map(r=>[r.id,r]));
    const id=new URLSearchParams(legacyMove.hash.replace(/^#/, '')).get('r');
    if(/^[a-z0-9]{1,64}$/i.test(id||'')&&!known.has(id))known.set(id,{id,title:'현재 링크의 방'});
    legacyMove.drafts=legacyDrafts([...known.values()]);
    await initHostAccount({deferView:true});
    if(hostAccount.error)throw Error('account-check-failed');
    await finishLegacyReceipt();
    const managed=[];
    const rows=[...known.values()];
    for(let offset=0;offset<rows.length;offset+=5){
      await Promise.all(rows.slice(offset,offset+5).map(async row=>{
        if(legacyMove.skipped.has(row.id))return;
        try{
          const result=await managerApi('/managers',{roomId:row.id}),self=result.members.find(p=>p.self);
          const linked=self?.kind==='kakao';
          managed.push({id:row.id,title:result.title||row.title,linked});
        }catch(error){
          if(error.message==='room-not-found')return;
          if(error.message==='not-host'&&!row.host)return;
          throw error;
        }
      }));
    }
    legacyMove.rooms=managed;
    if(legacyMove.active&&!legacyMove.error&&!managed.some(r=>!r.linked)&&!legacyMove.drafts){location.replace(legacyDestination());return;}
  }catch(error){legacyMove.error=error.message==='migration-incomplete'?'일부 방을 아직 연결하지 못했어요. 다시 확인하면 이어서 연결해요.':error.message==='account-check-failed'?hostAccount.error:'관리 권한을 확인하지 못해 자동 이동을 멈췄어요. 연결 상태를 확인한 뒤 다시 시도하거나 기존 주소를 계속 이용해 주세요.';}
  finally{legacyMove.busy=false;if(S.route==='legacy-move')rerender();}
}
async function linkLegacyRooms(){
  if(legacyMove.busy||hostAccount.busy)return;
  const ids=legacyMove.rooms.filter(r=>!r.linked).map(r=>r.id);if(!ids.length)return;
  if(hostAccount.uid){
    legacyMove.busy=true;legacyMove.error='';rerender();
    try{for(const roomId of ids)await hostApi('/attach',{roomId});await syncAccountRooms();}
    catch{legacyMove.error='일부 방의 연결을 완료하지 못했어요. 다시 확인하면 연결된 방을 제외하고 이어갈 수 있어요.';}
    finally{legacyMove.busy=false;}
    if(!legacyMove.error)await checkLegacyMove();else rerender();
  }else await startKakao('migration','',ids);
}
