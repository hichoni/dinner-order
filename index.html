<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script id="dn-catalog" type="application/json">{"camp":{"title":"가족캠프 저녁","place":"안동시청소년수련원","mealTime":"18:00","deadline":"17:00","date":"2026-10-24","families":["1번 가족","2번 가족","3번 가족","4번 가족","5번 가족","6번 가족","7번 가족","8번 가족","9번 가족","10번 가족","11번 가족","12번 가족","13번 가족","14번 가족","15번 가족","16번 가족","17번 가족","18번 가족","19번 가족","20번 가족"],"areaLabel":"수련원 주변 맛집"},"count":226}</script>
<script type="module">
// 메뉴 모으기 — 배달앱이 아니라 「총무의 메뉴 수합」 도구예요. 총무(방장)가 방을 만들고 링크를 보내면,
// 링크를 연 사람이 이름을 밝히고 총무가 정한 가게 안에서 먹고 싶은 메뉴를 골라 보내요(내가 쏜다면 예산 안에서).
// 총무는 고른 메뉴를 바로(실시간) 보고, 가게별로 정리된 주문 메시지를 복사해 가게에 한 번에 주문해요.
// 장바구니는 보내기 전 초안, 제출 내역은 서버에 저장된 선택이에요. 회원가입 없이 익명 로그인해요.
// 저장은 갤러리 Firebase(익명 로그인 + Firestore). 규칙은 room/rooms.rules 에 있어요.
// 주소: #r=<방 id>  (방장 열쇠까지: #r=<방 id>&k=<열쇠>)   #new = 방 만들기

const FB_CONFIG = {
  apiKey: 'AIzaSyCCjmMGxADB2vehhnEO2A0ZOivcJuCOuyQ', authDomain: 'ai-invent.firebaseapp.com', projectId: 'ai-invent',
  appId: '1:632949573389:web:adab4b24960c74bc3d9244',
};
// 테스트용: 127.0.0.1 에서 ?emu 를 붙이면 로컬 에뮬레이터에 붙어요.
const EMU = location.hostname === '127.0.0.1' && new URLSearchParams(location.search).has('emu');
// 맛집 목록: 페이지에는 캠프 정보와 가게 수만, 가게들은 처음 목록을 열 때 catalog.json 에서 받아요.
const CATALOG = (() => { try { return {stores: [], ...JSON.parse(document.getElementById('dn-catalog').textContent)}; } catch { return {stores: [], count: 0}; } })();
let catalogLoading = null;
function loadCatalog() {
  return catalogLoading ??= fetch('catalog.json').then(r => r.json()).then(d => { CATALOG.stores = d.stores || []; })
    .catch(e => { catalogLoading = null; throw e; });
}
const CAMP = CATALOG.camp || {};

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const won = n => Number(n || 0).toLocaleString('ko-KR') + '원';
const price = n => (n ? won(n) : '가격 확인');
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const clone = v => JSON.parse(JSON.stringify(v));
const rand = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join(''); };
const str = (v, max, d = '') => (typeof v === 'string' ? v.slice(0, max) : d);
const num = v => (Number.isFinite(Number(v)) ? Math.max(0, Math.round(Number(v))) : 0);

// ---------- 가게 모양 다듬기 (방 문서는 아무나 만들 수 있으니 읽을 때 늘 다듬어요) ----------
const safeImg = u => (/^https:\/\/[^\s"'<>]+$/.test(u || '') ? u : '');
const safeColor = c => (/^#[0-9a-fA-F]{3,8}$/.test(c || '') ? c : '#eef2f3');
function tidyStore(s, i = 0) {
  s = s && typeof s === 'object' ? s : {};
  const id = str(s.id, 40) || `s${i}`;
  return {
    id, name: str(s.name, 40, '가게'), emoji: str(s.emoji, 8, '🍴'), color: safeColor(s.color), category: str(s.category, 12),
    area: str(s.area, 16), minutes: num(s.minutes), phone: str(s.phone, 20), address: str(s.address, 80), photo: safeImg(str(s.photo, 400)),
    reviews: num(s.reviews), hours: str(s.hours, 80), naver: safeImg(str(s.naver, 200)), note: str(s.note, 80),
    menu: (Array.isArray(s.menu) ? s.menu : []).slice(0, 60).filter(m => m && m.id).map(m => ({
      id: str(m.id, 40), name: str(m.name, 40, '메뉴'), emoji: str(m.emoji, 8), price: num(m.price), desc: str(m.desc, 120),
      tags: Array.isArray(m.tags) ? m.tags.filter(t => ['best', 'kid', 'hot'].includes(t)) : [], img: safeImg(str(m.img, 400)),
      imgFrom: ['review', 'ref'].includes(m.imgFrom) ? m.imgFrom : '',
    })),
  };
}
// 맛집 목록 가게 → 방에 넣을 가게(필요한 칸만)
function fromCatalog(s) { return tidyStore({...s, desc: undefined}); }
function tidyRoom(d) {
  d = d && typeof d === 'object' ? d : {};
  return {
    title: str(d.title, 40, '메뉴 모으기'), note: str(d.note, 300), deadline: str(d.deadline, 20),
    names: (Array.isArray(d.names) ? d.names : []).map(n => str(n, 20)).filter(Boolean).slice(0, 120),
    freeJoin: d.freeJoin !== false, closed: d.closed === true, owner: str(d.owner, 128),
    // 🎁 내가 쏜다: 쏘는 사람과 1인 예산(원). 없으면 null
    treat: d.treat && num(d.treat.cap) > 0 ? {by: str(d.treat.by, 20, '총무') || '총무', cap: num(d.treat.cap)} : null,
    stores: (Array.isArray(d.stores) ? d.stores : []).slice(0, 20).map(tidyStore),
  };
}
const answerId = name => encodeURIComponent(name).slice(0, 400);
function tidyStoreReqs(value) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) return {};
  return Object.fromEntries(Object.entries(value).filter(([id, text]) => id.length > 0 && id.length <= 40 && typeof text === 'string').slice(0, 20).map(([id, text]) => [id, text.slice(0, 200)]));
}
function requestsForItems(value, items) {
  const ids = new Set(items.map(i => i.s));
  return Object.fromEntries(Object.entries(tidyStoreReqs(value)).filter(([id, text]) => ids.has(id) && text.trim()).map(([id, text]) => [id, text.trim()]).sort(([a], [b]) => a.localeCompare(b)));
}
function tidyAnswer(id, d) {
  d = d && typeof d === 'object' ? d : {};
  return {
    id, name: str(d.name, 20, '이름 없음'), req: str(d.req, 200), storeReqs: tidyStoreReqs(d.storeReqs), uid: str(d.uid, 128),
    at: d.at && typeof d.at.toMillis === 'function' ? d.at.toMillis() : Date.now(),
    items: (Array.isArray(d.items) ? d.items : []).slice(0, 60).filter(x => x && x.m).map(x => ({m: str(x.m, 40), n: Math.min(30, num(x.n)) || 1, name: str(x.name, 40, '메뉴'), price: num(x.price), s: str(x.s, 40)})),
  };
}

// ---------- 상태 ----------
const S = {
  route: 'home', roomId: '', room: null, answers: new Map(), host: false, loading: false, error: '',
  tab: 'menu', store: null, mfilter: 'all', menuQuery: '',
  who: '', cart: {}, req: '', storeReqs: {}, sentAt: 0,
  draft: null, catFor: 'create', catQuery: '', catArea: 'all', catCat: 'all', catPicked: new Set(),
  edit: null, sumBy: 'store', byPerson: true, sending: false, createError: '',
  homeTab: '', sums: {}, sumsLoading: false,
};
const myRooms = () => load('mm-rooms', []);
function rememberRoom(id, patch) {
  const list = myRooms().filter(r => r.id !== id), old = myRooms().find(r => r.id === id) || {};
  list.unshift({...old, id, ...patch, at: Date.now()});
  save('mm-rooms', list.slice(0, 30));
}
// 이 기기에서 보낸 주문의 이름(방마다). 방을 열면 실제 응답(uid 가 이 기기)으로 다시 맞춰요.
const sentNames = id => load('mm-sent', {})[id] || [];
function setSentNames(id, names) { const all = load('mm-sent', {}); if (names.length) all[id] = names; else delete all[id]; save('mm-sent', all); }
const roomLocal = () => load('mm-room-' + S.roomId, {});
function persistRoom() { save('mm-room-' + S.roomId, {who: S.who, cart: S.cart, req: S.req, storeReqs: S.storeReqs, sentAt: S.sentAt}); }
function persistDraft() { if (S.draft) save('mm-create-draft', S.draft); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ---------- Firebase ----------
let FB = null, DB = null, UID = '';
let booting = null;
function boot() {
  return booting ??= (async () => {
    const fb = await import('./firebase.js');
    const app = fb.initializeApp(EMU ? {...FB_CONFIG, projectId: 'demo-camp-arcade'} : FB_CONFIG);
    const auth = fb.getAuth(app);
    let db;
    try { db = fb.initializeFirestore(app, {localCache: fb.persistentLocalCache({tabManager: fb.persistentMultipleTabManager()})}); }
    catch { db = fb.initializeFirestore(app, {}); }
    if (EMU) { fb.connectAuthEmulator(auth, 'http://127.0.0.1:9099', {disableWarnings: true}); fb.connectFirestoreEmulator(db, '127.0.0.1', 8080); }
    let user = await new Promise(res => { const stop = fb.onAuthStateChanged(auth, u => { stop(); res(u); }); });
    if (!user) user = (await fb.signInAnonymously(auth)).user;
    FB = fb; DB = db; UID = user.uid;
  })().catch(e => { booting = null; throw e; });
}
function friendly(e) {
  const c = String(e && (e.code || e.message) || e);
  if (/permission/.test(c)) return '권한이 없어요. (수합이 마감됐거나, 다른 기기에서 같은 이름으로 보낸 선택이에요)';
  if (/unavailable|network|offline/i.test(c)) return '인터넷 연결을 확인해 주세요.';
  if (/operation-not-allowed|admin-restricted/.test(c)) return 'Firebase 익명 로그인이 꺼져 있어요.';
  return '잠깐 문제가 생겼어요. 다시 해 주세요.';
}
let unsub = [];
function stopListening() { for (const u of unsub) try { u(); } catch {} unsub = []; }

async function openRoom(id, key, want = '') {
  stopListening();
  Object.assign(S, {route: 'room', roomId: id, room: null, answers: new Map(), host: false, loading: true, error: '', store: null, edit: null, menuQuery: '', mfilter: 'all'});
  const local = roomLocal();
  Object.assign(S, {who: local.who || '', cart: local.cart || {}, req: str(local.req, 200), storeReqs: tidyStoreReqs(local.storeReqs), sentAt: local.sentAt || 0, tab: local.who ? 'menu' : 'who'});
  render();
  try {
    await boot();
    const hostRef = FB.doc(DB, 'dinnerRooms', id, 'hosts', UID);
    let isHost = false;
    try { isHost = (await FB.getDoc(hostRef)).exists(); } catch {}
    const mine = myRooms().find(r => r.id === id);
    key = key || (mine && mine.key) || '';
    if (!isHost && key) {
      try { await FB.setDoc(hostRef, {key, at: FB.serverTimestamp()}); isHost = true; } catch {}
    }
    S.host = isHost;
    if (isHost && key) rememberRoom(id, {key, host: true});
    let first = true;
    unsub.push(FB.onSnapshot(FB.doc(DB, 'dinnerRooms', id), snap => {
      if (S.roomId !== id) return;
      if (!snap.exists()) { S.room = null; S.loading = false; S.error = 'gone'; render(); return; }
      S.room = tidyRoom(snap.data()); S.loading = false;
      rememberRoom(id, S.host ? {title: S.room.title, host: true} : {title: S.room.title});
      if (first && want && (want === 'mine' || S.host)) S.tab = want;
      else if (first && S.host && !S.who) S.tab = 'sum';
      if (first && S.created) setTimeout(() => confetti(document.querySelector('.share-card .sc-ic')), 250);
      first = false;
      reindex(); keepView();
    }, e => { S.loading = false; S.error = /permission/.test(String(e && e.code)) ? '방 기능이 아직 켜지지 않았어요(Firebase 규칙 게시 전이에요). 총무에게 알려 주세요.' : friendly(e); render(); }));
    let firstAnswers = true;

}

  const bits = Array.from({length: 80}, () => ({x: r.left + r.width / 2, y: r.top + r.height / 2, vx: (Math.random() - .5) * 10, vy: -Math.random() * 10 - 3, s: 5 + Math.random() * 5, c: colors[Math.floor(Math.random() * colors.length)], a: Math.random() * 6}));

  } catch {}
  return false;
}

  }
  return `<article class="room-card"><a class="rc-main" href="#r=${esc(r.id)}&t=mine"><span class="rr-ic">🙋</span><span class="rr-txt"><b>${title}</b><span class="rc-chips">${status}</span>
    <small class="rc-names">${names.length ? `보낸 이름: ${names.map(esc).join(', ')}` : '아직 보낸 선택 없음'}</small></span><span class="rr-go">›</span></a>
    ${sum && sum.gone ? `<div class="rc-acts"><button data-act="card-forget" data-id="${esc(r.id)}">목록에서 빼기</button></div>` : ''}</article>`;

// 첫 화면의 방 상태(제목·마감·응답 수)를 한 번 읽어 와요.
async function loadSums(rooms) {
  S.sumsLoading = true;
  try {
    await boot();
    await Promise.all(rooms.map(async r => {
      try {
        const snap = await FB.getDoc(FB.doc(DB, 'dinnerRooms', r.id));
        if (!snap.exists()) { S.sums[r.id] = {gone: true}; return; }
        const d = tidyRoom(snap.data()), sum = {title: d.title, closed: d.closed, deadline: d.deadline, treat: d.treat, answers: null};
        if (r.host) { try { sum.answers = (await FB.getDocs(FB.collection(DB, 'dinnerRooms', r.id, 'answers'))).size; } catch {} }
        S.sums[r.id] = sum;
      } catch { S.sums[r.id] = {title: r.title, closed: false, answers: null, err: true}; }
    }));
  } catch {}
  S.sumsLoading = false;
  if (S.route === 'home') rerender();
}

function totals() {
  const groups = new Map();
  for (const a of S.answers.values()) {
    for (const it of a.items) {
      if (!groups.has(it.s)) groups.set(it.s, {store: storeOf(it.s) || {id: it.s, name: '(지운 가게)', phone: '', emoji: '🍴', color: '#eef2f3', menu: []}, items: new Map(), who: new Map(), sum: 0});
      const g = groups.get(it.s);
      const k = it.m, row = g.items.get(k) || {name: it.name, n: 0, price: it.price};
      row.n += it.n; g.items.set(k, row); g.sum += it.price * it.n;

function openItem(id) {

  closeSheet();
  const bg = document.createElement('div');
  bg.className = 'sheet-bg'; bg.id = 'sheet';
  const pic = it.img || it.emoji;
  const draw = () => {
    bg.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(it.name)}"><button class="sheet-x" data-act="item-close" aria-label="닫기">✕</button>

      <button class="btn block" data-act="sheet-add" data-id="${esc(id)}">${it.price ? `${won(it.price * q)} ` : ''}${S.cart[id] ? `${q}개로 바꾸기` : `${q}개 고르기`}</button></div></div>`;
  };
  bg.addEventListener('click', e => {

function roomDoc(d) {

    title: d.title.trim().slice(0, 40), note: (d.note || '').trim().slice(0, 300), deadline: (d.deadline || '').slice(0, 20),
    names: d.names, freeJoin: !!d.freeJoin, stores: d.stores.map(s => tidyStore(s)),

async function createRoom() {
  const d = S.draft;
  if (!d.title.trim() || !d.stores.length || S.sending) return;
  if (d.treat && !(num(d.treat.cap) > 0)) { toast('🎁 1인 예산을 적어 주세요'); document.getElementById('c-treat-cap')?.focus(); return; }
  if (d.mode === 'list' && !parseNames(d.names).length) { toast('참여할 이름을 한 명 이상 적어 주세요'); document.getElementById('c-names')?.focus(); return; }
  S.sending = true; S.createError = ''; persistDraft(); rerender();
  try {
    await boot();
    const id = rand(12), key = rand(32);
    const b = FB.writeBatch(DB);
    b.set(FB.doc(DB, 'dinnerRoomKeys', id), {key});
    b.set(FB.doc(DB, 'dinnerRooms', id, 'hosts', UID), {key, at: FB.serverTimestamp()});
    b.set(FB.doc(DB, 'dinnerRooms', id), {
      v: 1, owner: UID, ...roomDoc({...d, treat: d.treat || undefined, names: d.mode === 'list' ? parseNames(d.names) : [], freeJoin: d.mode === 'free' || d.freeJoin}),
      closed: false, createdAt: FB.serverTimestamp(), updatedAt: FB.serverTimestamp(),
    });
    await b.commit();
    rememberRoom(id, {key, host: true, title: d.title.trim()});
    S.sending = false; S.draft = null; save('mm-create-draft', null); S.created = true;
    location.hash = `r=${id}`; // hashchange 가 방을 열어요
  } catch (e) {
    S.sending = false;
    S.createError = /permission/.test(String(e && e.code)) ? '방 생성 연결을 확인하지 못했어요. 잠시 후 다시 시도해 주세요. 계속되면 서비스 관리자에게 알려 주세요.' : friendly(e);
    persistDraft(); rerender(); scrollTo(0, 0);
  }
}
async function sendAnswer() {

  captureRequests();
  S.sending = true; rerender();
  try {
    await FB.setDoc(FB.doc(DB, 'dinnerRooms', S.roomId, 'answers', answerId(S.who)), {
      name: S.who, req: S.req, storeReqs: draftStoreReqs(), uid: UID, at: FB.serverTimestamp(),
      items: lines.map(l => ({m: l.item.id, n: l.n, name: l.item.name, price: l.item.price, s: l.item.store.id})),
    });
    S.sending = false; S.sentAt = Date.now(); persistRoom();
    setSentNames(S.roomId, [...new Set([...sentNames(S.roomId), S.who])]);

    toast(/permission/.test(String(e && e.code)) ? (S.room.closed ? '총무가 수합을 마감했어요.' : `「${S.who}」 이름으로 다른 기기에서 이미 보냈어요. 그 기기에서 고치거나 총무에게 말해 주세요.`) : friendly(e));
  }
}

  try {
    await FB.updateDoc(FB.doc(DB, 'dinnerRooms', S.roomId), {...roomDoc({...e, names: parseNames(e.namesText), treat: e.treat || (S.room.treat ? null : undefined)}), updatedAt: FB.serverTimestamp()});
    S.sending = false; S.edit = null; toast('저장했어요. 링크를 연 사람들 화면도 바로 바뀌어요');
    rerender();
  } catch (err) { S.sending = false; rerender(); toast(friendly(err)); }
}
async function hostUpdate(fields, msg) {
  try { await FB.updateDoc(FB.doc(DB, 'dinnerRooms', S.roomId), {...fields, updatedAt: FB.serverTimestamp()}); if (msg) toast(msg); }
  catch (e) { toast(friendly(e)); }
}
function confirmTwice(el, msg) {
  if (el.dataset.armed) return true;
  el.dataset.armed = '1'; const old = el.textContent; el.textContent = msg;
  setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = old; } }, 3000);
  return false;
}
function setWho(name, tab) {
  name = String(name || '').trim().replace(/\s+/g, ' ').slice(0, 20);
  if (!name) { toast('이름을 적어 주세요'); return; }
  const r = S.room;
  if (r.names.length && !r.freeJoin && !r.names.includes(name)) { toast('명단에 있는 이름만 고를 수 있어요'); return; }
  if (name !== S.who) {
    S.who = name;
    const a = S.answers.get(answerId(name));
    S.cart = a ? Object.fromEntries(a.items.filter(i => ITEMS.has(i.m)).map(i => [i.m, i.n])) : {};
    S.req = a ? a.req : '';
    S.storeReqs = tidyStoreReqs(a?.storeReqs);
  }
  persistRoom();
  rememberRoom(S.roomId, {title: r.title});
  go({tab: tab || (myAnswer() ? 'mine' : 'menu')});
}
function pickedFromCatalog() {
  const by = new Map(CATALOG.stores.map(s => [s.id, s]));
  return [...S.catPicked].map(id => by.get(id)).filter(Boolean).map(fromCatalog);
}

// ---------- 버튼 ----------
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'home':
      e.preventDefault();
      if (S.route === 'room' && S.tab === 'set' && S.edit?.dirty) { toast('바꾼 내용을 저장하거나 되돌려 주세요'); return; }
      stopListening(); location.hash = ''; go({route: 'home'}); break;
    case 'new':
      S.draft = S.draft || load('mm-create-draft', null) || EMPTY_DRAFT();
      if (location.hash === '#new') go({route: 'create'}); else location.hash = 'new';
      break;
    case 'retry': openRoom(S.roomId); break;
    case 'home-tab': S.homeTab = el.dataset.t; rerender(); break;
    case 'pin-toggle': S.pinOpen = !S.pinOpen; rerender(); break;
    case 'cap-chip': {
      const target = el.dataset.for === 'c' ? S.draft.treat : S.edit && S.edit.treat;
      if (!target) break;
      target.cap = Number(el.dataset.v);
      if (el.dataset.for === 'e') S.edit.dirty = true;
      rerender(); break;
    }
    case 'card-forget': save('mm-rooms', myRooms().filter(r => r.id !== id)); delete S.sums[id]; rerender(); break;
    case 'card-share': {
      const r = myRooms().find(x => x.id === id), sum = S.sums[id] || {};
      shareOrCopy({title: sum.title || r?.title || '메뉴 모으기', deadline: sum.deadline || '', treat: sum.treat || null}, id, 'inviteBox'); break;
    }
    case 'mode': S.draft.mode = el.dataset.m; rerender(); break;
    case 'names-camp': S.draft.names = (CAMP.families || []).join('\n'); rerender(); break;
    case 'draft-del': S.draft.stores = S.draft.stores.filter(s => s.id !== id); rerender(); break;
    case 'custom-open':
      if (el.dataset.for === 'c') S.draft.customOpen = !S.draft.customOpen; else S.editCustomOpen = !S.editCustomOpen;
      rerender(); document.getElementById(`${el.dataset.for}-cname`)?.focus(); break;
    case 'custom-add': {
      const p = el.dataset.for, name = document.getElementById(`${p}-cname`).value.trim(), text = document.getElementById(`${p}-clines`).value;
      const sid = 'c' + rand(6), menu = parseMenu(text, sid);
      if (!name) { toast('가게 이름을 적어 주세요'); return; }
      if (!menu.length) { toast('메뉴를 한 줄에 하나씩 적어 주세요'); return; }
      const s = tidyStore({id: sid, name, emoji: /카페|커피|cafe|coffee|스타벅스|투썸|이디야|메가|빽다방|컴포즈/i.test(name) ? '☕' : '🍽️', color: '#eaf6f4', category: '', menu});
      if (p === 'c') { S.draft.stores.push(s); S.draft.custom = {name: '', lines: ''}; S.draft.customOpen = false; }
      else { S.edit.stores.push(s); S.editCustom = {name: '', lines: ''}; S.editCustomOpen = false; S.edit.dirty = true; }
      rerender(); toast(`${name} 메뉴 ${menu.length}개를 넣었어요`); break;
    }
    case 'catalog': {
      const label = el.textContent;
      try { el.disabled = true; el.textContent = '불러오는 중…'; await loadCatalog(); } catch { el.disabled = false; el.textContent = label; toast('맛집 목록을 못 불러왔어요. 인터넷 연결을 확인해 주세요'); return; }
      S.catFor = el.dataset.for;
      const have = (S.catFor === 'create' ? S.draft.stores : S.edit.stores).map(s => s.id);
      S.catPicked = new Set(have.filter(x => CATALOG.stores.some(s => s.id === x)));
      go({route: 'catalog'}); break;
    }
    case 'cat-area': S.catArea = el.dataset.a; rerender(); break;
    case 'cat-cat': S.catCat = el.dataset.c; rerender(); break;
    case 'cat-pick': {
      if (el.checked) S.catPicked.add(id); else S.catPicked.delete(id);
      el.closest('.prow').classList.toggle('on', el.checked);
      document.getElementById('catDone').textContent = `${S.catPicked.size}곳 넣기`; break;
    }
    case 'cat-back': case 'cat-done': {
      if (act === 'cat-done') {
        const target = S.catFor === 'create' ? S.draft : S.edit;
        const custom = target.stores.filter(s => !CATALOG.stores.some(c => c.id === s.id));
        const kept = target.stores.filter(s => S.catPicked.has(s.id)); // 이미 넣은 가게는 고친 그대로
        const added = pickedFromCatalog().filter(s => !kept.some(k => k.id === s.id));
        target.stores = [...kept, ...added, ...custom];
        if (S.catFor === 'room') S.edit.dirty = true;
      }
      go(S.catFor === 'create' ? {route: 'create'} : {route: 'room', tab: 'set'}); break;
    }
    case 'create': createRoom(); break;
    // 방 안
    case 'tab': {
      const t = el.dataset.t;
      if (S.tab === 'set' && S.edit?.dirty && t !== 'set') { toast('바꾼 내용을 저장하거나 되돌려 주세요'); return; }
      if (['menu', 'cart', 'mine'].includes(t) && !S.who) { go({tab: 'who'}); return; }
      go({tab: t, created: false}); break;
    }
    case 'who': setWho(el.dataset.who); break;
    case 'who-typed': setWho(document.getElementById('whoName').value); break;
    case 'store': go({tab: 'store', store: id, mfilter: 'all', menuQuery: ''}); break;
    case 'mfilter': S.mfilter = el.dataset.f; rerender(); break;
    case 'menu-search-clear': case 'menu-search-reset': {
      S.menuQuery = ''; if (act === 'menu-search-reset') S.mfilter = 'all';
      const input = document.getElementById('menuSearch'); input.value = ''; refreshMenuSearch(); input.focus(); break;
    }
    case 'plus': case 'minus': {
      if (act === 'plus' && !fitsBudget(id, (S.cart[id] || 0) + 1)) { overBudgetToast(); break; }
      setQty(id, (S.cart[id] || 0) + (act === 'plus' ? 1 : -1)); rerender();
      if (act === 'plus') { bumpCart(); if (S.cart[id] === 1) toast(`✅ ${ITEMS.get(id).name} 골랐어요`); }
      break;
    }
    case 'item': openItem(id); break;
    case 'item-close': closeSheet(); break;
    case 'sheet-add': {
      const q = Number(document.querySelector('#sheet .sheet-qty b')?.textContent) || 1, had = S.cart[id] || 0;
      if (!fitsBudget(id, q)) { overBudgetToast(); break; }
      setQty(id, q); closeSheet(); rerender(); bumpCart();
      toast(had ? `✅ ${ITEMS.get(id).name} ${q}개로 바꿨어요` : `✅ ${ITEMS.get(id).name} ${q}개 골랐어요`); break;
    }
    case 'quick-req': {
      captureRequests();
      const t = el.dataset.t, parts = str(S.storeReqs[id], 200).split(/\s*,\s*/).filter(Boolean);
      setStoreRequest(id, (parts.includes(t) ? parts.filter(p => p !== t) : [...parts, t]).join(', '));
      persistRoom(); rerender(); break;
    }
    case 'review': captureRequests(); go({tab: 'review'}); break;
    case 'send': if (S.tab === 'review') sendAnswer(); break;
    case 'edit-mine': {
      const name = el.dataset.who;
      if (name && name !== S.who) { S.who = ''; setWho(name, 'cart'); } else go({tab: 'cart'});
      break;
    }
    case 'answer-del': {
      if (!confirmTwice(el, '한 번 더 누르면 취소해요')) break;
      const name = el.dataset.who || S.who;
      try { await FB.deleteDoc(FB.doc(DB, 'dinnerRooms', S.roomId, 'answers', answerId(name))); toast(`「${name}」 선택을 취소했어요`); } catch (err) { toast(friendly(err)); }
      break;
    }
    case 'answer-del-host': {
      if (!confirmTwice(el, '한 번 더 누르면 지워요')) break;
      try { await FB.deleteDoc(FB.doc(DB, 'dinnerRooms', S.roomId, 'answers', id)); } catch (err) { toast(friendly(err)); }
      break;
    }
    case 'sum-by': S.sumBy = el.dataset.by; rerender(); break;
    case 'by-person': {
      const opened = [...document.querySelectorAll('.message-preview')].map(d => d.open);
      S.byPerson = el.checked; rerender();
      document.querySelectorAll('.message-preview').forEach((d, i) => { d.open = !!opened[i]; });
      break;
    }
    case 'copy': copyOrShow(el.dataset.text, el.dataset.msg || '복사했어요', ''); break;
    case 'copy-invite': shareOrCopy(S.room, S.roomId, 'inviteBox'); break;
    case 'copy-remind': copyOrShow(document.getElementById('remindText').value, '📣 재촉 글을 복사했어요', 'remindBox'); break;
    case 'copy-owner': copyOrShow(ownerMessage(totals()[Number(el.dataset.i)]), '📋 가게 주문 메시지를 복사했어요. 가게에 그대로 보내면 돼요', 'ownerBox' + el.dataset.i); break;
    case 'copy-host': {
      const key = myRooms().find(r => r.id === S.roomId)?.key;
      if (!key) { toast('이 기기에는 총무 열쇠가 없어요. 방을 만든 기기에서 복사해 주세요'); return; }
      copyOrShow(`${roomLink()}&k=${key}`, '👑 총무 링크를 복사했어요. 총무끼리만 나눠 주세요', 'hostBox'); break;
    }
    case 'print': try { print(); } catch { toast('이 화면에서는 인쇄가 안 돼요'); } break;
    case 'toggle-close': hostUpdate({closed: !S.room.closed}, S.room.closed ? '다시 열었어요' : '수합을 마감했어요'); break;
    case 'edit-save': saveEdit(); break;
    case 'edit-cancel': S.edit = null; S.editCustomOpen = false; rerender(); break;
    case 'edit-menu-del': { for (const s of S.edit.stores) s.menu = s.menu.filter(m => m.id !== id); S.edit.dirty = true; rerender(); break; }
    case 'edit-menu-add': {
      const s = S.edit.stores.find(x => x.id === id);
      s.menu.push({id: `${s.id}-m${rand(4)}`, name: '새 메뉴', emoji: '', price: 0, desc: '', tags: [], img: ''});
      S.edit.dirty = true; rerender();
      const det = [...document.querySelectorAll('.store-edit')].find(d => d.querySelector(`[data-act="edit-menu-add"][data-id="${CSS.escape(id)}"]`));
      if (det) { det.open = true; det.querySelector('.edit-row:last-of-type input')?.select(); }
      break;
    }
    case 'edit-store-del': { S.edit.stores = S.edit.stores.filter(s => s.id !== id); S.edit.dirty = true; rerender(); break; }
    case 'room-del': {
      if (!confirmTwice(el, '정말요? 한 번 더 누르면 지워요')) break;
      try {
        await FB.deleteDoc(FB.doc(DB, 'dinnerRooms', S.roomId));
        save('mm-rooms', myRooms().filter(r => r.id !== S.roomId));
        stopListening(); location.hash = ''; toast('방을 지웠어요');
      } catch (err) { toast(friendly(err)); }
      break;
    }
  }
  if (S.route === 'create' || S.route === 'catalog') persistDraft();
});
// 입력칸
document.addEventListener('input', e => {
  const t = e.target;
  if (S.route === 'create' && S.draft) {
    if (t.id === 'c-title') { S.draft.title = t.value; const b = document.querySelector('[data-act=create]'); const can = t.value.trim() && S.draft.stores.length; b.disabled = !can; b.textContent = can ? '방 만들고 링크 받기' : t.value.trim() ? '가게를 넣어 주세요' : '방 이름을 적어 주세요'; }
    if (t.id === 'c-note') S.draft.note = t.value;
    if (t.id === 'c-deadline') S.draft.deadline = t.value;
    if (t.id === 'c-names') { S.draft.names = t.value; const h = document.querySelector('.name-tools .hint'); if (h) h.textContent = `${parseNames(t.value).length}명`; }
    if (t.id === 'c-free') S.draft.freeJoin = t.checked;
    if (t.id === 'c-treat') { S.draft.treat = t.checked ? {by: '', cap: 10000} : null; rerender(); return; }
    if (t.id === 'c-treat-by') S.draft.treat.by = t.value;
    if (t.id === 'c-treat-cap') { S.draft.treat.cap = num(t.value); for (const b of document.querySelectorAll('.cap-chips button')) b.classList.toggle('on', Number(b.dataset.v) === S.draft.treat.cap); }
    if (t.id === 'c-cname') S.draft.custom.name = t.value;
    if (t.id === 'c-clines') S.draft.custom.lines = t.value;
    persistDraft(); return;
  }
  if (t.id === 'catSearch') { S.catQuery = t.value; document.getElementById('catList').innerHTML = catalogList(); return; }
  if (t.id === 'menuSearch') { S.menuQuery = t.value.slice(0, 80); refreshMenuSearch(); return; }
  if (t.id === 'req' || t.dataset.storeReq) {
    if (t.dataset.storeReq) setStoreRequest(t.dataset.storeReq, t.value); else S.req = t.value.slice(0, 200);
    persistRoom();
    if (t.dataset.storeReq) for (const b of t.closest('.store-request').querySelectorAll('[data-act="quick-req"]')) { const on = t.value.split(/\s*,\s*/).includes(b.dataset.t); b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); }
    const status = document.getElementById('selectionStatus'); if (status) status.outerHTML = selectionStatus();
    const nav = document.querySelector('.nav'); if (nav) nav.outerHTML = roomNav();
    const bar = document.querySelector('.cartbar');
    if (bar) { bar.dataset.act = cartIsSent() ? 'tab' : 'review'; bar.dataset.t = 'mine'; bar.querySelector('.sp').textContent = cartIsSent() ? '제출 내역 보기' : '요청사항 확인하고 보내기'; }
    return;
  }
  if (t.id === 'e-cname' || t.id === 'e-clines') { S.editCustom = S.editCustom || {name: '', lines: ''}; S.editCustom[t.id === 'e-cname' ? 'name' : 'lines'] = t.value; return; }
  if (S.edit && t.id === 'e-treat') { S.edit.treat = t.checked ? (S.room.treat ? {...S.room.treat} : {by: '', cap: 10000}) : null; S.edit.dirty = true; rerender(); return; }
  if (S.edit && t.id === 'e-treat-by') { S.edit.treat.by = t.value; markDirtySoft(); return; }
  if (S.edit && t.id === 'e-treat-cap') { S.edit.treat.cap = num(t.value); markDirtySoft(); return; }
  if (S.edit && t.dataset.e) { S.edit[t.dataset.e] = t.type === 'checkbox' ? t.checked : t.value; markDirtySoft(); return; }
  if (S.edit && t.dataset.em) {
    for (const s of S.edit.stores) for (const m of s.menu) if (m.id === t.dataset.em) m[t.dataset.f] = t.dataset.f === 'price' ? num(t.value) : t.value;
    markDirtySoft();
  }
});
// 글자를 적는 동안에는 다시 그리지 않고, 저장 막대만 띄워요.
function markDirtySoft() {
  if (S.edit.dirty) return;
  S.edit.dirty = true;
  const nav = document.querySelector('.nav');
  (nav || $app).insertAdjacentHTML(nav ? 'beforebegin' : 'beforeend', `<div class="bottom-bar save-bar"><button class="btn gray" data-act="edit-cancel">되돌리기</button><button class="btn" style="flex:1" data-act="edit-save">바꾼 내용 저장</button></div>`);
}
document.addEventListener('change', e => { if (e.target.dataset.e === 'freeJoin' && S.edit) { S.edit.freeJoin = e.target.checked; markDirtySoft(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && e.target.id === 'menuSearch') { e.preventDefault(); S.menuQuery = ''; e.target.value = ''; refreshMenuSearch(); return; }
  if (e.key === 'Escape' && document.getElementById('sheet')) { closeSheet(); return; }
  if (e.key === 'Enter' && e.target.id === 'whoName') document.querySelector('[data-act="who-typed"]')?.click();
});

// ---------- 주소 ----------
function route() {
  // 예전 「링크로 보내기」 판(#s=…)은 classic.html 로 보내요.
  if (/^#s=/.test(location.hash)) { location.replace('classic.html' + location.hash); return; }
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (location.hash === '#new') { S.draft = S.draft || load('mm-create-draft', null) || EMPTY_DRAFT(); stopListening(); go({route: 'create'}); return; }
  const id = (h.get('r') || '').replace(/[^a-z0-9]/gi, '').slice(0, 40);
  if (id) {
    const key = (h.get('k') || '').replace(/[^a-z0-9]/gi, '').slice(0, 64);
    // 방장 열쇠는 주소창에서 바로 지워요(실수로 그대로 공유하지 않게). 이 기기에는 기억해요.
    const want = ['sum', 'set', 'mine'].includes(h.get('t')) ? h.get('t') : '';
    if (key || want) { if (key) rememberRoom(id, {key}); history.replaceState(null, '', `#r=${id}`); }
    if (id !== S.roomId || S.route !== 'room') openRoom(id, key, want);
    else if (want) go({tab: want});
    return;
  }
  stopListening(); S.roomId = '';
  if (S.route !== 'catalog') go({route: 'home'});
}
addEventListener('hashchange', route);
route();
setInterval(() => { if (S.route === 'room' && S.room && S.room.deadline && !document.querySelector('input:focus,textarea:focus')) { const c = document.querySelector('.rh-meta'); if (c) rerender(); } }, 60000);
</script>
