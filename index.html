  appSceneMotion.animations.clear();
}
function trackSceneAnimation(node,frames,options) {
  if(typeof node?.animate!=='function')return;
  try{
    const animation=node.animate(frames,options);appSceneMotion.animations.add(animation);
    const finish=()=>appSceneMotion.animations.delete(animation);
    animation.finished?.then(finish,finish);
  }catch{/* The final static state is already rendered. */}
}
function animateAppScene(key,editing=false) {
  const changed=key!==appSceneMotion.key;cancelSceneMotion();appSceneMotion.key=key;
  if(!changed||editing||reduceMotion())return;
  const generation=appSceneMotion.generation;
  requestAnimationFrame(()=>{
    if(generation!==appSceneMotion.generation||reduceMotion())return;
    // Avoid moving keyboard-docked controls while the software keyboard is up.
    if(typeof visualViewport!=='undefined'&&visualViewport?.height<innerHeight-120)return;
    const container=$app.querySelector?.('.wrap,.land-main,.operator-page');
    if(!container)return;
    trackSceneAnimation(container,[{opacity:.96,transform:'translate3d(0,6px,0)'},{opacity:1,transform:'translate3d(0,0,0)'}],{duration:190,easing:'cubic-bezier(.2,.8,.2,1)'});
    let count=0;
    for(const card of container.querySelectorAll?.('.neighborhood-choice,.prow,.menu,.room-card,.who-grid>button')||[]){
      const rect=card.getBoundingClientRect();if(rect.bottom<0||rect.top>innerHeight)continue;
      trackSceneAnimation(card,[{opacity:.9,transform:'translate3d(0,4px,0)'},{opacity:1,transform:'translate3d(0,0,0)'}],{duration:210,delay:Math.min(count*16,64),easing:'cubic-bezier(.2,.8,.2,1)'});

}

  const x=event.clientX,y=event.clientY;if(!Number.isFinite(x)||!Number.isFinite(y))return;
  appSceneMotion.tap?.animation?.cancel();appSceneMotion.tap?.node.remove();
  const pulse=document.createElement('span');pulse.className='app-tap-pulse';pulse.setAttribute('aria-hidden','true');pulse.style.left=x+'px';pulse.style.top=y+'px';document.body.appendChild(pulse);

}

const APP_BUILD = document.querySelector('meta[name="damatda-build"]')?.content || '';

const validAppBuild = value => typeof value === 'string' && /^[a-f0-9]{16}$/.test(value);

    if (!response.ok) return;
    const release = await response.json();
    if (release.schema !== 1 || !validAppBuild(release.build)) return;
    if (release.build === APP_BUILD) { appUpdate.next=''; appUpdate.changes=[]; renderAppUpdate(); return; }

async function finishLegacyReceipt(){
  let migrationId=sessionStorage.getItem('dinner-migration');if(!migrationId&&!hostAccount.uid)return;
  let changed=false;
  for(let attempt=0;attempt<50;attempt++){
    const result=await hostApi('/migrate-rooms',migrationId?{migrationId}:{});
    changed ||= !!(result.linked?.length||result.skipped?.length);
    for(const id of result.skipped||[]){legacyMove.skipped.add(id);rememberRoom(id,{host:false,key:'',role:''});}
    if(result.errors?.length)throw Error('migration-incomplete');
    if(!result.remaining){sessionStorage.removeItem('dinner-migration');if(changed)await syncAccountRooms();return;}
    if(!result.linked?.length&&!result.skipped?.length)throw Error('migration-incomplete');
  }
  throw Error('migration-incomplete');
}
async function checkLegacyMove(){
  if(installPreview()){legacyMove.error='미리보기예요. 실제 계정 연결과 이동은 이전 운영 주소에서 진행해 주세요.';rerender();return;}
  if(legacyMove.busy)return;
  Object.assign(legacyMove,{active:true,busy:true,error:''});S.route='legacy-move';render();
  try{
    const saved=legacyStorage('mm-rooms')||[];
    if(!Array.isArray(saved))throw Error('storage-unavailable');
    const known=new Map(saved.filter(r=>/^[a-z0-9]{1,64}$/i.test(r?.id||'')).map(r=>[r.id,r]));
    const id=new URLSearchParams(legacyMove.hash.replace(/^#/, '')).get('r');
    if(/^[a-z0-9]{1,64}$/i.test(id||'')&&!known.has(id))known.set(id,{id,title:'현재 링크의 방'});
    legacyMove.drafts=legacyDrafts([...known.values()]);
    await initHostAccount({deferView:true});
    if(hostAccount.error)throw Error('account-check-failed');
    await finishLegacyReceipt();
    const managed=[];
    const rows=[...known.values()];
    for(let offset=0;offset<rows.length;offset+=5){
      await Promise.all(rows.slice(offset,offset+5).map(async row=>{
        if(legacyMove.skipped.has(row.id))return;
        try{
          const result=await managerApi('/managers',{roomId:row.id}),self=result.members.find(p=>p.self);
          const linked=self?.kind==='kakao';
          managed.push({id:row.id,title:result.title||row.title,linked});
        }catch(error){
          if(error.message==='room-not-found')return;
          if(error.message==='not-host'&&!row.host)return;
          throw error;
        }
      }));
    }
    legacyMove.rooms=managed;
    if(legacyMove.active&&!legacyMove.error&&!managed.some(r=>!r.linked)&&!legacyMove.drafts){location.replace(legacyDestination());return;}
  }catch(error){legacyMove.error=error.message==='migration-incomplete'?'일부 방을 아직 연결하지 못했어요. 다시 확인하면 이어서 연결해요.':error.message==='account-check-failed'?hostAccount.error:'관리 권한을 확인하지 못해 자동 이동을 멈췄어요. 연결 상태를 확인한 뒤 다시 시도하거나 기존 주소를 계속 이용해 주세요.';}
  finally{legacyMove.busy=false;if(S.route==='legacy-move')rerender();}
}
async function linkLegacyRooms(){

  if(hostAccount.uid){
    legacyMove.busy=true;legacyMove.error='';rerender();
    try{for(const roomId of ids)await hostApi('/attach',{roomId});await syncAccountRooms();}
    catch{legacyMove.error='일부 방의 연결을 완료하지 못했어요. 다시 확인하면 연결된 방을 제외하고 이어갈 수 있어요.';}
    finally{legacyMove.busy=false;}
    if(!legacyMove.error)await checkLegacyMove();else rerender();
  }else await startKakao('migration','',ids);
}

function applyRoomManagers(result,id) {

  const changed=!!S.hostKey&&result.key&&S.hostKey!==result.key;

async function refreshRoomManagers(render=true) {
  if(!S.host||!S.roomId)return;
  if(roomManagers.loading||roomManagers.busy){roomManagers.refreshAgain=true;return;}
  const id=S.roomId,uid=UID,request=++managerRequest;
  roomManagers.roomId=id;roomManagers.loading=true;roomManagers.error='';
  try{const result=await managerApi('/managers',{roomId:id});if(request===managerRequest&&uid===UID)applyRoomManagers(result,id);}
  catch(error){if(request===managerRequest){if(error.message==='not-host')forgetHostAccess(id);else roomManagers.error=managementError(error);}}
  finally{
    if(request===managerRequest){roomManagers.loading=false;if(roomManagers.refreshAgain&&S.host){roomManagers.refreshAgain=false;refreshRoomManagers(render);}}
    if(render&&S.roomId===id&&S.route==='room')keepView();
  }

async function startKakao(intent='home',roomId='',migrationRooms,requestNickname=false) {

  if(S.edit?.dirty||S.sending){toast('바꾼 내용을 먼저 저장해 주세요');return;}
  hostAccount.busy=true;hostAccount.error='';rerender();
  try {
    await boot();
    if(S.roomId)persistRoom();persistDraft();
    if(!hostAccount.uid&&!migrationRooms){
      // Signing in replaces an anonymous identity. Preserve every known managed room first.
      const ids=[...new Set([...myRooms().map(r=>r.id),roomId].filter(id=>/^[a-z0-9]{1,64}$/i.test(id||'')))],owned=[];
      for(let offset=0;offset<ids.length;offset+=5)await Promise.all(ids.slice(offset,offset+5).map(async id=>{
        try{const info=await managerApi('/managers',{roomId:id});if(info.members.find(m=>m.self)?.kind==='device')owned.push(id);}
        catch(error){if(!['not-host','room-not-found'].includes(error.message))throw error;}
      }));
      if(owned.length)migrationRooms=owned;
    }
    const verifier=[...crypto.getRandomValues(new Uint8Array(32))].map(x=>x.toString(16).padStart(2,'0')).join('');
    const proof=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)))].map(x=>x.toString(16).padStart(2,'0')).join('');
    const pending={verifier,intent,roomId,returnHash:intent==='operator'?'#operator':intent==='migration'?legacyMove.hash:intent==='arrival'?location.hash:roomId?`#r=${roomId}&t=set`:'',at:Date.now()};
    // Require session storage before leaving. A browser change must never silently link another session.
    sessionStorage.setItem('dinner-kakao',JSON.stringify(pending));
    const result=await hostApi('/start',{proof,roomId:roomId||undefined,...(migrationRooms?{migrationRooms}:{}),...(requestNickname?{requestNickname:true}:{})});
    pending.state=result.state;sessionStorage.setItem('dinner-kakao',JSON.stringify(pending));
    location.assign(result.url);
  } catch(error){hostAccount.error=authError(error);hostAccount.busy=false;rerender();}
}

async function initHostAccount({deferView=false}={}) {
  if(installPreview()||EMU)return;
  hostAccount.error='';
  const query=new URLSearchParams(location.search),isCallback=query.has('state')&&(query.has('code')||query.has('error'));
  let pending=null;
  if(isCallback){
    try{pending=JSON.parse(sessionStorage.getItem('dinner-kakao'));}catch{}
    // Remove authorization data before rendering or issuing any requests.
    history.replaceState(null,'',location.pathname+(pending?.returnHash||''));
  }
  try{
    if(isCallback){
      if(query.has('error'))throw Error('login-cancelled');
      if(!pending||pending.state!==query.get('state')||Date.now()-pending.at>600000)throw Error('expired-login');
      const result=await hostApi('/complete',{code:query.get('code'),state:pending.state,verifier:pending.verifier},false);
      if(result.migrationId)sessionStorage.setItem('dinner-migration',result.migrationId);
      await boot();stopListening();
      const credential=await FB.signInWithCustomToken(AUTH,result.customToken);
      UID=credential.user.uid;hostAccount.uid=UID;await checkMenuOperator();
      await syncAccountRooms();
      if(!deferView)await finishLegacyReceipt();
      if(result.linkError)hostAccount.error='로그인은 완료했지만 이 방의 연결을 완료하지 못했어요. 관리 링크로 다시 열어 연결해 주세요.';
      sessionStorage.removeItem('dinner-kakao');
      if(deferView){legacyMove.hash=pending.returnHash||legacyMove.hash;return;}
      if(pending.intent==='operator'){location.hash='operator';await openMenuOperator();return;}
      if(pending.intent==='arrival'){route();return;}
      if(pending.intent==='new'){guestCreateAllowed=false;location.hash='new';await beginCreate();return;}
      if(pending.roomId){await openRoom(pending.roomId,undefined,'set');return;}
      go({route:'home'});return;
    }
    await boot();if(hostAccount.uid){await syncAccountRooms();if(!deferView)await finishLegacyReceipt();}
  }catch(error){hostAccount.error=error.message==='login-cancelled'?'카카오 로그인을 취소했어요. 다시 시작하거나 로그인 없이 이용할 수 있어요.':authError(error);}
  finally{hostAccount.ready=true;hostAccount.busy=false;}
  if(deferView)return;
  if(S.route==='home'||isCallback)rerender();
  else if(S.route==='room')keepView();
}

let FB = null, DB = null, UID = '', AUTH = null;
let booting = null;
function boot() {
  return booting ??= (async () => {
    const fb = await import('./firebase.js');
    const app = fb.initializeApp(EMU ? {...FB_CONFIG, projectId: 'demo-camp-arcade'} : FB_CONFIG);
    const auth = fb.getAuth(app);
    let db=DB;
    // Signing out replaces the identity, not the already initialized Firestore client.
    if(!db){
      try { db = fb.initializeFirestore(app, {localCache: fb.persistentLocalCache({tabManager: fb.persistentMultipleTabManager()})}); }
      catch { db = fb.initializeFirestore(app, {}); }
      if (EMU) { fb.connectAuthEmulator(auth, 'http://127.0.0.1:9099', {disableWarnings: true}); fb.connectFirestoreEmulator(db, '127.0.0.1', 8080); }
    }
    let user = await new Promise(res => { const stop = fb.onAuthStateChanged(auth, u => { stop(); res(u); }); });
    if (!user) user = (await fb.signInAnonymously(auth)).user;
    FB = fb; DB = db; UID = user.uid; AUTH=auth;
    const token=installPreview()?{claims:{}}:await user.getIdTokenResult();
    hostAccount.uid=token.claims.dinnerKakao===true?user.uid:'';
    await checkMenuOperator();
  })().catch(e => { booting = null; throw e; });
}
function friendly(e) {
  const c = String(e && (e.code || e.message) || e);
  if(c==='room-too-large')return '메뉴 데이터가 너무 커요. 가게 수를 줄이거나 서비스 관리자에게 알려 주세요.';
  if (/permission/.test(c)) return '권한이 없어요. (다맛다가 마감됐거나, 다른 기기에서 같은 이름으로 보낸 선택이에요)';
  if (/unavailable|network|offline/i.test(c)) return '인터넷 연결을 확인해 주세요.';
  if (/operation-not-allowed|admin-restricted/.test(c)) return 'Firebase 익명 로그인이 꺼져 있어요.';
  return '잠깐 문제가 생겼어요. 다시 해 주세요.';
}

}

  const t = r.treat;
  return [`🍽 ${r.title}`, t ? `🎁 ${treatHeadline(t.by)} ${budgetLabel(t)} ${won(t.cap)}까지` : '', '링크를 열고 이름을 고른 뒤 먹고 싶은 메뉴를 골라 「보내기」만 누르면 돼요!', dl ? `⏰ ${dl.at}까지` : '', roomLink(id,r.title)].filter(Boolean).join('\n');

// 휴대폰에서는 공유 창(카톡 바로 고르기)을, 안 되면 복사를 써요.
async function shareOrCopy(r, id, boxId) {
  const text = inviteText(r, id);
  if (navigator.share && matchMedia('(pointer: coarse)').matches) {
    try { await navigator.share({title: `${r.title} · 메뉴 고르러 가기 · 참여자용`, text: text.split('\n').slice(0, -1).join('\n'), url: roomLink(id,r.title)}); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  copyOrShow(text, '🔗 복사했어요. 단톡방에 붙여넣어 보내 주세요', boxId);
}

// 첫 화면의 방 상태(제목·마감·응답 수)를 한 번 읽어 와요.
async function loadSums(rooms) {
  S.sumsLoading = true;
  try {
    await boot();
    await Promise.all(rooms.map(async r => {
      try {
        const snap = await FB.getDoc(FB.doc(DB, 'dinnerRooms', r.id));
        if (!snap.exists()) { S.sums[r.id] = {gone: true}; return; }
        const d = tidyRoom(snap.data()), sum = {title: d.title, closed: d.closed, deadline: d.deadline, treat: d.treat, answers: null};
        if (r.host) { try { sum.answers = (await FB.getDocs(FB.collection(DB, 'dinnerRooms', r.id, 'answers'))).size; } catch {} }
        S.sums[r.id] = sum;
      } catch { S.sums[r.id] = {title: r.title, closed: false, answers: null, err: true}; }
    }));
  } catch {}
  S.sumsLoading = false;
  if (S.route === 'home' && !document.querySelector('.install-sheet')) rerender();
}

let catalogMap=null;
function catalogSelectionCount() {
  const target=S.catFor==='create'?S.draft:S.edit;
  return S.catPicked.size+(S.catFor==='room'?(target?.stores || []).filter(s=>!CATALOG.stores.some(c=>c.id===s.id)).length:0);

async function addPlaceToDraft(place, menuStore, lines, target, scope) {
  const stillHere=()=>S.route==='catalog' && S.catFor===scope && target===(scope==='create'?S.draft:S.edit);
  if(!stillHere()) throw new Error('가게 선택 화면에서 다시 담아 주세요.');
  const entry=CATALOG.stores.find(s=>s.id===menuStore?.id);
  if(!entry)throw new Error('주변 맛집 목록에서 등록된 가게를 골라 주세요.');
  const id=entry.id;
  if(target.stores.some(s=>s.id===id)) return;
  if(catalogSelectionCount()>=20) throw new Error('한 모임에는 가게를 20곳까지 담을 수 있어요.');
  const store=fromCatalog(await loadCatalogStore(entry));
  if(!stillHere()) throw new Error('화면이 바뀌어 담기를 취소했어요.');
  if(!store.menu.length) throw new Error('등록 메뉴를 불러오지 못했어요. 다시 골라 주세요.');
  if(target.stores.some(s=>s.id===id)) return;
  if(catalogSelectionCount()>=20) throw new Error('한 모임에는 가게를 20곳까지 담을 수 있어요.');
  target.stores.push(store);
  S.catPicked.add(id);
  if(scope==='room') target.dirty=true;
  else persistDraft();
  const done=document.getElementById('catDone');if(done)done.textContent=`${catalogSelectionCount()}곳 담기 완료`;
}
async function mountCatalogMap() {
  const root=document.getElementById('catalogMap');if(!root)return;

      if(!S.catPicked.has(id) && catalogSelectionCount()>=20){toast('한 모임에는 가게를 20곳까지 담을 수 있어요.');return false;}

}

const matchesCatalogArea = (s,area) => area==='all' || (S.catCity==='포항시' && ['남구 전체','북구 전체'].includes(area) ? new RegExp('포항시\\s+'+area.slice(0,2)+'(?:\\s|$)').test(s.address||'') : s.area===area);

const catalogSearchText = new WeakMap();
function searchableCatalogText(s){
  const names=s.menu.map(m=>m.name).join(' '),fields=[s.name,s.category,s.area,s.address,s.menuSearch,names,catalogNeighborhood(s)?.name],cached=catalogSearchText.get(s);
  if(s.menuSearch&&cached&&fields.every((value,i)=>value===cached.fields[i]))return cached.text;
  const text=searchText([s.name,s.category,s.area,s.address,s.menuSearch||'',names,catalogNeighborhood(s)?.name||''].join(' '));
  if(s.menuSearch)catalogSearchText.set(s,{fields,text});

  const buttons = [...document.querySelectorAll('.store-shortcuts button')];

    .filter(entry=>entry.rect.bottom>entry.rect.top);

let pendingSearchRefresh=null;
function scheduleSearchRefresh(kind){
  const scope=`${S.route}/${S.roomId}/${S.tab}`;
  if(pendingSearchRefresh?.kind===kind&&pendingSearchRefresh.scope===scope)return;
  const job={kind,scope};pendingSearchRefresh=job;
  requestAnimationFrame(()=>{
    if(pendingSearchRefresh!==job)return;pendingSearchRefresh=null;
    if(`${S.route}/${S.roomId}/${S.tab}`!==scope)return;
    if(kind==='menu'&&S.route==='room'&&document.getElementById('menuSearch'))refreshMenuSearch();
    if(kind==='catalog'&&S.route==='catalog'&&S.catStep==='stores'&&document.getElementById('catSearch')){
      document.getElementById('catList').innerHTML=catalogList();
      document.getElementById('catalogCount').textContent=catalogCount();
      catalogMap?.update(CATALOG.stores.filter(catalogMatches));
    }
  });
}

function answerStoreGroups(a) {

}

function ticket(a, preview = false) {

// Only the selected name's confirmed answer can be called complete. Local edits
// stay separate from the last submitted receipt, including request-only edits.
function mineStatus() {
  const a=myAnswer(),other=a&&a.uid!==UID&&!S.host;
  const late=myLateAnswer();
  let kind='checking',icon='…',title='전송 상태 확인 중',detail='잠시만 기다려 주세요.';
  if(S.answersReady){
    if(other){kind='other';icon='↗';title='다른 기기에서 전송됨';detail='수정은 그 기기 또는 방장에게 요청해 주세요.';}
    else if(isLate()&&!S.lateReady){title='추가 응답 확인 중';detail=S.lateError||'잠시만 기다려 주세요.';}
    else if(S.answerConflict){kind='conflict';icon='!';title='최신 제출 확인 필요';detail='다른 화면에서 바뀌었어요. 내 초안은 보관 중이에요.';}
    else if(S.sending){title='보내는 중';detail='완료될 때까지 기다려 주세요.';}
    else if(late?.status==='pending'){kind=lateIsSent()?'waiting':'draft';icon='◷';title=lateIsSent()?'방장 승인 대기':'추가 응답 수정 중';detail='승인 전까지 기존 주문·합계는 유지돼요.';}
    else if(late?.status==='rejected'&&!cartIsSent()){kind='draft';icon='!';title='추가 응답이 반려됐어요';detail=inLateWindow()?'내용을 확인한 뒤 다시 요청할 수 있어요.':'기존 주문은 유지돼요. 방장에게 알려 주세요.';}
    else if(a&&cartIsSent()){kind='sent';icon='✓';title=resendConfirmed()?'재전송 완료':'전송 완료';detail=resendConfirmed()?'변경사항이 반영됐어요':locked()?'방장에게 전달됐어요 · 마감':'방장에게 전달됐어요';}
    else{kind='draft';icon='!';title=a?'수정 중 · 재전송 전':'아직 전송 전';detail=locked()?'마감되어 보낼 수 없어요. 방장에게 알려 주세요.':a?'다시 보내기 전까지 기존 메뉴로 집계돼요.':'장바구니에서 보내기를 눌러 주세요.';}
  }
  return `<section id="mineStatus" class="mine-status ${kind}" role="status"><i aria-hidden="true">${icon}</i><div><h2>${title}</h2><p>${detail}</p></div></section>`;
}

  const label=S.answerConflict?'최신 제출 확인':pending?'추가 응답 수정':a?edit?'메뉴 수정':'확인하고 다시 보내기':cartCount()?'확인하고 보내기':'메뉴 고르기';

function mineReceipt(a,editable=true,label='마지막 전송') {

  const requests=Object.entries(a.storeReqs||{}).filter(([,text])=>str(text,200).trim()),thanks=tidyThanks(a.thanks);
  const time=Number.isFinite(a.at)&&a.at>0?new Date(a.at):null;
  return `<section class="ticket mine-receipt" aria-label="${esc(a.name)} ${esc(label)} 메뉴"><header class="mine-receipt-head"><div><h2>${esc(a.name)}</h2><span>${count}개 · ${esc(label)}</span><time class="mine-sent-at"${time?` datetime="${time.toISOString()}"`:''}>${time?esc(time.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}))+' 전송':'전송 시간 확인 중'}</time></div><b>${won(total)}</b></header>

// ---------- 모인 주문 ----------
function totals() {
  const groups = new Map();
  for (const a of S.answers.values()) {
    for (const it of a.items) {
      if (!groups.has(it.s)) groups.set(it.s, {store: storeOf(it.s) || {id: it.s, name: '(지운 가게)', phone: '', emoji: '🍴', color: '#eef2f3', menu: []}, items: new Map(), who: new Map(), sum: 0});
      const g = groups.get(it.s);
      const k = it.m, row = g.items.get(k) || {id:it.m,name:it.name,n:0,price:it.price,sum:0,people:new Map()};
      row.n += it.n; row.sum += it.price*it.n; row.people.set(a.name,(row.people.get(a.name)||0)+it.n); g.items.set(k, row); g.sum += it.price * it.n;
      if (!g.who.has(a.name)) g.who.set(a.name, {ls: [], r: str(a.storeReqs?.[it.s], 200).trim()});
      g.who.get(a.name).ls.push(`${it.name} ${it.n}`);
    }
  }
  const order = (S.room?.stores || []).map(s => s.id);
  return [...groups.values()].sort((x, y) => order.indexOf(x.store.id) - order.indexOf(y.store.id));
}
function ownerMessage(g) {
  const lines = [`안녕하세요, 사장님! ${S.room.title} 주문입니다.`, '────────', ...[...g.items.values()].map(i => `${i.name} ${i.n}개`), '────────', `합계 ${won(g.sum)} (메뉴판 가격 기준)`];
  if (S.room.note) lines.push(S.room.note);
  if (S.byPerson) lines.push('', '사람별로 나눠 담아 주시면 감사하겠습니다.', ...[...g.who].map(([w, x]) => `- ${w}: ${x.ls.join(', ')}${x.r ? ` (요청: ${x.r})` : ''}`));
  else { const reqs = [...g.who].filter(([, x]) => x.r); if (reqs.length) lines.push('', '요청 사항', ...reqs.map(([w, x]) => `- ${w}: ${x.r}`)); }
  lines.push('', '감사합니다!');
  return lines.join('\n');
}
function shareCard() {
  return `<details class="share-card"${S.created || !S.answers.size ? ' open' : ''}><summary class="sc-top"><span class="sc-ic">${ICON.link}</span><div><b>참여 링크</b><span>링크를 보내 함께 고르기</span></div><span class="sc-expand" aria-hidden="true">⌄</span></summary><div class="sc-content">

}
function progressBlock(withRemind) {
  const r = S.room, answered = new Set([...S.answers.values()].map(a => a.name));
  if (!r.names.length) return `<section class="participation"><div class="participation-top"><span>참여 현황</span><b>${S.answers.size}<small>명 보냄</small></b></div></section>`;
  const todo=r.names.filter(n=>!answered.has(n)),done=r.names.length-todo.length,extra=[...answered].filter(n=>!r.names.includes(n)),pct=Math.round(done/r.names.length*100);
  const remind=`🍽 ${r.title}\n아직 메뉴를 보내지 않은 분: ${todo.join(', ')}\n메뉴를 골라 보내 주세요.\n${roomLink()}`;
  return `<section class="participation"><div class="participation-top"><span>참여 현황${extra.length ? ` · 명단 밖 ${extra.length}명` : ''}</span><b>${done}<small>/ ${r.names.length}명</small></b></div><div class="participation-track"><div class="bar"><i style="width:${pct}%"></i></div><span>${pct}%</span></div>
  ${todo.length ? `<details class="pending-people"><summary><span>아직 안 보낸 사람 <b>${todo.length}</b></span><span>${todo.slice(0,3).map(esc).join(' · ')}${todo.length>3?' 외':''} ⌄</span></summary><div class="pills">${todo.map(w=>`<span class="pill no">${esc(w)}</span>`).join('')}</div>${withRemind?'<button class="text-btn" data-act="copy-remind">참여 안내 복사</button><div id="remindBox" hidden class="copy-box"><textarea class="input code-box" readonly></textarea></div>':''}</details>` : '<p class="all-done">모두 보냈어요 ✓</p>'}
  ${withRemind ? `<textarea id="remindText" hidden>${esc(remind)}</textarea>` : ''}</section>`;
}

    ${host ? `<div class="row no-print">${g.store.phone ? `<button class="btn gray" data-act="copy" data-text="${esc(g.store.phone)}" data-msg="📞 번호를 복사했어요">번호 복사</button>` : ''}<button class="btn" style="flex:1" data-act="copy-owner" data-i="${i}">${ICON.copy || ICON.link} 주문 메시지 복사</button></div>

async function sendAnswer() {

    items:lines.map(l => ({m:l.item.id,n:l.n,name:l.item.name,price:l.item.price,s:l.item.store.id}))};
  Object.assign(payload,thanksPayload(S.thanks,myAnswer()));const thanks=tidyThanks(S.thanks);

      const snapshot = await transaction.get(ref);
      const latest = snapshot.exists() ? tidyAnswer(answerId(who),snapshot.data()) : null;
      if (answerVersion(latest) !== expected) throw Object.assign(new Error('Answer changed'), {code:'answer-changed',latest});

    S.resendComplete=expected!==null;finishParticipantGuide();S.sending = false; S.sentAt = Date.now(); syncAnswerDraft(); persistRoom();
    setSentNames(S.roomId, [...new Set([...sentNames(S.roomId), S.who])]);
    buzz([20, 40, 20]);

  } catch (e) {
    S.sending = false; dismissSendCurtain(false); rerender();
    if (S.roomId !== roomId || S.who !== who) return;
    if (e.code === 'answer-changed') {
      if (e.latest) S.answers.set(answerId(who),e.latest); else S.answers.delete(answerId(who));

  }
}

  if(t.id==='managerDisplayName'){roomManagers.draftName=str(t.value,20);roomManagers.nameDirty=true;return;}
  if (S.route === 'create' && S.draft) {
    if (t.id === 'c-title') { S.draft.title = t.value; const b = document.querySelector('[data-act=create]'); const can = t.value.trim() && S.draft.stores.length; b.disabled = !can; const label=document.getElementById('createSubmitLabel')||b;label.textContent = createSubmitText(); }
    if (t.id === 'c-note') S.draft.note = t.value;
    if (t.id === 'c-deadline') S.draft.deadline = t.value;
    if (t.id === 'c-names') { S.draft.names = t.value; const h = document.querySelector('.name-tools .hint'); if (h) h.textContent = `${parseNames(t.value).length}명`; }
    if (t.id === 'c-free') S.draft.freeJoin = t.checked;
    if (t.id === 'c-treat') { S.draft.treat = t.checked ? {by: '', cap: 10000} : null; rerender(); return; }
    if (t.id === 'c-treat-by') S.draft.treat.by = t.value;
    if (t.id === 'c-treat-unit') { S.draft.treat.unit=t.value.slice(0,12);const label=document.getElementById('c-budget-label');if(label)label.textContent=budgetLabel(S.draft.treat)+' 예산'; }
    if (t.id === 'c-treat-cap') { S.draft.treat.cap = num(t.value); for (const b of document.querySelectorAll('.cap-chips button')) b.classList.toggle('on', Number(b.dataset.v) === S.draft.treat.cap); }
    refreshCreateGuide();persistDraft(); return;
  }
  if (t.id === 'catSearch') { S.catQuery = t.value; S.catLimit=12; S.catPreview='';scheduleSearchRefresh('catalog');return; }
  if (t.id === 'catalogArea') { S.catArea=t.value; S.catCat='all'; S.catLimit=12; S.catPreview=''; rerender(); return; }
  if (t.id === 'catalogCategory') { S.catCat=t.value;S.catLimit=12;S.catPreview='';rerender();return; }
  if (t.id === 'catMenuCategory') { S.catPreviewCategory=t.value;rerender();return; }
  if (t.id === 'menuSearch') { S.menuQuery = t.value.slice(0, 80);scheduleSearchRefresh('menu');return; }
  if (t.id === 'thanksText') {
    S.thanks={emoji:'💛',effect:'hearts',...S.thanks,text:t.value.slice(0,120)};persistRoom();
    const summary=document.querySelector('.thanks-summary');if(summary)summary.textContent=tidyThanks(S.thanks)?.text||'선택';
    const preview=document.getElementById('thanksPreview');if(preview)preview.outerHTML=thanksPreview();
    const count=document.getElementById('thanksCount');if(count)count.textContent=String(t.value.length);
    const clear=document.querySelector('[data-act="thanks-clear"]');if(clear)clear.hidden=!tidyThanks(S.thanks);
    for(const button of document.querySelectorAll('[data-act="thanks-preset"]'))button.setAttribute('aria-pressed',String(THANKS_PRESETS[Number(button.dataset.i)]?.text===t.value));
    refreshDraftStatus();return;
  }
  if (t.id === 'req' || t.dataset.storeReq) {
    if (t.dataset.storeReq) setStoreRequest(t.dataset.storeReq, t.value); else S.req = t.value.slice(0, 200);
    persistRoom();
    if (t.dataset.storeReq) {
      const fold=t.closest('.store-request'),summary=fold.querySelector('.request-value');
      if(summary)summary.innerHTML=`${t.value.trim()?esc(t.value):'추가하기'} <i>＋</i>`;
      for (const b of fold.querySelectorAll('[data-act="quick-req"]')) { const on = t.value.split(/\s*,\s*/).includes(b.dataset.t); b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); }
    }
    refreshDraftStatus();
    return;
  }
  if (S.edit && t.id === 'e-treat') { S.edit.treat = t.checked ? (S.room.treat ? {...S.room.treat} : {by: '', cap: 10000}) : null; S.edit.dirty = true; rerender(); return; }
  if (S.edit && t.id === 'e-treat-by') { S.edit.treat.by = t.value; markDirtySoft(); return; }
  if (S.edit && t.id === 'e-treat-unit') { S.edit.treat.unit=t.value.slice(0,12);const label=document.getElementById('e-budget-label');if(label)label.textContent=budgetLabel(S.edit.treat)+' 예산';markDirtySoft();return; }
  if (S.edit && t.id === 'e-treat-cap') { S.edit.treat.cap = num(t.value); markDirtySoft(); return; }
  if (S.edit && t.dataset.e) { S.edit[t.dataset.e] = t.type === 'checkbox' ? t.checked : t.value; markDirtySoft(); return; }
  if (S.edit && t.dataset.em) {
    for (const s of S.edit.stores) for (const m of s.menu) if (m.id === t.dataset.em) { m[t.dataset.f] = t.dataset.f === 'price' ? num(t.value) : t.value; delete m.priceBasis;delete m.priceSource;delete m.priceDataDate;delete m.priceComparison;s.checkedAt='';s.menuBasis=''; }
    markDirtySoft();
  }
});
// 글자를 적는 동안에는 다시 그리지 않고, 저장 막대만 띄워요.
function markDirtySoft() {
  if (S.edit.dirty) return;
  S.edit.dirty = true;
  const nav = document.querySelector('.nav');
  (nav || $app).insertAdjacentHTML(nav ? 'beforebegin' : 'beforeend', `<div class="bottom-bar save-bar"><button class="btn gray" data-act="edit-cancel">되돌리기</button><button class="btn" style="flex:1" data-act="edit-save">바꾼 내용 저장</button></div>`);
}
document.addEventListener('change', e => { if (e.target.dataset.e === 'freeJoin' && S.edit) { S.edit.freeJoin = e.target.checked; markDirtySoft(); } });
document.addEventListener('focusin', e => { if(e.target.id==='whoName'||cartTextEntry(e.target))refreshParticipantGuide(); });
document.addEventListener('focusout', e => { if(e.target.id==='whoName'||cartTextEntry(e.target)||e.target.closest?.('.name-in'))scheduleStoreHighlight(); });
document.addEventListener('pointerdown', e => {
  if(document.activeElement?.id==='whoName'&&e.target.closest?.('.name-in.is-keyboard-docked [data-act="who-typed"]'))e.preventDefault();
  else if(cartEntryEditor()&&(e.target.closest?.('.cartbar.is-keyboard-docked')||e.target.closest?.('#participantFlow [data-act="tab"]')))e.preventDefault();
});
document.addEventListener('keydown', e => {
  const mapCity=e.target.closest?.('.region-map-city[data-act="cat-city"]');
  if(mapCity&&['Enter',' '].includes(e.key)){
    e.preventDefault();if(!e.repeat)chooseCatalogCity(mapCity.dataset.city);return;
  }
  if(e.key==='Escape'&&document.getElementById('thanksMoment')){document.getElementById('thanksMoment').remove();clearTimeout(thanksTimer);e.preventDefault();return;}
  if(e.target.matches?.('[data-cart-status]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
    e.preventDefault();const tabs=[...document.querySelectorAll('[data-cart-status]')],at=tabs.indexOf(e.target),next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(at+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[next]?.click();return;
  }
  if (e.key === 'Escape' && e.target.id === 'menuSearch') { e.preventDefault(); S.menuQuery = ''; e.target.value = ''; refreshMenuSearch(); return; }
  if (e.key === 'Escape' && document.getElementById('sheet')) { closeSheet(); return; }
  if (e.key === 'Enter' && e.target.id === 'whoName'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();document.querySelector('[data-act="who-typed"]')?.click();}
});

// ---------- 주소 ----------
function route() {
  if(legacyMove.active){if(location.hash!==legacyMove.hash){legacyMove.hash=location.hash;legacyMove.error='주소가 바뀌었어요. 연결 상태를 다시 확인한 뒤 이동해 주세요.';if(!legacyMove.busy)rerender();}return;}
  if(location.hash==='#operator'){openMenuOperator();return;}
  const catalogView=history.state?.dinnerCatalog;
  if(catalogView && ['region','neighborhoods','stores'].includes(catalogView.step) && ['create','room'].includes(catalogView.scope) && (catalogView.scope==='create'?S.draft:S.edit) && (!catalogView.roomId||catalogView.roomId===S.roomId)){
    Object.assign(S,{route:'catalog',catStep:catalogView.step,catFor:catalogView.scope,catCity:catalogView.city||'all',catTown:catalogView.town||'all',catArea:'all',catCat:'all',catFilters:false,catShowMap:false,catLimit:12,catPreview:''});render();scrollTo(0,0);return;
  }
  // 예전 「링크로 보내기」 판(#s=…)은 classic.html 로 보내요.
  if (/^#s=/.test(location.hash)) { location.replace('classic.html' + location.hash); return; }
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  const id = (h.get('r') || '').replace(/[^a-z0-9]/gi, '').slice(0, 40);
  const want = ROOM_TABS.includes(h.get('t')) ? h.get('t') : '';
  if (S.route === 'room' && S.tab === 'set' && S.edit?.dirty && (id !== S.roomId || want !== 'set')) {
    rememberView('pushState'); toast('바꾼 내용을 저장하거나 되돌려 주세요'); return;
  }
  if (location.hash === '#new') { stopListening();beginCreate();return; }
  if (id) {
    const key = (h.get('k') || '').replace(/[^a-z0-9_-]/gi, '').slice(0, 64);
    // 방장 열쇠는 주소창에서 바로 지워요(실수로 그대로 공유하지 않게). 이 기기에는 기억해요.
    if (key) { rememberRoom(id, {key}); history.replaceState(null, '', `#r=${id}${want ? `&t=${want}` : ''}`); }
    if (id !== S.roomId || S.route !== 'room') openRoom(id, key, want);
    else go({...restoredRoomView(id), tab: want || (S.who ? 'menu' : 'who')}, false);
    return;
  }
  stopListening(); S.roomId = '';
  if (S.route !== 'catalog') go({route: 'home'}, false);
}
addEventListener('hashchange', route);
// Two store views can share the same hash; popstate also restores their store/search context.
addEventListener('popstate', route);
function launchApp() {
  if(legacySite()){
    let stay=false;try{stay=sessionStorage.getItem('dinner-legacy-stay')==='1';}catch{}
    const q=new URLSearchParams(location.search),callback=q.has('state')&&(q.has('code')||q.has('error'));
    if(!stay||callback){legacyMove.hash=location.hash;checkLegacyMove();return;}
  }
  const query=new URLSearchParams(location.search);
  if(query.has('state')&&(query.has('code')||query.has('error'))){
    hostAccount.busy=true;
    document.getElementById('app').innerHTML='<div class="wrap host-gate" role="status"><h1>카카오 로그인 확인 중…</h1><p>연결한 모임을 안전하게 불러오고 있어요.</p></div>';
  }else route();
  initHostAccount();
}
launchApp();
checkAppUpdate();
setInterval(checkAppUpdate,60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='hidden'){checkAppUpdate();resumeParticipantGuide();}});
addEventListener('focus',()=>{checkAppUpdate();resumeParticipantGuide();});
addEventListener('pageshow',resumeParticipantGuide);
addEventListener('online',()=>{appUpdate.checkedAt=0;checkAppUpdate();});
setInterval(() => { if(S.route==='room'&&S.room?.deadline&&!document.getElementById('sheet')){const phase=S.room.closed?'closed':inLateWindow()?'late':isLate()?'ended':'open';if(S.clockPhase!==phase){S.clockPhase=phase;keepView();refreshDraftStatus();}} },1000);


// Optional requests remain open across quantity changes and snapshot renders.
document.addEventListener('toggle', event => { const el=event.target;if(el.matches?.('[data-request-fold]')&&el.isConnected){S.requestOpen ||= {}; S.requestOpen[el.dataset.requestFold]=el.open;} }, true);

document.addEventListener('toggle',event=>{const el=event.target;if(el.matches?.('[data-settings-fold]')&&el.isConnected){S.settingsOpen ||= {};S.settingsOpen[el.dataset.settingsFold]=el.open;}},true);
document.addEventListener('toggle',event=>{const el=event.target;if(!el.isConnected)return;if(el.matches?.('[data-thanks-fold]'))S.thanksOpen=el.open;if(el.matches?.('[data-thanks-decor]'))S.thanksDecorOpen=el.open;},true);
document.addEventListener('toggle',event=>{const el=event.target;if(!el.isConnected)return;if(el.matches?.('[data-cart-help]'))S.cartProgressHelpOpen=el.open;if(el.matches?.('[data-mine-fold]')){S.mineOpen ||= {};S.mineOpen[el.dataset.mineFold]=el.open;}},true);

</script>
