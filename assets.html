let selected=0,tone=0;const tones=['민트','살구','하늘','라벤더','레몬','분홍'];
function portrait(index,color){return foodAvatar(index).replace(/avatar-tone-\d/,'avatar-tone-'+color);}
function render(){document.querySelector('.featured').innerHTML=portrait(selected,tone);document.querySelector('#small-avatar').innerHTML=portrait(selected,tone);document.querySelector('#selected-name').textContent=FOOD_CHARACTERS[selected].name;document.querySelector('.cards').innerHTML=FOOD_CHARACTERS.map((f,i)=>'<button class="card" data-food="'+i+'" aria-pressed="'+(i===selected)+'">'+portrait(i,tone)+'<span>'+f.name+'</span></button>').join('');document.querySelector('.swatches').innerHTML=tones.map((name,i)=>'<button class="avatar-tone-'+i+'" data-tone="'+i+'" aria-label="'+name+'" aria-pressed="'+(i===tone)+'"></button>').join('');}
document.addEventListener('click',e=>{const food=e.target.closest('[data-food]'),color=e.target.closest('[data-tone]');if(food)selected=Number(food.dataset.food);else if(color)tone=Number(color.dataset.tone);else return;render();});render();
</script></body></html>
