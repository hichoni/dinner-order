</style></head><body><header><h1>다맛다 · 캐릭터와 아이콘</h1><nav><a href="screens.html#screen-who">앱에서 보기 ↗</a><a href="motion.html">로딩 · 전송 ↗</a><select aria-label="색상 테마"><option value="sky">블루 · 레몬</option><option value="mint">민트 · 귤</option></select></nav></header><main><p class="label">FOOD FRIENDS</p><h2>입맛은 달라도, 한 쟁반.</h2><div class="food-grid"></div><div class="uses"><section class="use"><h3>앱 아이콘 · SVG</h3><div class="icons"></div></section><section class="use"><h3>빈 장바구니</h3><div class="empty-demo"></div></section></div><p class="footer">이름 선택 · 방 목록 · 장바구니에 적용. 각 SVG를 눌러 원본을 열 수 있어요. <a href="assets/README.txt">에셋 안내 ↗</a></p></main><script src="assets/brand-icons.js"></script><script>
const names={bowl:'밥',noodle:'면',cup:'커피',toast:'토스트',drink:'음료',dumpling:'만두'},uiNames={menu:'메뉴',cart:'장바구니',mine:'보낸 메뉴',sum:'주문 요약',all:'참여자',set:'설정',send:'보내기',gift:'쏜다'};
function render(){const theme=document.querySelector('select').value;document.documentElement.dataset.palette=theme;document.querySelector('.food-grid').innerHTML=Object.entries(names).map(([key,name])=>`<article class="food-card">${FOOD_ICONS[key]}<b>${name}</b><a href="assets/characters/${key}-${theme}.svg" download>SVG ↓</a></article>`).join('');document.querySelector('.icons').innerHTML=Object.entries(uiNames).map(([key,name])=>`<a href="assets/icons/${key}.svg" download>${BRAND_ICONS[key]}<span>${name}</span></a>`).join('');document.querySelector('.empty-demo').innerHTML=FOOD_ICONS.tray+'<p>아직 담은 메뉴가 없어요.<br>메뉴를 담으면 쟁반으로 모여요.</p>';}
document.querySelector('select').onchange=render;render();
</script></body></html>
