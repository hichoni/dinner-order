/* 저녁에 뭐 먹을래? — 배달앱 같은 모바일 화면.
   흰 바탕 + 민트 한 가지 색, 사진이 주인공. 칸 사이는 그림자 대신 얇은 선과 회색 띠(8px)로 나눠요.
   제목 글꼴은 로고·딸깍에만 주아체, 나머지는 시스템 고딕. 아이콘은 선 아이콘. */
:root{
  --mint:#14b8ac;--mint-d:#0d958b;--mint-l:#e7f7f5;--mint-ll:#f2fbfa;
  --ink:#1f1f1f;--sub:#6f7377;--mute:#a1a5a9;--line:#eceeef;--band:#f4f5f6;--bg:#fff;--card:#fff;
  --red:#ef4444;--red-l:#fdeeee;--yellow:#ffcf3f;--yellow-l:#fff6d8;--blue:#2b7de1;--blue-l:#eaf3fd;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Apple SD Gothic Neo","Pretendard",system-ui,-apple-system,"Malgun Gothic","Noto Sans KR",sans-serif;
  --nav-h:62px;--top-h:56px;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px))}
#app.view-admin,#app.view-who,#app.view-pin{padding-bottom:40px}
#app.view-map{padding-bottom:0}
#app.enter>*:not(.nav):not(.cartbar):not(.share-bar){animation:enter .2s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
h2 small{font-size:.95rem;color:var(--mint-d);font-weight:800;margin-left:2px}
.muted{color:var(--sub);font-size:.86rem;line-height:1.5}
.eyebrow{font-size:.78rem;font-weight:700;color:var(--mint-d)}
.wrap{padding:0 16px}
.band{height:8px;background:var(--band);margin:20px 0}
.band.thin{margin:14px 0}

/* 위 막대 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--top-h);background:#fff;padding:0 60px 0 12px;display:flex;align-items:center;gap:6px}
.top h1{font-size:1.08rem;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{border:0;background:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink);padding:0;flex:0 0 38px}
.chip-who{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px 5px 6px;font-weight:700;font-size:.82rem;white-space:nowrap}
.chip-who i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--band);display:grid;place-items:center;font-size:.95rem}
.home-top .where{flex:1;min-width:0;border:0;background:none;display:flex;align-items:center;gap:4px;padding:6px 4px;text-align:left}
.home-top .where svg{width:20px;height:20px;color:var(--mint-d);flex:0 0 20px}
.home-top .where b{font-size:1.08rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-top .where .caret{font-size:.7rem;color:var(--sub)}

/* 아래 탭 */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:25;width:min(520px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-i{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--mute);border-radius:12px}
.nav-i i{font-style:normal;display:grid;place-items:center}
.nav-i span{font-size:.68rem;font-weight:700}
.nav-i.on{color:var(--ink)}
.nav-i.on svg{stroke-width:2.3}
.nav-badge{position:absolute;top:0;left:calc(50% + 5px);background:var(--mint);color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:.66rem;display:grid;place-items:center;padding:0 5px;border:2px solid #fff;font-weight:800}
.nav-dot{position:absolute;top:3px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.nav-dot.done{background:var(--mint)}
.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{30%{transform:scale(1.4)}}

/* 공통 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.notice{background:var(--yellow-l);border-radius:12px;padding:11px 13px;font-size:.88rem;margin:12px 0;line-height:1.5}
.notice.red{background:var(--red-l)}
.notice.mint{background:var(--mint-ll);color:#0b6f68}
.input{width:100%;border:1px solid #dfe2e4;border-radius:12px;padding:12px 13px;background:#fff}
.input:focus{outline:none;border-color:var(--mint);box-shadow:0 0 0 3px var(--mint-l)}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:800;background:var(--mint);color:#fff;white-space:nowrap;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--mint-d);box-shadow:inset 0 0 0 1px var(--mint)}
.btn.gray{background:var(--band);color:var(--ink)}
.btn.red{background:var(--red)}
.btn.line-dark{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #d6dadc}
.btn.block{width:100%;padding:16px;font-size:1.02rem}
.btn:disabled{opacity:.45}
.small-btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:.8rem;font-weight:700;text-decoration:none;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--band);color:var(--sub)}
.chip.mint{background:var(--mint-l);color:var(--mint-d)}
.chip.warn{background:var(--yellow-l);color:#866000}
.chip.deliv{background:var(--blue-l);color:var(--blue)}
.tag{display:inline-block;font-size:.68rem;font-weight:800;border-radius:5px;padding:1px 5px;margin-right:3px;background:var(--mint-l);color:var(--mint-d)}
.tag.hot{background:#feecec;color:#d23b3b}.tag.kid{background:var(--yellow-l);color:#8a6100}
.footer-link{display:block;margin:28px auto 8px;background:none;border:0;color:var(--mute);font-size:.8rem;text-decoration:underline}
.btn:focus-visible,.small-btn:focus-visible,.nav-i:focus-visible,.store:focus-visible,.ddal:focus-visible,.seg button:focus-visible,.zone-tabs button:focus-visible,.cat:focus-visible,.pop-card:focus-visible,.menu-main:focus-visible,.sorts button:focus-visible,.who-btn:focus-visible,.tabs-line button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}

/* 가게 그림(썸네일): 사진이 오면 사진, 아니면 대표 음식 + 메뉴 음식 두 개 */
.thumb{position:relative;flex:0 0 auto;width:88px;height:88px;border-radius:12px;overflow:hidden;background:radial-gradient(120% 100% at 25% 15%,rgba(255,255,255,.7),rgba(255,255,255,0) 55%),var(--c,#eef2f3)}
.thumb::before{content:"";position:absolute;left:50%;top:54%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.55)}
.thumb .t-main{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:2.5rem;filter:drop-shadow(0 3px 3px rgba(0,0,0,.12))}
.thumb .t-side{position:absolute;font-size:1.1rem}
.thumb .t0{right:8%;top:8%;transform:rotate(14deg)}
.thumb .t1{left:8%;bottom:8%;transform:rotate(-12deg)}
.thumb.sm{width:44px;height:44px;border-radius:10px}.thumb.sm .t-main{font-size:1.5rem}.thumb.sm .t-side{display:none}
.thumb.md{width:64px;height:64px;border-radius:12px}.thumb.md .t-main{font-size:2rem}.thumb.md .t-side{display:none}
.thumb.lg{width:100%;height:240px;border-radius:0}.thumb.lg .t-main{font-size:5rem}.thumb.lg .t-side{font-size:2.2rem}.thumb.lg::before{width:150px}
.thumb.lg .t0{right:24%;top:16%}.thumb.lg .t1{left:24%;bottom:22%}
.thumb,.m-emo,.pop-emo,.sheet-emo{position:relative;overflow:hidden}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.ph.on{opacity:1}

/* 누가 주문? */
.who-hero{background:var(--mint);color:#fff;padding:34px 22px 28px;margin-bottom:8px}
.who-badge{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 11px;font-size:.78rem;font-weight:700}
.who-hero h1{font-family:var(--display);font-weight:400;margin:14px 0 8px;font-size:2.6rem;line-height:1.1}
.who-hero p{margin:0 0 16px;opacity:.92;font-weight:600}
.view-who h2{margin:22px 0 12px}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.who-btn{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px 11px;font-weight:700;font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .12s,transform .1s}
.who-btn i{font-style:normal;font-size:1.8rem}
.who-btn:hover{border-color:var(--mint)}
.who-btn:active{transform:scale(.97)}

/* 마감 시계 */
.countdown{display:inline-flex;gap:4px;align-items:center;background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums}
.countdown b{color:var(--mint-d)}
.countdown.soon b{color:#c26a00}
.countdown.late{background:var(--red-l);color:#c22}

/* 홈 */
.zone-tabs{display:flex;align-items:flex-end;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);position:relative}
.zone-tabs button{border:0;background:none;padding:10px 0 11px;font-weight:700;font-size:.98rem;color:var(--mute);position:relative;display:flex;gap:4px;align-items:baseline}
.zone-tabs button small{font-size:.75rem;font-weight:700;color:var(--mute)}
.zone-tabs button.on{color:var(--ink)}
.zone-tabs button.on small{color:var(--mint-d)}
.zone-tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.seg button{border:0;background:none;border-radius:999px;padding:7px 12px;font-weight:700;font-size:.84rem;color:var(--sub);display:flex;gap:4px;align-items:baseline;white-space:nowrap}
.seg button small{font-size:.72rem;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}
.seg button.on small{color:#9ee6df}
.zone-note{margin-left:auto;padding-bottom:12px;font-size:.76rem;color:var(--sub);font-weight:600;white-space:nowrap}
.slot-card{margin:16px 16px 0;background:var(--mint);border-radius:20px;padding:16px 16px 16px;color:#fff;position:relative;overflow:hidden}
.slot-card::after{content:"";position:absolute;right:-36px;top:-46px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.slot-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;font-weight:700;opacity:.95;position:relative}
.slot-head .countdown{background:rgba(255,255,255,.18);color:#fff;font-size:.74rem;padding:4px 9px}
.slot-head .countdown b{color:#fff}
.slot-card h2{font-family:var(--display);font-weight:400;font-size:1.75rem;margin:6px 0 12px;letter-spacing:0;position:relative}
.reel{position:relative;min-height:92px;border-radius:14px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 14px;overflow:hidden}
.reel.has{justify-content:flex-start}
.reel .r-emo{font-size:2.6rem;line-height:1}
.reel .r-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.reel .r-name{font-size:1.2rem;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reel .r-sub{font-size:.78rem;font-weight:600;color:var(--sub)}
.reel .r-sub i{font-style:normal;margin:0 4px;color:var(--mute)}
.reel .r-sub.hit{color:var(--mint-d);font-weight:800}
.reel.spin .r-emo,.reel.spin .r-text{animation:roll .12s linear}
@keyframes roll{from{transform:translateY(-70%);opacity:.15}to{transform:none;opacity:1}}
.reel.hit{animation:hit .5s ease-out}
@keyframes hit{0%{box-shadow:0 0 0 0 rgba(255,255,255,.9)}100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
.pick-acts{display:flex;gap:8px;margin-top:8px;animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:none;opacity:1}}
.btn.line{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);padding:11px 14px}
.btn.line.grow{flex:1;background:#173f3c;box-shadow:none;text-align:center;justify-content:center}
.ddal{display:flex;align-items:baseline;justify-content:center;gap:8px;width:100%;margin-top:12px;border:0;border-radius:14px;background:#fff;color:var(--mint-d);padding:14px 12px;transition:transform .08s}
.ddal span{font-family:var(--display);font-size:1.75rem;line-height:1}
.ddal small{font-size:.8rem;font-weight:700;color:var(--sub)}
.ddal:active{transform:scale(.98)}
.ddal:disabled{opacity:.6}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.browse-note{background:var(--band);border-radius:12px;padding:12px 14px;margin:14px 0 0;font-size:.84rem;line-height:1.5;color:var(--sub)}
.browse-note b{color:var(--ink)}
.sent-note{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;border:0;background:var(--mint-ll);color:var(--mint-d);border-radius:12px;padding:13px 15px;margin:14px 0 0;font-weight:700;text-align:left}
.cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:18px -16px 0;padding:0 12px;scroll-padding:0 12px}
.cats::-webkit-scrollbar,.rail::-webkit-scrollbar,.sorts::-webkit-scrollbar{display:none}
.cat{flex:0 0 64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:.76rem;color:#444;padding:0}
.cat i{font-style:normal;width:52px;height:52px;border-radius:18px;background:var(--band);display:grid;place-items:center;font-size:1.65rem;transition:transform .12s,background .12s}
.cat.on{color:var(--mint-d);font-weight:800}
.cat.on i{background:var(--mint-l)}
.cat:active i{transform:scale(.93)}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 4px}
.sec-sub{margin:0 0 6px;font-size:.82rem;color:var(--sub)}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 16px 2px;margin:0 -16px;scroll-padding:0 16px;scrollbar-width:none}
.pop-card{flex:0 0 120px;scroll-snap-align:start;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.pop-emo{width:120px;height:120px;border-radius:14px;display:grid;place-items:center;font-size:2.6rem;margin-bottom:7px;background:radial-gradient(100% 90% at 25% 15%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),var(--c)}
.pop-card b{font-size:.88rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-card span{font-size:.74rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-card em{font-style:normal;font-weight:800;font-size:.88rem;font-variant-numeric:tabular-nums;margin-top:2px}
.sorts{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:2px 0 -4px}
.sorts button{flex:0 0 auto;border:0;background:none;padding:6px 2px;font-weight:600;font-size:.8rem;color:var(--mute)}
.sorts button.on{color:var(--ink);font-weight:800}
.sorts button.on::before{content:"✓ ";color:var(--mint-d)}

/* 가게 줄 */
.stores{display:flex;flex-direction:column}
.store{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;position:relative}
.store:last-child{border-bottom:0}
.store:active{background:var(--mint-ll)}
.store .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px;padding-top:2px}
.store .nm{display:flex;align-items:center;gap:6px;min-width:0}
.store .nm b{font-size:1.02rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{flex:0 0 auto;font-size:.66rem;font-weight:800;border-radius:4px;padding:1px 5px;background:var(--band);color:var(--sub)}
.mini.deliv{background:var(--blue-l);color:var(--blue)}
.store .meta,.meta{font-size:.8rem;color:var(--sub);font-weight:500}
.meta i{font-style:normal;margin:0 5px;color:#ccd0d3}
.store .menu-line{font-size:.8rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store .from{display:flex;gap:8px;align-items:baseline;font-size:.8rem;color:var(--mute)}
.store .from b{font-size:.86rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.store.look .nm b{color:#4a4d50}
.store.look .thumb{filter:saturate(.8)}
.badge{position:absolute;top:14px;right:0;background:var(--mint);color:#fff;border-radius:999px;font-size:.7rem;font-weight:800;padding:2px 8px}

/* 가게 화면 */
.view-store .top{position:absolute;left:0;right:0;max-width:520px;margin:0 auto;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.view-store .top h1{opacity:0}
.view-store .top .back{background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.view-store .top .chip-who{display:none}
.shop-hero{position:relative}
.shop-card{position:relative;margin:-28px 0 0;background:#fff;border-radius:22px 22px 0 0;padding:22px 16px 6px;text-align:center}
.shop-kind{font-size:.78rem;color:var(--sub);font-weight:600}
.shop-card h2{margin:4px 0 4px;font-size:1.45rem;font-weight:800}
.shop-rev{font-size:.84rem;color:var(--sub)}
.shop-rev b{color:var(--ink)}
.tagline{margin:8px auto 0;font-size:.86rem;color:var(--sub);max-width:30em}
.shop-acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));margin:16px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.shop-acts button,.shop-acts a{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;font-size:.74rem;font-weight:700;color:#444;text-decoration:none}
.shop-acts svg{width:22px;height:22px}
.shop-acts>*+*{border-left:1px solid var(--line)}
.facts{margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.fact{display:flex;gap:12px;font-size:.86rem;line-height:1.45}
.fact dt{flex:0 0 40px;color:var(--mute);font-weight:600}
.fact dd{margin:0;color:#333}
.tabs-line{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs-line button{flex:0 0 auto;border:0;background:none;padding:12px 0;font-weight:700;color:var(--mute);position:relative}
.tabs-line button.on{color:var(--ink)}
.tabs-line button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.menus{padding:0 16px}
.menu{position:relative;border-bottom:1px solid var(--line)}
.menu:last-child{border-bottom:0}
.menu-main{display:flex;gap:14px;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:16px 0}
.menu .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.menu .tags:empty{display:none}
.menu .name{font-weight:800;font-size:1rem;line-height:1.35}
.menu .desc{font-size:.8rem;color:var(--sub);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.menu .price{font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums;margin-top:2px}
.menu .price.unknown{color:#8a6100;font-weight:700;font-size:.86rem}
.menu.in .name::after{content:" · 담음";color:var(--mint-d);font-size:.8rem}
.m-emo{flex:0 0 96px;height:96px;border-radius:12px;display:grid;place-items:center;font-size:2.4rem;background:radial-gradient(100% 90% at 25% 15%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),var(--c)}
.m-ctl{position:absolute;right:6px;bottom:22px}
.qty{display:flex;align-items:center;border-radius:999px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px #d6dadc}
.qty button{border:0;background:none;width:32px;height:32px;font-size:1.1rem;font-weight:800;color:var(--ink)}
.qty b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums;font-size:.9rem}
.qty.big button{width:44px;height:44px;font-size:1.3rem}.qty.big b{min-width:30px;font-size:1.05rem}
.m-ctl .qty{box-shadow:0 1px 6px rgba(0,0,0,.16)}
.add{width:32px;height:32px;border:0;border-radius:50%;background:#fff;color:var(--ink);font-size:1.3rem;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 1px 6px rgba(0,0,0,.2)}
.shop-info h3{font-size:1rem;font-weight:800;margin:0 0 6px}
.shop-info p{margin:4px 0;font-size:.82rem;color:var(--sub);line-height:1.5}
.shop-info .src{color:var(--mute);font-size:.74rem;word-break:break-all}

/* 메뉴 시트 */
.sheet-bg{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:min(520px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;animation:up .24s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40%)}}
.sheet-x{position:absolute;right:12px;top:12px;z-index:3;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.92);font-weight:900;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.sheet-emo{height:230px;display:grid;place-items:center;font-size:4.6rem;background:radial-gradient(100% 90% at 25% 15%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),var(--c)}
.sheet-body{padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:4px 0 6px;font-size:1.35rem}
.sheet .muted{margin:0 0 4px}
.sheet-store{font-size:.8rem;color:var(--mute);font-weight:600}
.sheet-price{font-size:1.3rem;font-weight:800;margin:10px 0 14px;font-variant-numeric:tabular-nums}
.sheet-qty{display:flex;justify-content:space-between;align-items:center;padding:12px 0 16px;border-top:1px solid var(--line);font-weight:700}

/* 장바구니 */
.who-line{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:.95rem}
.who-line i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--band);display:grid;place-items:center}
.cart-store .cs-head{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.cart-store .cs-head>div:not(.thumb){flex:1;min-width:0}
.cart-store .nm{font-weight:700}
.stores+.more{display:block;width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;margin:6px 0 0;font-weight:700;font-size:.9rem;color:var(--ink)}
.cart-store .more{border:0;background:none;color:var(--mint-d);font-weight:700;font-size:.86rem;padding:10px 0 0}
.h3{display:block;font-weight:800;margin-bottom:8px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.quick button{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.8rem;font-weight:600;background:#fff;color:#444}
.quick button.on{border-color:var(--mint);background:var(--mint-ll);color:var(--mint-d);font-weight:800}
.summary .line{border-bottom:0;padding:4px 0}
.line{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.line:last-child{border-bottom:0}
.line b{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px));width:min(488px,calc(100% - 24px));z-index:24;background:var(--mint);color:#fff;border:0;border-radius:14px;padding:15px 18px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:1rem;box-shadow:0 6px 18px rgba(20,184,172,.35)}
.cartbar .n{background:#fff;color:var(--mint-d);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:.82rem}
.cartbar .sp{flex:1;text-align:left}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem;padding-top:12px;margin-top:8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:80px 24px}
.empty .big{font-size:3.6rem;opacity:.85}
.empty h2{margin:12px 0 6px}
.empty .btn{margin-top:14px}

/* 주문서 */
.view-done .wrap{padding-top:8px}
.steps{list-style:none;display:flex;gap:6px;padding:0;margin:8px 0 16px}
.steps li{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.74rem;font-weight:700;color:var(--mute);text-align:center}
.steps i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--band);color:var(--sub);font-size:.8rem}
.steps li.on{color:var(--mint-d)}.steps li.on i{background:var(--mint);color:#fff}
.ticket{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px}
.t-head{display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:12px;border-bottom:1px dashed #d8dcde;margin-bottom:8px}
.t-head span{font-size:.78rem;font-weight:700;color:var(--mint-d)}
.t-head b{font-size:1.3rem;font-weight:800}
.t-head small{color:var(--mute);font-weight:600}
.t-store{font-weight:800;margin:12px 0 4px;font-size:.9rem}
.t-line{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:.9rem;font-variant-numeric:tabular-nums;color:#333}
.t-req{margin-top:10px;background:var(--band);border-radius:10px;padding:8px 10px;font-size:.86rem}
.t-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px solid var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.t-total b{font-size:1.25rem}
.t-code{margin-top:16px;padding-top:12px;border-top:1px dashed #d8dcde;height:56px;overflow:hidden}
.t-code small{display:block;color:var(--mute);font-weight:600;font-size:.72rem;margin-bottom:3px}
.t-code code{display:block;font-size:.64rem;color:var(--sub);word-break:break-all;line-height:1.3}
.raw{margin-top:14px}
.raw summary{cursor:pointer;color:var(--sub);font-weight:700;font-size:.86rem;padding:6px 0}
.receipt{background:var(--band);border-radius:12px;padding:14px;white-space:pre-wrap;font-size:.86rem;line-height:1.55;word-break:break-all}
.code-box{width:100%;min-height:150px;font-size:.85rem}

/* 지도 */
.mapwrap{position:relative;display:flex;flex-direction:column;height:calc(100vh - var(--top-h) - var(--nav-h) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:420px}
.map{position:relative;flex:1;min-height:240px;background:#e8eef0}
.map-top{position:absolute;top:10px;left:12px;right:12px;z-index:500}
.map-btn{position:absolute;left:12px;z-index:500;width:44px;height:44px;border-radius:14px;border:0;background:var(--card);box-shadow:0 2px 10px rgba(20,40,45,.18);font-size:1.25rem}
.mapwrap .leaflet-top{top:62px}
.mapwrap .leaflet-bottom{bottom:14px}
.map-sheet{flex:0 0 auto;background:#fff;border-radius:18px 18px 0 0;padding:14px 16px 12px;box-shadow:0 -2px 14px rgba(0,0,0,.1);position:relative;z-index:501;margin-top:-14px}
.map-sheet .row{align-items:flex-start}
.map-sheet .name{font-size:1.1rem;font-weight:800;line-height:1.3}
.map-fallback{flex:1;overflow:auto;padding:66px 12px 24px}
.mpin{display:grid;place-items:center}
.mpin span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid var(--mint);font-size:1.15rem;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.mpin.rough span{border-style:dashed}
.mpin.sel span{width:46px;height:46px;background:var(--yellow);border-color:var(--mint-d);font-size:1.5rem}
.mpin.off{opacity:.35}
.mpin em{position:absolute;top:50px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-weight:800;font-size:.8rem;background:var(--ink);color:#fff;border-radius:8px;padding:3px 8px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.mpin.cluster span{background:var(--mint);color:#fff;border-color:#fff;font-weight:900;font-size:1rem;box-shadow:0 0 0 5px rgba(16,179,166,.25),0 3px 8px rgba(0,0,0,.25)}
.mpin.cluster b::before{content:"🍽 ";font-size:.8rem}
.mpin.camp span{width:44px;height:44px;background:var(--mint);border-color:#fff;font-size:1.35rem}
.leaflet-container{font-family:var(--body)}
.locator{position:fixed;inset:0;z-index:60;background:rgba(20,30,35,.55);display:grid;place-items:center;padding:12px}
.locator .box{background:var(--card);border-radius:20px;width:min(520px,100%);max-height:100%;overflow:auto;padding:14px}
.locator .lmap{position:relative;height:min(52vh,420px);border-radius:14px;overflow:hidden;margin:10px 0;background:#e8eef0}
.locator .lmap .cross{position:absolute;left:50%;top:50%;z-index:500;transform:translate(-50%,-100%);font-size:2.2rem;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}

/* 약도(지도를 못 불러올 때) */
.sketch{background:var(--card);border-radius:var(--r);padding:10px}
.sketch svg{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;font-family:var(--body)}

function minutesOf(hhmm) { const [h, m] = String(hhmm).split(':').map(Number); return h * 60 + (m || 0); }
function closed() { const d = new Date(); return d.getHours() * 60 + d.getMinutes() > minutesOf(CFG.deadline); }
function timeLeft() {
  const d = new Date(), left = minutesOf(CFG.deadline) - (d.getHours() * 60 + d.getMinutes());
  if (left <= 0) return '마감됐어요';
  return left >= 60 ? `${Math.floor(left / 60)}시간 ${left % 60}분 남음` : `${left}분 남음`;
}

// ---------- 주문 코드 (카톡으로 보내도 깨지지 않는 글자) ----------
// 모양: [DN1.<base64url JSON>.<검사값>]
function b64e(s) { let b = ''; for (const c of new TextEncoder().encode(s)) b += String.fromCharCode(c); return btoa(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64d(s) { const b = atob(s.replace(/-/g, '+').replace(/_/g, '/')); return new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0))); }
function check(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
function encodeOrder(o) { const body = b64e(JSON.stringify(o)); return `[DN1.${body}.${check(body)}]`; }
function decodeAll(text) {
  const found = [], broken = [];
  for (const m of String(text).matchAll(/DN1\.([A-Za-z0-9_-]+)\.([0-9a-z]+)/g)) {
    try {
      if (check(m[1]) !== m[2]) throw 0;
      const o = JSON.parse(b64d(m[1]));
      if (!o || typeof o.w !== 'string' || !Array.isArray(o.i)) throw 0;
      found.push({w: o.w.slice(0, 40), t: Number(o.t) || 0, r: String(o.r || '').slice(0, 200),
        i: o.i.filter(x => Array.isArray(x) && typeof x[0] === 'string').map(([id, n]) => [id.slice(0, 20), Math.max(0, Math.min(30, Number(n) || 0))]).filter(x => x[1] > 0)});
    } catch { broken.push(m[0].slice(0, 24)); }
  }
  return {found, broken};
}
const shortName = s => s.name.replace(/^\(예시\)\s*/, '');
function orderText(o) {
  const lines = o.i.map(([id, n]) => { const it = ITEMS.get(id); return it ? `· [${shortName(it.store)}] ${it.name} ${n}개` : `· (알 수 없는 메뉴 ${id}) ${n}개`; });
  const sum = o.i.reduce((a, [id, n]) => a + (ITEMS.get(id)?.price || 0) * n, 0);
  const unknown = o.i.some(([id]) => !ITEMS.get(id)?.price);
  return [`🛵 ${CFG.title} 주문서`, `👪 ${o.w}`, ...lines, ...(o.r ? [`💬 ${o.r}`] : []), `💰 ${won(sum)}${unknown ? ' (가격 모르는 메뉴 빼고)' : ''}`, '', '주문 코드 (지우지 말아 주세요)', encodeOrder(o)].join('\n');
}

// 복사: 갤러리 안의 격리된 화면에서는 클립보드가 막힐 수 있어서 두 번 시도하고, 그래도 안 되면 직접 복사하게 보여 줘요.
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.append(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); ta.remove();
    if (ok) return true;
  } catch {}
  return false;
}
async function copyOrShow(text, okMsg, boxId) {
  if (await copyText(text)) { toast(okMsg); return; }
  const box = document.getElementById(boxId);
  if (box) { box.hidden = false; const ta = box.querySelector('textarea'); ta.value = text; ta.focus(); ta.select(); }
  toast('글자를 길게 눌러 "전체 선택 → 복사" 해 주세요');
}

const ANIMALS = ['🐻', '🐰', '🦊', '🐼', '🐯', '🐨', '🐸', '🐵', '🐶', '🐱', '🦁', '🐷', '🐮', '🐔', '🐧', '🐳', '🦄', '🐙', '🐝', '🦉', '🐹', '🦒', '🐢', '🦔'];
function avatar(who) {

  if (i >= 0) return ANIMALS[i % ANIMALS.length];

}

// 마감까지 남은 시간 (30분 아래면 빨갛게)
function countdown(short = false) {
  const d = new Date(), left = minutesOf(CFG.deadline) - (d.getHours() * 60 + d.getMinutes());
  const cls = left <= 0 ? 'late' : left <= 30 ? 'soon' : '';
  const span = left >= 60 ? `${Math.floor(left / 60)}시간 ${left % 60}분` : `${left}분`;
  const text = left <= 0 ? (short ? '주문 마감' : `주문 마감(${esc(CFG.deadline)})이 지났어요`)
    : short ? `마감까지 <b>${span}</b>` : `주문 마감까지 <b>${span}</b> · ${esc(CFG.deadline)}`;
  return `<span class="countdown ${cls}${short ? ' short' : ''}" data-time${short ? '="short"' : ''} title="주문 마감 ${esc(CFG.deadline)}">⏰ ${text}</span>`;
}

// 릴 화면: 고르기 전에는 빈 접시, 고른 뒤에는 가게 그림·이름·걸리는 시간
function reelFace(s) {
  if (!s) return `<span class="r-emo">🍽️</span><span class="r-text"><span class="r-name picked-name">어디서 먹을까?</span><span class="r-sub">아래 버튼을 눌러 보세요</span></span>`;

// 슬롯 릴이 돌다가 천천히 멈추고, 색종이가 터져요(움직임 줄이기 설정이면 바로 보여 줘요).
function ddal() {
  const {ordering, list} = homeStores();
  if (!list.length || S.rolling) return;
  const pool = list.length > 1 ? list.filter(s => s.id !== S.pick) : list;
  const target = pool[Math.floor(Math.random() * pool.length)];
  buzz(15);
  if (S.view === 'map') { selectPin(target.id, true); return; }
  const reel = document.getElementById('reel'), box = document.getElementById('pickBox');
  const done = () => {
    S.rolling = false; S.pick = target.id;
    if (reel) { reel.innerHTML = reelFace(target); reel.classList.remove('spin'); reel.classList.add('has', 'hit'); }
    if (box) box.innerHTML = pickActions(target, ordering);
    confetti(reel); buzz([20, 40, 20]);
  };
  if (reduceMotion()) { done(); return; }
  S.rolling = true;
  if (box) box.innerHTML = '';
  reel?.classList.remove('hit', 'has'); reel?.classList.add('spin');
  let i = Math.floor(Math.random() * list.length), delay = 45;
  const spin = () => {
    const s = list[i++ % list.length];
    if (reel) reel.innerHTML = `<span class="r-emo">${esc(s.emoji)}</span><span class="r-text"><span class="r-name">${esc(s.name)}</span></span>`;
    delay *= 1.12;
    if (delay < 300) setTimeout(spin, delay); else setTimeout(done, 160);
  };
  spin();
}
function buzz(p) { try { navigator.vibrate?.(p); } catch {} }
// 색종이: 캔버스 하나를 잠깐 띄웠다가 지워요.
function confetti(from) {
  if (reduceMotion() || !from) return;
  const r = from.getBoundingClientRect(), cv = document.createElement('canvas');
  cv.className = 'confetti'; cv.width = innerWidth; cv.height = innerHeight; document.body.append(cv);
  const ctx = cv.getContext('2d'), colors = ['#12b5aa', '#ffd24a', '#ff7a59', '#7c9cff', '#ff5fa2'];
  const bits = Array.from({length: 70}, () => ({x: r.left + r.width / 2, y: r.top + r.height / 2, vx: (Math.random() - .5) * 9, vy: -Math.random() * 9 - 3, s: 4 + Math.random() * 5, c: colors[Math.floor(Math.random() * colors.length)], a: Math.random() * 6}));
  let t = 0;
  const step = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const b of bits) { b.x += b.vx; b.y += b.vy; b.vy += .32; b.a += .2; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore(); }
    if (++t < 70) requestAnimationFrame(step); else cv.remove();
  };
  step();
}

function openItem(id) {
  const it = ITEMS.get(id);
  if (!it) return;
  const s = it.store, ordering = isOpen(s);
  let q = Math.max(1, S.cart[id] || 1);
  closeSheet();
  const bg = document.createElement('div');
  bg.className = 'sheet-bg'; bg.id = 'sheet';
  const draw = () => {
    bg.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(it.name)}"><button class="sheet-x" data-act="item-close" aria-label="닫기">✕</button>
      <div class="sheet-emo" style="--c:${esc(s.color)}">${esc(it.emoji || s.emoji)}${photo(it.img)}</div>

      <div class="sheet-store">${esc(s.name)}</div>
      <div class="sheet-price">${price(it.price)}</div>
      ${ordering ? `<div class="sheet-qty"><span>수량</span><div class="qty big"><button data-act="sq" data-d="-1" aria-label="하나 빼기">−</button><b>${q}</b><button data-act="sq" data-d="1" aria-label="하나 더">+</button></div></div>
      <button class="btn block" data-act="sheet-add" data-id="${esc(id)}">${it.price ? `${won(it.price * q)} ` : ''}${S.cart[id] ? `${q}개로 바꾸기` : `${q}개 담기`}</button>`
      : `<p class="notice mint">맛집 구경 중이에요. 이 가게는 오늘 주문 받는 가게가 아니라 담을 수는 없어요.</p><button class="btn block line-dark" data-act="store" data-id="${esc(s.id)}">가게 둘러보기</button>`}</div></div>`;

}

}

function addOrders(list) {
  let added = 0, updated = 0, same = 0;
  for (const o of list) {
    const old = S.orders[o.w];
    if (!old) { S.orders[o.w] = o; added++; }
    else if (o.t > old.t) { S.orders[o.w] = o; updated++; }
    else same++;
  }
  persist();
  return {added, updated, same};
}

].join('\n');
function rebuild(cfg) {
  const json = JSON.stringify(cfg, null, 1).replace(/</g, '\\u003c');
  const tag = n => '<' + n; // 이 코드 안에 태그 글자를 그대로 쓰면 HTML 이 중간에 끊겨서 나눠 적어요.
  return ['<!doctype html>', '<html lang="ko">', '<head>', '<meta charset="utf-8">',
    '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">',
    `${tag('title')}>${esc(cfg.title)}${tag('/title')}>`,
    `<link rel="stylesheet" href="${FONT}">`,
    `${tag('style')} id="dn-style">${document.getElementById('dn-style').textContent}${tag('/style')}>`,
    '</head>', '<body>', '<div id="app"></div>', '<div id="toast" role="status" aria-live="polite"></div>',
    `${tag('!--')}${GUIDE}-->`,
    `${tag('script')} id="dn-config" type="application/json">`, json, `${tag('/script')}>`,
    `${tag('script')} id="dn-main">${document.getElementById('dn-main').textContent}${tag('/script')}>`,
    '</body>', '</html>', ''].join('\n');
}
function exportFile() {
  try {
    const url = URL.createObjectURL(new Blob([rebuild(CFG)], {type: 'text/html'}));
    const a = document.createElement('a');
    a.href = url; a.download = '저녁에-뭐-먹을래.html';
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('⬇ 파일 받기를 시작했어요. 안 받아지면 📋 앱 코드 복사를 써 주세요');
  } catch { toast('파일 받기가 안 돼요. 📋 앱 코드 복사를 써 주세요'); }
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'by-family': S.byFamily = el.checked; break;
    case 'who': go('who'); break;
    case 'pick': setWho(el.dataset.who); break;
    case 'pick-staff': {
      const name = document.getElementById('staffName').value.trim().replace(/\s+/g, ' ');
      if (!name) { toast('이름을 적어 주세요'); return; }
      setWho(/강사/.test(name) ? name : `${name} ${STAFF}`); break;
    }
    case 'home': case 'nav': go(act === 'home' ? 'home' : el.dataset.v); break;
    case 'cat': S.cat = el.dataset.cat; rerender(); break;
    case 'look-all': S.lookAll = true; rerender(); break;
    case 'store': go('store', {store: id, mfilter: 'all'}); break;
    case 'plus': case 'minus': {
      setQty(id, (S.cart[id] || 0) + (act === 'plus' ? 1 : -1)); rerender();
      if (act === 'plus') { bumpCart(); if (S.cart[id] === 1) toast(`🛒 ${ITEMS.get(id).name} 담았어요`); }
      break;
    }
    case 'item': openItem(id); break;
    case 'item-close': closeSheet(); break;
    case 'sheet-add': {
      const q = Number(document.querySelector('#sheet .sheet-qty b')?.textContent) || 1;
      const had = S.cart[id] || 0;
      setQty(id, q); closeSheet();
      if (!isOpen(ITEMS.get(id).store)) break;
      rerender();
      bumpCart(); toast(had ? `🛒 ${ITEMS.get(id).name} ${q}개로 바꿨어요` : `🛒 ${ITEMS.get(id).name} ${q}개 담았어요`);
      break;
    }
    case 'sort': S.sort = el.dataset.sort; save('dn-sort', S.sort); rerender(); break;
    case 'mfilter': S.mfilter = el.dataset.f; rerender(); break;
    case 'quick-req': {
      const t = el.dataset.t, parts = S.req.split(/\s*,\s*/).filter(Boolean);
      const next = parts.includes(t) ? parts.filter(p => p !== t) : [...parts, t];
      S.req = next.join(', ').slice(0, 100); persist(); rerender(); break;
    }
    case 'ddal': ddal(); break;
    case 'show-on-map': go('map', {pick: id, mapFocus: true}); break;
    case 'map-pin': if (!el.classList.contains('off')) selectPin(id, false); break;
    case 'sheet-close': selectPin(null, false); break;
    case 'map-camp': if (MAP && CFG.campPos.lat) MAP.flyTo([CFG.campPos.lat, CFG.campPos.lng], 12, {duration: 0.6}); break;
    case 'radius': S.radius = Number(el.dataset.i); save('dn-radius', S.radius); rerender(); break;
    case 'make': {
      S.req = (document.getElementById('req')?.value || '').trim().slice(0, 100);
      const o = {v: 1, w: S.who, t: Date.now(), i: cartLines(S.cart).map(l => [l.item.id, l.n]), r: S.req};
      S.last = {text: orderText(o), order: o}; persist(); go('done'); break;
    }
    case 'copy-order': {
      if (await copyText(S.last.text)) { S.last.copied = Date.now(); persist(); rerender(); toast(`📋 복사됐어요! ${CFG.manager} 카톡에 붙여넣어 주세요`); }
      else copyOrShow(S.last.text, '', 'copyBox');
      break;
    }
    case 'self-add': { const r = addOrders([S.last.order]); toast(r.same ? '이미 들어 있어요' : `✅ ${S.last.order.w} 주문을 넣었어요`); break; }
    case 'admin': if (S.adminSession) go('admin', {admin: true}); else go('pin'); break;
    case 'pin-ok': {
      if (document.getElementById('pin').value.trim() === CFG.adminPin) { S.adminSession = true; go('admin', {admin: true, tab: openStores().length ? 'get' : 'pick'}); }
      else toast('PIN 이 달라요');
      break;
    }
    case 'admin-exit': go(S.who ? 'home' : 'who', {admin: false}); break;
    case 'proxy': go('who', {admin: false}); break;
    case 'tab': S.tab = el.dataset.tab; S.editing = null; render(); scrollTo(0, 0); break;
    case 'read': {
      const {found, broken} = decodeAll(document.getElementById('paste').value);
      if (!found.length) { document.getElementById('readResult').innerHTML = `<div class="notice red">주문 코드를 찾지 못했어요${broken.length ? ` (깨진 코드 ${broken.length}개 — 글자가 잘렸는지 확인해 주세요)` : ''}.</div>`; return; }
      const r = addOrders(found);
      render();
      document.getElementById('readResult').innerHTML = `<div class="notice mint">✅ 새 주문 <b>${r.added}</b> · 고친 주문 <b>${r.updated}</b> · 이미 있던 것 ${r.same}${broken.length ? `<br>⚠️ 깨진 코드 ${broken.length}개는 다시 받아 주세요` : ''}<br><button class="small-btn" data-act="tab" data-tab="sum">주문 정리 보기</button></div>`;
      break;
    }
    case 'copy-owner': { const g = storeTotals().groups[Number(el.dataset.i)]; copyOrShow(ownerMessage(g), '사장님께 보낼 메시지를 복사했어요 📋', 'ownerBox' + el.dataset.i); break; }
    case 'copy-remind': copyOrShow(document.getElementById('remindText').value, '알림 글을 복사했어요 📣', 'remindBox'); break;
    case 'del': if (confirmTwice(el, '한 번 더 누르면 지워요')) { delete S.orders[el.dataset.who]; persist(); render(); } break;
    case 'reset': if (confirmTwice(el, '정말요? 한 번 더 누르면 모두 지워요')) { S.orders = {}; persist(); render(); toast('모두 지웠어요'); } break;
    case 'backup': {
      const text = Object.values(S.orders).map(o => `${o.w} ${encodeOrder(o)}`).join('\n');
      if (!text) { toast('받은 주문이 없어요'); return; }
      copyOrShow(text, `주문 ${Object.keys(S.orders).length}개를 복사했어요`, 'backupBox'); break;
    }
    case 'print': try { print(); } catch { toast('이 화면에서는 인쇄가 안 돼요'); } break;
    case 'copy-addr': { const s = storeById(id); copyOrShow(s.address, '📍 주소를 복사했어요. 지도 앱에 붙여넣어 보세요', ''); break; }
    case 'copy-phone': { const s = storeById(id); copyOrShow(s.phone, '📞 전화번호를 복사했어요', ''); break; }
    // 가게 고르기·고치기
    case 'pick-store': {
      CFG = clone(CFG);
      CFG.picked = el.checked ? [...new Set([...CFG.picked, id])] : CFG.picked.filter(x => x !== id);
      CFG.picked = CFG.stores.map(s => s.id).filter(x => CFG.picked.includes(x)); // 가게 순서대로
      saveDraft();
      // 줄 순서는 그대로 두고(누르자마자 위로 튀지 않게) 그 줄과 아래 막대만 새로 그려요.
      el.closest('.prow').outerHTML = pickRow(storeById(id));
      document.querySelector('.share-bar').outerHTML = shareBar();
      for (const b of document.querySelectorAll('.filter-chips button')) { const f = pickFilters().find(([k]) => k === b.dataset.f); if (f) b.querySelector('small').textContent = f[2]; }
      break;
    }
    case 'pick-filter': S.pickFilter = el.dataset.f; rerender(); break;
    case 'sum-by': S.sumBy = el.dataset.by; rerender(); break;
    case 'copy-link': {
      const text = `🍽 ${CFG.title}\n${CFG.camp ? CFG.camp + ' ' : ''}저녁 메뉴를 골라 주세요! (주문 마감 ${CFG.deadline})\n${shareLink()}`;
      await copyOrShow(text, '🔗 복사했어요. 단톡방에 붙여넣어 보내 주세요', 'linkBox');
      save('dn-sent', JSON.stringify(diffCfg(CFG)));
      document.querySelector('.share-bar').outerHTML = shareBar();
      break;
    }
    case 'edit-store': S.editing = S.editing === id ? null : id; render(); break;
    case 'locate': openLocator(el.dataset.kind, id); break;
    case 'loc-cancel': closeLocator(); break;
    case 'loc-ok': {
      const typed = parseLatLng(document.getElementById('latlng')?.value || '');
      const c = LOCMAP ? LOCMAP.getCenter() : null;
      const p = typed || (c ? [round5(c.lat), round5(c.lng)] : null);
      if (!p) { toast('위도, 경도를 "36.56842, 128.72941" 처럼 적어 주세요'); return; }
      CFG = clone(CFG);
      if (el.dataset.kind === 'camp') CFG.campPos = {lat: p[0], lng: p[1], ok: true};
      else { const s = storeById(el.dataset.id); if (s) { s.lat = p[0]; s.lng = p[1]; s.posOk = true; } }
      saveDraft(); closeLocator(); const y = scrollY; render(); scrollTo(0, y); toast('📍 위치를 정했어요'); break;
    }
    case 'menu-add': {
      CFG = clone(CFG);
      const s = storeById(id);
      s.menu.push({id: uid(s.id + '-'), name: '새 메뉴', emoji: '', price: 0, desc: '', tags: []});
      saveDraft(); render(); break;
    }
    case 'menu-del': {
      if (!confirmTwice(el, '지울까요?')) break;
      CFG = clone(CFG);
      for (const s of CFG.stores) s.menu = s.menu.filter(m => m.id !== id);
      saveDraft(); render(); break;
    }
    case 'store-new': {
      CFG = clone(CFG);
      const s = tidy({stores: [{id: uid('s'), name: '새 가게', menu: [{id: 'x', name: '새 메뉴'}]}]}).stores[0];
      s.menu[0].id = uid(s.id + '-');
      CFG.stores.push(s); S.editing = s.id; saveDraft(); render();
      document.querySelector(`[data-store="${s.id}"][data-field="name"]`)?.focus(); break;
    }
    case 'store-del': {
      if (!confirmTwice(el, '한 번 더 누르면 가게를 지워요')) break;
      CFG = clone(CFG);
      CFG.stores = CFG.stores.filter(s => s.id !== id); CFG.picked = CFG.picked.filter(x => x !== id);
      S.editing = null; saveDraft(); render(); break;
    }
    case 'draft-undo': if (confirmTwice(el, '한 번 더 누르면 되돌려요')) { CFG = BASE; S.editing = null; saveDraft(); render(); toast('처음 메뉴판으로 되돌렸어요. 링크를 다시 보내 주세요'); } break;
    case 'export-file': exportFile(); break;
    case 'export-copy': copyOrShow(rebuild(CFG), '📋 앱 코드를 복사했어요. 갤러리 ✏️ 고치기에 붙여넣어 주세요', 'exportBox'); break;
  }
});
// 입력칸: 요청 사항, 담당자 설정(시간·장소·가게·메뉴)
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'req') { S.req = t.value.slice(0, 100); persist(); return; }
  if (t.id === 'pickSearch') { S.pickQuery = t.value; refreshPick(); return; }
  if (!S.adminSession) return;
  const value = ['price', 'minutes'].includes(t.dataset.field) ? Math.max(0, Math.round(Number(t.value) || 0)) : t.value.trim();
  if (t.dataset.cfg) { CFG = clone(CFG); CFG[t.dataset.cfg] = value; }
  else if (t.dataset.store) { CFG = clone(CFG); const s = storeById(t.dataset.store); if (s) s[t.dataset.field] = value; }
  else if (t.dataset.menu) { CFG = clone(CFG); for (const s of CFG.stores) for (const m of s.menu) if (m.id === t.dataset.menu) m[t.dataset.field] = value; }
  else return;
  saveDraft();
});
// 다 적고 나면(칸을 벗어나면) 안내 문구·미리보기를 새로 그려요.
document.addEventListener('change', e => { if (S.view === 'admin' && (e.target.dataset.cfg || e.target.dataset.store || e.target.dataset.menu)) { const y = scrollY; render(); scrollTo(0, y); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('locator')) { closeLocator(); return; }
  if (e.key === 'Escape' && document.getElementById('sheet')) { closeSheet(); return; }
  if (e.key !== 'Enter') return;
  if (e.target.dataset?.act === 'map-pin') { e.target.dispatchEvent(new MouseEvent('click', {bubbles: true})); return; }
  if (e.target.id === 'pin') document.querySelector('[data-act="pin-ok"]')?.click();
  if (e.target.id === 'staffName') document.querySelector('[data-act="pick-staff"]')?.click();
  if (e.target.id === 'latlng') document.querySelector('[data-act="loc-ok"]')?.click();
});
// 다른 사람으로 바꾸면 장바구니를 비워요(담당자가 한 기기로 여러 가족 주문을 대신 받을 때 섞이지 않게).
function setWho(who) {
  if (who !== S.who) { S.cart = {}; S.req = ''; S.last = null; }
  S.who = who; persist(); go('home');
}
function confirmTwice(el, msg) {
  if (el.dataset.armed) return true;
  el.dataset.armed = '1'; const old = el.textContent; el.textContent = msg;
  setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = old; } }, 3000);
  return false;
}
S.view = S.who ? 'home' : 'who';
render();
setInterval(() => { for (const p of document.querySelectorAll('[data-time]')) p.outerHTML = countdown(p.dataset.time === 'short'); }, 30000);
</script>
</body>
</html>
